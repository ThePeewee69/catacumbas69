spring.application.name=cataponte
server.port=8082

# ── Runtime ────────────────────────────────────────────────────────────────────
# Virtual threads for request handling and bridge workers (PERF)
spring.threads.virtual.enabled=true
# Graceful shutdown: workers drain in-flight messages before the pod stops (RES-7, OPS-5)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.task.scheduling.pool.size=3

# ── MongoDB (SPRING_DATA_MONGODB_URI overrides; local: NodePort + directConnection=true) ──
spring.data.mongodb.uri=mongodb://catacumbas69-svc.mongodb.svc.cluster.local:27017/catacumbas69?replicaSet=catacumbas69
cataponte.mongo.server-selection-timeout=5s
cataponte.mongo.connect-timeout=5s
cataponte.mongo.read-timeout=30s

# ── Pulsar client (RES-2, RES-3) ───────────────────────────────────────────────
cataponte.pulsar.broker-url=${PULSAR_BROKER_URL:pulsar://pulsar.pulsar.svc.cluster.local:6650}
# Mac/IntelliJ: PULSAR_LISTENER_NAME=external; in a pod: leave empty
cataponte.pulsar.listener-name=${PULSAR_LISTENER_NAME:}
cataponte.pulsar.connection-timeout=10s
cataponte.pulsar.operation-timeout=30s
cataponte.pulsar.starting-backoff=100ms
cataponte.pulsar.max-backoff=30s
# Admin HTTP API: creates the namespace and topics at start-up (ADR 0008); Mac/IntelliJ: the admin NodePort URL
cataponte.pulsar.service-url=${PULSAR_SERVICE_URL:http://pulsar.pulsar.svc.cluster.local:8080}
cataponte.pulsar.admin-connect-timeout=5s
cataponte.pulsar.admin-read-timeout=30s
cataponte.pulsar.admin-request-timeout=60s

# ── Bridges (PERF-2..4, RES-5, RES-7, RES-8) ──────────────────────────────────
cataponte.bridge.reconcile-interval=PT5S
cataponte.bridge.default-max-in-flight=1000
cataponte.bridge.send-timeout=30s
cataponte.bridge.batching-max-publish-delay=1ms
cataponte.bridge.batching-max-messages=1000
cataponte.bridge.receiver-queue-size=1000
cataponte.bridge.acknowledgment-group-time=100ms
cataponte.bridge.negative-ack-redelivery-delay=1s
cataponte.bridge.start-backoff-initial=1s
cataponte.bridge.start-backoff-max=60s
cataponte.bridge.shutdown-timeout=20s

# ── Traffic counts per bridge, topic and minute → MongoDB, written in batches ──
cataponte.traffic.flush-interval=PT5S

# ── CORS (API-7) — closed: browsers reach bridges through Catapulsar (ADR 0001); comma-separated origins ──
cataponte.cors.allowed-origins=${CATAPONTE_CORS_ALLOWED_ORIGINS:}

# ── Events (ADR 0008, catacommons): namespace catacumbas69/cataponte, created at start-up ──
catacommons.app=cataponte
# Retries after a failed publish (then ERROR with the full event); retention 7 days / 1 GB per topic,
# backlog quota 1 GB (producer_exception). Defaults in CatacommonsProperties; override with e.g.
# CATACOMMONS_EVENTS_RETRY_DELAYS=1s,2s,4s or CATACOMMONS_PROVISIONING_EVENTS_RETENTION_TIME=7d

# ── Actuator / observability (OBS-1, OBS-2) ────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.readiness.include=readinessState,mongo
management.metrics.tags.application=${spring.application.name}
# In the cluster set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs for JSON logs (OBS-3)

# ── API docs (API-6) ───────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.catacumbas69.cataponte=INFO
logging.level.org.apache.pulsar=WARN
