spring.application.name=pulsario
server.port=8081

# Pulsar endpoints — overridden by env vars in the pod (PULSAR_SERVICE_URL, PULSAR_BROKER_URL)
pulsar.service-url=${PULSAR_SERVICE_URL:http://pulsar.pulsar.svc.cluster.local:8080}
pulsar.broker-url=${PULSAR_BROKER_URL:pulsar://pulsar.pulsar.svc.cluster.local:6650}
# Listener para acesso externo (Mac/IntelliJ: PULSAR_LISTENER_NAME=external; pod: deixar vazio)
pulsar.listener-name=${PULSAR_LISTENER_NAME:}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging
logging.level.com.catacumbas69=INFO
logging.level.org.apache.pulsar=WARN

# Static resources — força o browser a revalidar sempre (evita JS/CSS antigos em cache)
spring.web.resources.cache.cachecontrol.no-cache=true
