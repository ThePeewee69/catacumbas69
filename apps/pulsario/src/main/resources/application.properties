spring.application.name=pulsario
server.port=8081

# ── Runtime ────────────────────────────────────────────────────────────────────
# Virtual threads: Pulsar admin and Passário calls are blocking I/O (PERF)
spring.threads.virtual.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ── Pulsar (env vars override; Mac/IntelliJ: PULSAR_LISTENER_NAME=external) ───
pulsario.pulsar.service-url=${PULSAR_SERVICE_URL:http://pulsar.pulsar.svc.cluster.local:8080}
pulsario.pulsar.broker-url=${PULSAR_BROKER_URL:pulsar://pulsar.pulsar.svc.cluster.local:6650}
pulsario.pulsar.listener-name=${PULSAR_LISTENER_NAME:}
pulsario.pulsar.connection-timeout=10s
pulsario.pulsar.operation-timeout=30s
pulsario.pulsar.admin-connect-timeout=5s
pulsario.pulsar.admin-read-timeout=30s
pulsario.pulsar.admin-request-timeout=30s
pulsario.pulsar.producer-idle-timeout=5m
pulsario.pulsar.max-cached-producers=50
pulsario.pulsar.max-peek-count=100

# ── Passário (bridges BFF, ARCH-2) — Mac/IntelliJ: PASSARIO_URL=http://localhost:8082 ──
pulsario.passario.url=${PASSARIO_URL:http://passario:8082}
pulsario.passario.connect-timeout=2s
pulsario.passario.read-timeout=10s

# ── MongoDB audit log (SPRING_DATA_MONGODB_URI overrides) ──────────────────────
spring.data.mongodb.uri=mongodb://catacumbas69-svc.mongodb.svc.cluster.local:27017/catacumbas69?replicaSet=catacumbas69
pulsario.mongo.server-selection-timeout=5s
pulsario.mongo.connect-timeout=5s
pulsario.mongo.read-timeout=30s

# ── Actuator / observability (OBS-1, OBS-2) ────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
# Pulsar, Passário and MongoDB are reported but kept out of readiness: the UI degrades per feature (RES-12)
management.endpoint.health.group.readiness.include=readinessState
management.metrics.tags.application=${spring.application.name}
# In the cluster set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs for JSON logs (OBS-3)

# ── API docs (API-6) ───────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Static resources: always revalidate, assets are versioned with ?v=N (UI-2) ─
spring.web.resources.cache.cachecontrol.no-cache=true

logging.level.com.catacumbas69=INFO
logging.level.org.apache.pulsar=WARN
