spring.application.name=catavigia
server.port=8085

# ── Runtime ────────────────────────────────────────────────────────────────────
spring.threads.virtual.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ── MongoDB (SPRING_DATA_MONGODB_URI overrides; local: NodePort + directConnection=true) ──
spring.data.mongodb.uri=mongodb://catacumbas69-svc.mongodb.svc.cluster.local:27017/catacumbas69?replicaSet=catacumbas69
catavigia.mongo.server-selection-timeout=5s
catavigia.mongo.connect-timeout=5s
catavigia.mongo.read-timeout=30s

# ── Pulsar admin API and client (RES-2) — Mac/IntelliJ: the NodePort URLs and PULSAR_LISTENER_NAME=external ──
catavigia.pulsar.service-url=${PULSAR_SERVICE_URL:http://pulsar.pulsar.svc.cluster.local:8080}
catavigia.pulsar.connect-timeout=5s
catavigia.pulsar.read-timeout=30s
catavigia.pulsar.request-timeout=60s
catavigia.pulsar.broker-url=${PULSAR_BROKER_URL:pulsar://pulsar.pulsar.svc.cluster.local:6650}
catavigia.pulsar.listener-name=${PULSAR_LISTENER_NAME:}
catavigia.pulsar.connection-timeout=10s
catavigia.pulsar.operation-timeout=30s

# ── Check tasks: catacumbas69/catavigia/check-tasks, one per check and round (ADR 0015, orch.md 75) ──
# Every instance publishes the tasks and joins this Shared subscription; the first to claim a task runs it
catavigia.tasks.subscription=catavigia
catavigia.tasks.receiver-queue-size=1
catavigia.tasks.subscribe-retry-interval=10s
# A task that failed (MongoDB, Pulsar, or the check's source) is delivered again after 10 s, doubling up to 5 min,
# and goes to the DLQ after dlq.max-deliveries deliveries (orch.md 79)
catavigia.tasks.retry-delay=10s
catavigia.tasks.max-retry-delay=5m
# Task claims (catavigia_task_runs) are deleted by a TTL index after this long
catavigia.tasks.run-retention=6h

# ── Checks (ADR 0015). Interval, debounce, backlog limit and stale intervals are shared settings (alerts.*) ──
catavigia.checks.initial-delay=15s
# Timeout of every HTTP call to an app (health, Cataponte bridge status, Catametricas)
catavigia.checks.http-timeout=5s
# pulsar.broker.down opens when fewer brokers are active than this; pulsar.bookie.down when brokers are active but
# the broker health check fails (Pulsar's admin API lists bookies that are down too, so they are not counted)
catavigia.checks.expected-brokers=${CATAVIGIA_EXPECTED_BROKERS:1}
# A consumer replica that has not reported for this long is gone, not paused
catavigia.checks.consumer-stale-after=30s

# ── The apps it watches. Cataponte, Cataudit and Catametricas: the URLs set in Catapulsar's Settings
#    (settings topic) win over these; Catapulsar's own URL is only this one (orch.md 78) ──
catavigia.apps.catapulsar-url=${CATAPULSAR_URL:http://catapulsar:8081}
catavigia.apps.cataponte-url=${CATAPONTE_URL:http://cataponte:8082}
catavigia.apps.catametricas-url=${CATAMETRICAS_URL:http://catametricas:8083}
catavigia.apps.cataudit-url=${CATAUDIT_URL:http://cataudit:8084}

# ── Query API ──────────────────────────────────────────────────────────────────
catavigia.api.default-page-size=50
catavigia.api.max-page-size=500

# ── Events (ADR 0008, catacommons): namespace catacumbas69/catavigia, created at start-up ──
catacommons.app=catavigia
# Cataponte, where the audit-catavigia bridge is registered at start-up (ADR 0009)
catacommons.audit-bridge.cataponte-url=${CATAPONTE_URL:http://cataponte:8082}
# Shared settings (ADR 0011): alerts.*, dlq.max-deliveries and the app URLs
catacommons.settings.enabled=true

# ── Consumer control (ADR 0015): DLQ after N deliveries, pause while MongoDB or Pulsar's admin API is down,
#    pause/resume/check by hand ──
catacommons.consumers.enabled=true
catacommons.consumers.max-deliveries=10

# ── Actuator / observability (OBS-1, OBS-2) ────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.readiness.include=readinessState
management.metrics.tags.application=${spring.application.name}
# In the cluster set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs for JSON logs (OBS-3)

# ── API docs (API-6) ───────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.catacumbas69.catavigia=INFO
logging.level.org.apache.pulsar=WARN
# The Pulsar client logs, at WARN and with a full stack trace, failures our code already handles and logs in one
# line: lookups of a topic whose namespace does not exist yet (retried) and 409 "already exists" while
# provisioning (ignored). Real failures still show through our own messages (OBS-9).
logging.level.org.apache.pulsar.client.impl.BinaryProtoLookupService=ERROR
logging.level.org.apache.pulsar.client.impl.PulsarClientImpl=ERROR
logging.level.org.apache.pulsar.client.admin.internal.BaseResource=ERROR
