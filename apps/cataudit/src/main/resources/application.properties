spring.application.name=cataudit
server.port=8084

# ── Runtime ────────────────────────────────────────────────────────────────────
spring.threads.virtual.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ── MongoDB (SPRING_DATA_MONGODB_URI overrides; local: NodePort + directConnection=true) ──
spring.data.mongodb.uri=mongodb://catacumbas69-svc.mongodb.svc.cluster.local:27017/catacumbas69?replicaSet=catacumbas69
cataudit.mongo.server-selection-timeout=5s
cataudit.mongo.connect-timeout=5s
cataudit.mongo.read-timeout=30s

# ── Pulsar (RES-2) — Mac/IntelliJ: the NodePort URLs and PULSAR_LISTENER_NAME=external ──
cataudit.pulsar.service-url=${PULSAR_SERVICE_URL:http://pulsar.pulsar.svc.cluster.local:8080}
cataudit.pulsar.broker-url=${PULSAR_BROKER_URL:pulsar://pulsar.pulsar.svc.cluster.local:6650}
cataudit.pulsar.listener-name=${PULSAR_LISTENER_NAME:}
cataudit.pulsar.connection-timeout=10s
cataudit.pulsar.operation-timeout=30s
cataudit.pulsar.admin-connect-timeout=5s
cataudit.pulsar.admin-read-timeout=30s
cataudit.pulsar.admin-request-timeout=60s

# ── Audit topic consumer (ADR 0009, ADR 0012: Shared, every replica takes a share) ──
cataudit.consumer.subscription=cataudit
cataudit.consumer.receiver-queue-size=500
cataudit.consumer.negative-ack-redelivery-delay=10s
cataudit.consumer.retry-interval=10s

# ── Query API ──────────────────────────────────────────────────────────────────
cataudit.api.default-page-size=50
cataudit.api.max-page-size=500

# ── Events (ADR 0008, catacommons): namespace catacumbas69/cataudit with the audit topic ──
catacommons.app=cataudit
# Cataudit has nothing to audit: no audit-cataudit bridge
catacommons.audit-bridge.enabled=false

# ── Actuator / observability (OBS-1, OBS-2) ────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.readiness.include=readinessState
management.metrics.tags.application=${spring.application.name}
# In the cluster set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs for JSON logs (OBS-3)

# ── API docs (API-6) ───────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.catacumbas69.cataudit=INFO
logging.level.org.apache.pulsar=WARN
