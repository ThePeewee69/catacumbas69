spring.application.name=passario
server.port=8082

# ── Runtime ────────────────────────────────────────────────────────────────────
# Virtual threads for request handling and bridge workers (PERF)
spring.threads.virtual.enabled=true
# Graceful shutdown: workers drain in-flight messages before the pod stops (RES-7, OPS-5)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.task.scheduling.pool.size=3

# ── MongoDB (SPRING_DATA_MONGODB_URI overrides; local: NodePort + directConnection=true) ──
spring.data.mongodb.uri=mongodb://catacumbas69-svc.mongodb.svc.cluster.local:27017/catacumbas69?replicaSet=catacumbas69
passario.mongo.server-selection-timeout=5s
passario.mongo.connect-timeout=5s
passario.mongo.read-timeout=30s

# ── Pulsar client (RES-2, RES-3) ───────────────────────────────────────────────
passario.pulsar.broker-url=${PULSAR_BROKER_URL:pulsar://pulsar.pulsar.svc.cluster.local:6650}
# Mac/IntelliJ: PULSAR_LISTENER_NAME=external; in a pod: leave empty
passario.pulsar.listener-name=${PULSAR_LISTENER_NAME:}
passario.pulsar.connection-timeout=10s
passario.pulsar.operation-timeout=30s
passario.pulsar.starting-backoff=100ms
passario.pulsar.max-backoff=30s

# ── Bridges (PERF-2..4, RES-5, RES-7, RES-8) ──────────────────────────────────
passario.bridge.reconcile-interval=PT5S
passario.bridge.default-max-in-flight=1000
passario.bridge.send-timeout=30s
passario.bridge.batching-max-publish-delay=1ms
passario.bridge.batching-max-messages=1000
passario.bridge.receiver-queue-size=1000
passario.bridge.acknowledgment-group-time=100ms
passario.bridge.negative-ack-redelivery-delay=1s
passario.bridge.start-backoff-initial=1s
passario.bridge.start-backoff-max=60s
passario.bridge.shutdown-timeout=20s

# ── Traffic counts per bridge, topic and minute → MongoDB, written in batches ──
passario.traffic.flush-interval=PT5S

# ── CORS (API-7) — closed: browsers reach bridges through Pulsário (ADR 0001); comma-separated origins ──
passario.cors.allowed-origins=${PASSARIO_CORS_ALLOWED_ORIGINS:}

# ── Actuator / observability (OBS-1, OBS-2) ────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.readiness.include=readinessState,mongo
management.metrics.tags.application=${spring.application.name}
# In the cluster set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs for JSON logs (OBS-3)

# ── API docs (API-6) ───────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.catacumbas69.passario=INFO
logging.level.org.apache.pulsar=WARN
