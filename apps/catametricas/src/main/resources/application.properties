spring.application.name=catametricas
server.port=8083

# ── Runtime ────────────────────────────────────────────────────────────────────
spring.threads.virtual.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ── MongoDB (SPRING_DATA_MONGODB_URI overrides; local: NodePort + directConnection=true) ──
spring.data.mongodb.uri=mongodb://catacumbas69-svc.mongodb.svc.cluster.local:27017/catacumbas69?replicaSet=catacumbas69
catametricas.mongo.server-selection-timeout=5s
catametricas.mongo.connect-timeout=5s
catametricas.mongo.read-timeout=30s

# ── Pulsar admin API and client (RES-2) — Mac/IntelliJ: PULSAR_SERVICE_URL=http://192.168.86.35:31080 ──
catametricas.pulsar.service-url=${PULSAR_SERVICE_URL:http://pulsar.pulsar.svc.cluster.local:8080}
catametricas.pulsar.connect-timeout=5s
catametricas.pulsar.read-timeout=30s
catametricas.pulsar.request-timeout=60s
# Binary client: publishes events (ADR 0008); Mac/IntelliJ: PULSAR_LISTENER_NAME=external
catametricas.pulsar.broker-url=${PULSAR_BROKER_URL:pulsar://pulsar.pulsar.svc.cluster.local:6650}
catametricas.pulsar.listener-name=${PULSAR_LISTENER_NAME:}
catametricas.pulsar.connection-timeout=10s
catametricas.pulsar.operation-timeout=30s

# ── Collection (ADR 0007) ──────────────────────────────────────────────────────
# Default interval; the value in pulsario_settings (edited in Catapulsar) wins. Accepted range 15–600 s.
catametricas.collect.default-interval-seconds=${CATAMETRICAS_COLLECT_INTERVAL_SECONDS:60}
catametricas.collect.initial-delay=10s
# Parallel topic-stats calls to Pulsar per collection
catametricas.collect.concurrency=8
# Per-minute history is deleted by a TTL index after this long; hourly history and totals are kept forever
catametricas.collect.minute-retention=30d
# Skip Pulsar system topics (names starting with "__", e.g. __change_events)
catametricas.collect.skip-system-topics=true

# ── Events (ADR 0008, catacommons): namespace catacumbas69/catametricas, created at start-up ──
catacommons.app=catametricas
# Retries after a failed publish (then ERROR with the full event); retention 7 days / 1 GB per topic,
# backlog quota 1 GB (producer_exception). Defaults in CatacommonsProperties; override with e.g.
# CATACOMMONS_EVENTS_RETRY_DELAYS=1s,2s,4s or CATACOMMONS_PROVISIONING_EVENTS_RETENTION_TIME=7d

# ── Actuator / observability (OBS-1, OBS-2) ────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.readiness.include=readinessState
management.metrics.tags.application=${spring.application.name}
# In the cluster set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs for JSON logs (OBS-3)

logging.level.com.catacumbas69.catametricas=INFO
logging.level.org.apache.pulsar=WARN
