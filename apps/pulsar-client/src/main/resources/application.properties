spring.application.name=pulsar-client
server.port=8081

# Pulsar endpoints — overridden by env vars in the pod (PULSAR_SERVICE_URL, PULSAR_BROKER_URL)
pulsar.service-url=${PULSAR_SERVICE_URL:http://pulsar.pulsar.svc.cluster.local:8080}
pulsar.broker-url=${PULSAR_BROKER_URL:pulsar://pulsar.pulsar.svc.cluster.local:6650}

# MongoDB — auditoria (MONGODB_URI é definido como env var no pod)
# Dentro do cluster: replica set completo
# Local (IntelliJ): mongodb://peewee69:PASS@192.168.86.35:32017/catacumbas69?authSource=admin&directConnection=true
spring.data.mongodb.uri=${MONGODB_URI:mongodb://peewee69:password@catacumbas69-0.catacumbas69-svc.mongodb.svc.cluster.local:27017,catacumbas69-1.catacumbas69-svc.mongodb.svc.cluster.local:27017,catacumbas69-2.catacumbas69-svc.mongodb.svc.cluster.local:27017/catacumbas69?authSource=admin&replicaSet=catacumbas69}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging
logging.level.com.catacumbas69=INFO
logging.level.org.apache.pulsar=WARN
logging.level.org.springframework.data.mongodb=WARN
