spring.application.name=catasonarr
server.port=8086
# Behind the router's HTTPS (edge): X-Forwarded-Proto makes the redirect URIs given to Dex and the session cookie
# https (SEC-2, orch.md decision 109)
server.forward-headers-strategy=native

# ── Runtime ────────────────────────────────────────────────────────────────────
spring.threads.virtual.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ── Login (orch.md decision 109). Mac/IntelliJ: SPRING_PROFILES_ACTIVE=no-auth turns both off ──
# The page: Dex, as Catapulsar (SEC-2)
catasonarr.auth.issuer=${CATASONARR_AUTH_ISSUER:https://auth.catacumbas69.com}
catasonarr.auth.client-id=${CATASONARR_AUTH_CLIENT_ID:catasonarr}
# Secret catasonarr-oidc, written by microshift/apps/dex/dex-secret.sh; never in git
catasonarr.auth.client-secret=${CATASONARR_AUTH_CLIENT_SECRET:}
# Sonarr's API v3: the API key of the Sonarr it replaces, in X-Api-Key or ?apikey=. Secret catasonarr-api-key,
# written by microshift/apps/catacumbas69-apps/catasonarr/catasonarr-secret.sh; never in git
catasonarr.auth.api-key=${CATASONARR_AUTH_API_KEY:}
# A day without use; the session is in memory (one replica)
server.servlet.session.timeout=24h

# ── What /api/v3/system/status says to Sonarr's clients (orch.md decision 109) ──
catasonarr.compat.instance-name=${CATASONARR_INSTANCE_NAME:Catasonarr}
# The version of the Sonarr it replaces, so the clients' version checks pass
catasonarr.compat.version=${CATASONARR_SONARR_VERSION:4.0.20.0}

# ── Series and episodes (orch.md decision 112): TVmaze (free, no key, CC BY-SA), completed by TMDB with the images
#    and the summary in Portuguese. TMDB is off without a token (Secret catasonarr-tmdb, catasonarr-secret.sh tmdb) ──
catasonarr.metadata.tvmaze-url=${CATASONARR_TVMAZE_URL:https://api.tvmaze.com}
# TVmaze allows 20 calls every 10 s per address: one every 600 ms stays under it
catasonarr.metadata.tvmaze-spacing=600ms
catasonarr.metadata.tmdb-url=${CATASONARR_TMDB_URL:https://api.themoviedb.org/3}
catasonarr.metadata.tmdb-image-url=https://image.tmdb.org/t/p/original
catasonarr.metadata.tmdb-token=${CATASONARR_TMDB_TOKEN:}
catasonarr.metadata.language=pt-PT
catasonarr.metadata.connect-timeout=5s
catasonarr.metadata.read-timeout=20s
# Every series is refreshed every 12 h, as Sonarr; the ones TVmaze did not change are skipped (ISO durations: they
# are read by @Scheduled too)
catasonarr.metadata.refresh-interval=PT12H
catasonarr.metadata.refresh-initial-delay=PT10M

# ── Plex (orch.md decision 122): told to scan a series' folder after each import. The address and the switch are in
#    Settings; the token only here, from the Secret catasonarr-plex (catasonarr-secret.sh plex), never in MongoDB ──
catasonarr.plex.token=${CATASONARR_PLEX_TOKEN:}

# ── Commands (POST /api/v3/command), kept a week ──
catasonarr.commands.keep=7d

# ── From outside the cluster (IntelliJ, Compass), shown in Settings → Connections (orch.md decisions 87, 119):
#    meloes' NodePorts, by name. Catasonarr itself uses the cluster's names above ──
catasonarr.outside.pulsar-service-url=${CATASONARR_OUTSIDE_PULSAR_SERVICE_URL:http://meloes:31080}
catasonarr.outside.pulsar-broker-url=${CATASONARR_OUTSIDE_PULSAR_BROKER_URL:pulsar://meloes:31650}
catasonarr.outside.mongodb-hosts=${CATASONARR_OUTSIDE_MONGODB_HOSTS:meloes:32017}

# ── MongoDB (SPRING_DATA_MONGODB_URI overrides; local: NodePort + directConnection=true). Collections catasonarr_* ──
spring.data.mongodb.uri=mongodb://catacumbas69-svc.mongodb.svc.cluster.local:27017/catacumbas69?replicaSet=catacumbas69
catasonarr.mongo.server-selection-timeout=5s
catasonarr.mongo.connect-timeout=5s
catasonarr.mongo.read-timeout=30s

# ── Pulsar admin API and client (RES-2) — Mac/IntelliJ: the NodePort URLs and PULSAR_LISTENER_NAME=external ──
catasonarr.pulsar.service-url=${PULSAR_SERVICE_URL:http://pulsar.pulsar.svc.cluster.local:8080}
catasonarr.pulsar.connect-timeout=5s
catasonarr.pulsar.read-timeout=30s
catasonarr.pulsar.request-timeout=60s
catasonarr.pulsar.broker-url=${PULSAR_BROKER_URL:pulsar://pulsar.pulsar.svc.cluster.local:6650}
catasonarr.pulsar.listener-name=${PULSAR_LISTENER_NAME:}
catasonarr.pulsar.connection-timeout=10s
catasonarr.pulsar.operation-timeout=30s

# ── Events (ADR 0008, catacommons): namespace catacumbas69/catasonarr, created at start-up. Everything Catasonarr
#    does is an event on its one topic, catacumbas69/catasonarr/events; Cataudit (and any other app) reads it ──
catacommons.app=catasonarr
# Cataponte, where the audit-catasonarr bridge is registered at start-up (ADR 0009)
catacommons.audit-bridge.cataponte-url=${CATAPONTE_URL:http://cataponte:8082}
# No shared setting used yet
catacommons.settings.enabled=false
# Consumer control (ADR 0015): the pages' subscription, catasonarr-pages-<pod>, shows in Catapulsar's Consumers
# panel and can be paused there (orch.md decision 118); its status goes to catacumbas69/catasonarr/consumers
catacommons.consumers.enabled=true

# ── Actuator / observability (OBS-1, OBS-2) ────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.readiness.include=readinessState
management.metrics.tags.application=${spring.application.name}
# In the cluster set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs for JSON logs (OBS-3)

# ── API docs (API-6) ───────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.catacumbas69.catasonarr=INFO
logging.level.org.apache.pulsar=WARN
# The Pulsar client logs, at WARN and with a full stack trace, failures our code already handles and logs in one
# line (OBS-9)
logging.level.org.apache.pulsar.client.impl.BinaryProtoLookupService=ERROR
logging.level.org.apache.pulsar.client.impl.PulsarClientImpl=ERROR
logging.level.org.apache.pulsar.client.admin.internal.BaseResource=ERROR
