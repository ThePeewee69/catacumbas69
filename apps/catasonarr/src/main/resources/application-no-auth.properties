# Profile no-auth: Catasonarr without login (orch.md decision 109): no Dex for the page and no API key for the
# API v3. For IntelliJ (SPRING_PROFILES_ACTIVE=no-auth) and the tests (src/test/resources/config/application.properties).
# Never in the cluster. SecurityConfig is skipped (@Profile("!no-auth")), and Spring Security's own defaults are
# excluded too, so every endpoint is open and nothing needs a CSRF token.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.client.OAuth2ClientAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientWebSecurityAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
