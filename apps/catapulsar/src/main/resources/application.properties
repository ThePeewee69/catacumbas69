spring.application.name=catapulsar
server.port=8081

# ── Runtime ────────────────────────────────────────────────────────────────────
# Virtual threads: Pulsar admin and Cataponte calls are blocking I/O (PERF)
spring.threads.virtual.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ── Pulsar (env vars override; Mac/IntelliJ: PULSAR_LISTENER_NAME=external) ───
catapulsar.pulsar.service-url=${PULSAR_SERVICE_URL:http://pulsar.pulsar.svc.cluster.local:8080}
catapulsar.pulsar.broker-url=${PULSAR_BROKER_URL:pulsar://pulsar.pulsar.svc.cluster.local:6650}
catapulsar.pulsar.listener-name=${PULSAR_LISTENER_NAME:}
catapulsar.pulsar.connection-timeout=10s
catapulsar.pulsar.operation-timeout=30s
catapulsar.pulsar.admin-connect-timeout=5s
catapulsar.pulsar.admin-read-timeout=30s
catapulsar.pulsar.admin-request-timeout=30s
catapulsar.pulsar.producer-idle-timeout=5m
catapulsar.pulsar.max-cached-producers=50
catapulsar.pulsar.max-peek-count=100

# ── Cataponte (bridges BFF, ARCH-2) — Mac/IntelliJ: CATAPONTE_URL=http://localhost:8082 ──
catapulsar.cataponte.url=${CATAPONTE_URL:http://cataponte:8082}
catapulsar.cataponte.connect-timeout=2s
catapulsar.cataponte.read-timeout=10s

# ── UI: auto-refresh interval default (2–300 s); can be changed from the UI (stored in pulsario_settings) ──
catapulsar.ui.refresh-interval-seconds=${CATAPULSAR_REFRESH_INTERVAL_SECONDS:10}

# ── Catametricas statistics (ADR 0007): default collection interval (15–600 s), editable in ⚙️ Settings ──
# Keep equal to the CATAMETRICAS_COLLECT_INTERVAL_SECONDS default of Catametricas.
catapulsar.catametricas.collect-interval-seconds=${CATAMETRICAS_COLLECT_INTERVAL_SECONDS:60}

# ── MongoDB audit log (SPRING_DATA_MONGODB_URI overrides) ──────────────────────
spring.data.mongodb.uri=mongodb://catacumbas69-svc.mongodb.svc.cluster.local:27017/catacumbas69?replicaSet=catacumbas69
catapulsar.mongo.server-selection-timeout=5s
catapulsar.mongo.connect-timeout=5s
catapulsar.mongo.read-timeout=30s

# ── Events (ADR 0008, catacommons): namespace catacumbas69/catapulsar, created at start-up ──
catacommons.app=catapulsar
# Retries after a failed publish (then ERROR with the full event); retention 7 days / 1 GB per topic,
# backlog quota 1 GB (producer_exception). Defaults in CatacommonsProperties; override with e.g.
# CATACOMMONS_EVENTS_RETRY_DELAYS=1s,2s,4s or CATACOMMONS_PROVISIONING_EVENTS_RETENTION_TIME=7d

# ── Actuator / observability (OBS-1, OBS-2) ────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
# Pulsar, Cataponte and MongoDB are reported but kept out of readiness: the UI degrades per feature (RES-12)
management.endpoint.health.group.readiness.include=readinessState
management.metrics.tags.application=${spring.application.name}
# In the cluster set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs for JSON logs (OBS-3)

# ── API docs (API-6) ───────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Static resources: always revalidate, assets are versioned with ?v=N (UI-2) ─
spring.web.resources.cache.cachecontrol.no-cache=true

logging.level.com.catacumbas69=INFO
logging.level.org.apache.pulsar=WARN
