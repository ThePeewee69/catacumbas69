                      @click="createSub()"
                      :disabled="!newSub || loading.newSub"
                    >
                      <template x-if="loading.newSub"><span class="spinner"></span></template>
                      Create
                    </button>
                  </div>
                </div>
              </div>
            </template>

            <!-- ── Backlog tab: subscriptions with backlog statistics (left), peeked messages (right) ── -->
            <template x-if="tab==='backlog'">
              <div class="backlog-layout">
                <section class="card backlog-subs" aria-labelledby="backlog-subs-title">
                  <div class="card-title">
                    <span class="dot"></span><span id="backlog-subs-title">Subscriptions</span>
                  </div>
                  <template x-if="backlogSubs().length === 0">
                    <p class="muted backlog-empty-subs">No subscriptions on this topic.</p>
                  </template>
                  <ul class="backlog-sub-list">
                    <template x-for="item in backlogSubs()" :key="item.name">
                      <li>
                        <button
                          type="button"
                          class="backlog-sub"
                          :class="{ selected: backlog.sub === item.name }"
                          :aria-pressed="backlog.sub === item.name"
                          @click="selectBacklogSub(item.name)"
                        >
                          <span class="backlog-sub-head">
                            <span class="backlog-sub-name mono" x-text="item.name"></span>
                            <span class="tag tag-blue" x-show="item.stats?.type" x-text="item.stats?.type"></span>
                            <span
                              class="tag tag-binary"
                              x-show="isSystemSub(item.name)"
                              title="Pulsar's own subscription: it can be peeked but not changed"
                              >system</span
                            >
                          </span>
                          <template x-if="bridgeForSub(item.name)">
                            <span class="backlog-sub-bridge">
                              <span class="tag tag-orange">bridge</span>
                              <span x-text="bridgeForSub(item.name).name"></span>
                              <span
                                class="mono"
                                x-text="'→ ' + bridgeDestTopics(bridgeForSub(item.name)).join(', ')"
                              ></span>
                            </span>
                          </template>
                          <template x-if="consumersLine(item.stats)">
                            <span
                              class="backlog-sub-consumers mono"
                              :title="'Connected: ' + consumersLine(item.stats)"
                              x-text="'⇢ ' + consumersLine(item.stats)"
                            ></span>
                          </template>
                          <template x-if="item.stats">
                            <span class="backlog-sub-stats">
                              <span
                                class="backlog-count"
                                :class="{ zero: !item.stats.msgBacklog }"
                                x-text="fmtNum(item.stats.msgBacklog ?? 0) + ' msgs'"
                              ></span>
                              <span x-text="fmtBytes(item.stats.backlogSize ?? 0)"></span>
                              <span x-text="(item.stats.consumers ?? []).length + ' consumer(s)'"></span>
                              <span x-text="fmt(item.stats.msgRateOut ?? 0) + ' msg/s out'"></span>
                              <span x-text="fmtNum(item.stats.unackedMessages ?? 0) + ' unacked'"></span>
                            </span>
                          </template>
                          <template x-if="!item.stats">
                            <span class="backlog-sub-stats muted">statistics loading…</span>
                          </template>
                        </button>
                      </li>
                    </template>
                  </ul>
                </section>

                <section class="backlog-detail" aria-live="polite">
                  <div class="card backlog-toolbar">
                    <div class="card-title backlog-toolbar-title">
                      <span class="dot"></span>
                      <span x-text="backlog.sub ? 'Peek' : 'Select a subscription'"></span>
                      <span class="peek-sub mono" x-show="backlog.sub" x-text="backlog.sub"></span>
                      <span class="backlog-toolbar-actions">
                        <label for="peek-count" class="muted">Count</label>
                        <input
                          id="peek-count"
                          type="number"
                          min="1"
                          max="100"
                          x-model.number="backlog.count"
                          @change="backlog.sub && peekMessages()"
                        />
                        <button
                          type="button"
                          class="btn btn-ghost btn-xs"
                          @click="peekMessages()"
                          :disabled="!backlog.sub || loading.backlog"
                          title="Peek again"
                          aria-label="Peek again"
                        >
                          <template x-if="loading.backlog"><span class="spinner backlog-peek-spinner"></span></template>
                          <template x-if="!loading.backlog"><span>↻</span></template>
                        </button>
                      </span>
                    </div>
                  </div>

                  <template x-if="!backlog.sub">
                    <div class="card empty">
                      <p>Click a subscription to see the first messages of its backlog.</p>
                      <p class="muted backlog-peek-hint">
                        Peeking does not consume messages. Each peek is recorded in the audit log.
                      </p>
                    </div>
                  </template>

                  <template x-if="backlog.messages.length > 0">
                    <div class="card">
                      <div class="card-title">
                        <span class="dot"></span>
                        <span x-text="backlog.messages.length + ' message(s)'"></span>
                        <span class="backlog-peek-note">— peek (non-destructive)</span>
                        <span class="backlog-peek-actions">
                          <button
                            type="button"
                            class="btn btn-danger backlog-skip-all-btn"
                            x-show="!isSystemSub(backlog.sub)"
                            @click="skipAll()"
                            :title="'Skip all ' + backlog.messages.length + ' peeked messages from subscription'"
                          >
                            Skip all
                          </button>
                        </span>
                      </div>
                      <div class="table-wrap">
                        <table class="card-table">
                          <thead>
                            <tr>
                              <th>#</th>
                              <th>Message ID</th>
                              <th>Key</th>
                              <th>Published at</th>
                              <th>Payload</th>
                              <th>Actions</th>
                            </tr>
                          </thead>
                          <tbody>
                            <template x-for="(msg, i) in backlog.messages" :key="msg.messageId">
                              <tr>
                                <td data-label="#" class="muted" x-text="i+1"></td>
                                <td data-label="Message ID"><span class="mono" x-text="msg.messageId"></span></td>
                                <td data-label="Key">
                                  <template x-if="msg.key">
                                    <span class="tag tag-orange" x-text="msg.key"></span>
                                  </template>
                                  <template x-if="!msg.key"><span class="muted">—</span></template>
                                </td>
                                <td data-label="Published at" class="muted" x-text="fmtDate(msg.publishTime)"></td>
                                <td data-label="Payload">
                                  <template x-if="msg.binary">
                                    <span class="tag tag-binary">binary (base64)</span>
                                  </template>
                                  <div class="payload" x-text="truncate(msg.payload, 120)"></div>
                                </td>
                                <td data-label="Actions">
                                  <div class="actions">
                                    <button type="button" class="act" @click="openView(msg)">View</button>
                                    <button type="button" class="act act-edit" @click="openEdit(msg)">Edit</button>
                                    <button
                                      type="button"
                                      class="act act-skip"
                                      x-show="!isSystemSub(backlog.sub)"
                                      @click="skipMessages(i+1)"
                                      :title="'Skip ' + (i+1) + ' message(s) from cursor'"
                                    >
                                      Skip
                                    </button>
                                  </div>
                                </td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </template>

                  <template x-if="!loading.backlog && backlog.messages.length === 0 && backlog.queried">
                    <div class="card empty">
                      <div class="big">📭</div>
                      <p>No messages in backlog for this subscription.</p>
                    </div>
                  </template>
                </section>
              </div>
            </template>
          </div>
        </template>
      </div>

      <!-- Phones only: the views, as tabs at the bottom of the screen (on a computer they are in the top bar) -->
      <nav class="mobile-tabs" aria-label="Views">
        <button
          type="button"
          class="mobile-tab"
          data-testid="nav-overview"
          :aria-current="!panelOpen() ? 'page' : null"
          @click="closePanels()"
        >
          <span class="mobile-tab-icon" aria-hidden="true">📊</span>
          <span class="mobile-tab-label">Overview</span>
        </button>
        <button
          type="button"
          class="mobile-tab"
          data-testid="nav-bridges"
          :aria-current="bridgesView ? 'page' : null"
          @click="openBridges()"
        >
          <span class="mobile-tab-icon" aria-hidden="true">⇌</span>
          <span class="mobile-tab-label">Bridges</span>
        </button>
        <button
          type="button"
          class="mobile-tab"
          data-testid="nav-alerts"
          :aria-current="alertsView ? 'page' : null"
          :title="alertBadgeTitle()"
          @click="openAlerts()"
        >
          <span class="mobile-tab-icon" aria-hidden="true">🔔</span>
          <span class="mobile-tab-label">Alerts</span>
          <span
            class="alert-badge mobile-tab-badge"
            :class="alertBadgeClass()"
            x-show="alertBadgeText()"
            x-text="alertBadgeText()"
          ></span>
        </button>
        <button
          type="button"
          class="mobile-tab"
          data-testid="nav-audit"
          :aria-current="auditView ? 'page' : null"
          @click="openAudit()"
        >
          <span class="mobile-tab-icon" aria-hidden="true">🛡</span>
          <span class="mobile-tab-label">Audit</span>
        </button>
        <button
          type="button"
          class="mobile-tab"
          data-testid="nav-consumers"
          :aria-current="consumersView ? 'page' : null"
          @click="openConsumers()"
        >
          <span class="mobile-tab-icon" aria-hidden="true">⚙</span>
          <span class="mobile-tab-label">Consumers</span>
        </button>
      </nav>
    </div>

    <!-- ══ Toast ════════════════════════════════════════════════════════════════ -->
    <div
      x-show="toast.msg"
      x-transition
      class="toast"
      data-testid="toast"
      :class="toast.type==='error' ? 'toast-error' : 'toast-success'"
    >
      <span x-text="toast.type==='error' ? '✕' : '✓'"></span>
      <span x-text="toast.msg"></span>
    </div>
  </body>
</html>
