                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </template>
              </div>
            </template>

            <!-- Dead letters -->
            <template x-if="cons.tab === 'deadletters'">
              <div>
                <template x-if="cons.dlqLoading && cons.dlqs.length === 0"
                  ><div class="dlq-loading"><div class="spinner"></div></div
                ></template>
                <template x-if="!cons.dlqLoading && cons.dlqs.length === 0">
                  <div class="card empty"><p>No dead-letter topic known yet.</p></div>
                </template>
                <div class="dlq-layout" x-show="cons.dlqs.length > 0">
                  <ul class="dlq-list">
                    <template x-for="d in cons.dlqs" :key="d.topic">
                      <li>
                        <button
                          type="button"
                          class="dlq-item"
                          :class="{ selected: cons.open === d.topic }"
                          @click="peekDeadLetters(d.topic)"
                          title="Show its messages (a peek, recorded in the audit log)"
                        >
                          <span class="mono dlq-topic" x-text="d.topic"></span>
                          <span class="muted dlq-from" x-text="d.from"></span>
                          <span
                            class="backlog-count"
                            :class="{ zero: !d.backlog }"
                            x-text="d.missing ? 'not created yet' : fmtNum(d.backlog) + ' message(s)'"
                          ></span>
                        </button>
                      </li>
                    </template>
                  </ul>
                  <section class="card dlq-messages">
                    <template x-if="!cons.open"
                      ><p class="muted">Choose a dead-letter topic to see its messages.</p></template
                    >
                    <template x-if="cons.open">
                      <div>
                        <div class="dlq-head">
                          <div class="mono dlq-open-topic" x-text="cons.open"></div>
                          <div class="consumer-actions">
                            <button
                              type="button"
                              class="btn btn-ghost btn-xs"
                              :disabled="cons.busy"
                              @click="peekDeadLetters(cons.open)"
                            >
                              ↺ Peek
                            </button>
                            <button
                              type="button"
                              class="btn btn-ghost btn-xs"
                              :disabled="cons.busy || cons.messages.length === 0"
                              @click="deadLetterAction('send-back-all')"
                            >
                              Send all back
                            </button>
                            <button
                              type="button"
                              class="btn btn-danger btn-xs"
                              :disabled="cons.busy || cons.messages.length === 0"
                              @click="deadLetterAction('discard-all')"
                            >
                              Discard all
                            </button>
                          </div>
                        </div>
                        <template x-if="cons.peeking"
                          ><div class="dlq-peek-loading"><div class="spinner"></div></div
                        ></template>
                        <template x-if="!cons.peeking && cons.messages.length === 0"
                          ><p class="muted">The DLQ is empty.</p></template
                        >
                        <template x-for="m in cons.messages" :key="m.messageId">
                          <div class="dlq-message">
                            <div class="dlq-message-head">
                              <span class="mono" x-text="m.messageId"></span>
                              <span class="muted" x-text="fmtDate(m.publishTime)"></span>
                              <span class="consumer-actions">
                                <button
                                  type="button"
                                  class="btn btn-ghost btn-xs"
                                  :disabled="cons.busy || !m.properties?.REAL_TOPIC"
                                  :title="m.properties?.REAL_TOPIC ? 'Send it back to ' + m.properties.REAL_TOPIC : 'Its original topic is unknown'"
                                  @click="deadLetterAction('send-back', m)"
                                >
                                  Send back
                                </button>
                                <button
                                  type="button"
                                  class="btn btn-danger btn-xs"
                                  :disabled="cons.busy"
                                  @click="deadLetterAction('discard', m)"
                                >
                                  Discard
                                </button>
                              </span>
                            </div>
                            <div class="dlq-meta">
                              <template x-if="m.properties?.REAL_TOPIC"
                                ><span>from <span class="mono" x-text="m.properties.REAL_TOPIC"></span></span
                              ></template>
                              <template x-if="m.properties?.DLQ_REASON"
                                ><span>· <span x-text="m.properties.DLQ_REASON"></span></span
                              ></template>
                              <template x-if="m.key"
                                ><span>· key <span class="mono" x-text="m.key"></span></span
                              ></template>
                            </div>
                            <pre class="dlq-payload" x-text="truncate(m.payload, 600)"></pre>
                          </div>
                        </template>
                      </div>
                    </template>
                  </section>
                </div>
              </div>
            </template>
          </div>
        </template>

        <!-- ─ Audit panel: the audit trail of every app, read from Cataudit (ADR 0009) ─ -->
        <template x-if="auditView">
          <div class="audit-panel">
            <div class="bridges-header">
              <div>
                <div class="audit-title">Audit trail</div>
                <div class="muted audit-subtitle">
                  Every audited action of every app. New entries appear within seconds.
                </div>
                <button type="button" class="cataponte-url" @click="openSettings()" title="Change the Cataudit URL">
                  <span>Cataudit:</span>
                  <span class="mono" x-text="audit.settings.url || '…'"></span>
                  <template x-if="audit.settings.custom"><span class="tag tag-blue">custom</span></template>
                  <span aria-hidden="true">✎</span>
                </button>
              </div>
              <div class="audit-head-actions">
                <span
                  class="muted audit-total"
                  x-show="audit.total > 0"
                  x-text="audit.total.toLocaleString() + ' entr' + (audit.total === 1 ? 'y' : 'ies')"
                ></span>
                <button
                  type="button"
                  class="btn btn-ghost audit-refresh-btn"
                  @click="loadAuditFacets();loadAudit()"
                  title="Refresh"
                >
                  ↺
                </button>
              </div>
            </div>

            <!-- Filters -->
            <form class="audit-filters card" @submit.prevent="applyAuditFilters()">
              <div class="field">
                <label for="audit-app">App</label>
                <select id="audit-app" x-model="audit.filters.app" @change="applyAuditFilters()">
                  <option value="">All</option>
                  <template x-for="a in audit.facets.apps" :key="a"><option :value="a" x-text="a"></option></template>
                </select>
              </div>
              <div class="field">
                <label for="audit-entity">About</label>
                <select id="audit-entity" x-model="audit.filters.entity" @change="applyAuditFilters()">
                  <option value="">All</option>
                  <template x-for="e in audit.facets.entities" :key="e"
                    ><option :value="e" x-text="e"></option
                  ></template>
                </select>
              </div>
              <div class="field">
                <label for="audit-action">Action</label>
                <select id="audit-action" x-model="audit.filters.action" @change="applyAuditFilters()">
                  <option value="">All</option>
                  <template x-for="a in audit.facets.actions" :key="a"
                    ><option :value="a" x-text="a"></option
                  ></template>
                </select>
              </div>
              <div class="field audit-filter-wide">
                <label for="audit-subject">Subject starts with</label>
                <input
                  id="audit-subject"
                  type="text"
                  x-model="audit.filters.subject"
                  placeholder="persistent://tenant/namespace/ · bridge id · setting key"
                />
              </div>
              <div class="field">
                <label for="audit-actor">Actor</label>
                <input id="audit-actor" type="text" x-model="audit.filters.actor" placeholder="IP or app" />
              </div>
              <div class="field">
                <label for="audit-period">Period</label>
                <select id="audit-period" x-model="audit.filters.period" @change="applyAuditFilters()">
                  <option value="1h">Last hour</option>
                  <option value="24h">Last 24 hours</option>
                  <option value="7d">Last 7 days</option>
                  <option value="30d">Last 30 days</option>
                  <option value="all">Everything</option>
                </select>
              </div>
              <div class="audit-filter-actions">
                <button type="submit" class="btn btn-primary audit-search-btn">Search</button>
                <button type="button" class="btn btn-ghost audit-clear-btn" @click="clearAuditFilters()">Clear</button>
              </div>
            </form>

            <template x-if="audit.loading">
              <div class="audit-loading"><div class="spinner"></div></div>
            </template>

            <template x-if="!audit.loading && audit.error">
              <div class="card empty">
                <div class="big" aria-hidden="true">🛡</div>
                <p class="audit-error-title">Audit trail unavailable</p>
                <p class="muted audit-error-text" x-text="audit.error"></p>
              </div>
            </template>

            <template x-if="!audit.loading && !audit.error && audit.items.length === 0">
              <div class="card empty">
                <div class="big" aria-hidden="true">🛡</div>
                <p>No audit entries for these filters.</p>
              </div>
            </template>

            <template x-if="!audit.loading && !audit.error && audit.items.length > 0">
              <div>
                <div class="table-wrap">
                  <table class="card-table audit-table">
                    <thead>
                      <tr>
                        <th>When</th>
                        <th>App</th>
                        <th>Event</th>
                        <th>Subject</th>
                        <th>Actor</th>
                      </tr>
                    </thead>
                    <template x-for="e in audit.items" :key="e.id">
                      <tbody>
                        <tr
                          class="audit-row"
                          :class="{'expanded': audit.expanded === e.id}"
                          tabindex="0"
                          :aria-expanded="audit.expanded === e.id"
                          @click="toggleAuditEntry(e.id)"
                          @keydown.enter.prevent="toggleAuditEntry(e.id)"
                          @keydown.space.prevent="toggleAuditEntry(e.id)"
                        >
                          <td data-label="When" class="muted audit-when" x-text="auditTime(e.time)"></td>
                          <td data-label="App"><span class="tag tag-blue" x-text="e.app"></span></td>
                          <td data-label="Event">
                            <span class="mono" x-text="e.entity + '.' + e.action"></span>
                          </td>
                          <td data-label="Subject">
                            <button
                              type="button"
                              class="audit-subject mono"
                              :title="'Show only ' + e.subject"
                              x-show="e.subject"
                              x-text="e.subject"
                              @click.stop="filterAuditSubject(e.subject)"
                            ></button>
                          </td>
                          <td data-label="Actor" class="mono" x-text="e.actor || '—'"></td>
                        </tr>
                        <tr x-show="audit.expanded === e.id" class="audit-detail-row">
                          <td colspan="5">
                            <div class="audit-detail">
                              <template x-if="auditChangedKeys(e).length > 0">
                                <table class="audit-kv">
                                  <thead>
                                    <tr>
                                      <th>Field</th>
                                      <th>Before</th>
                                      <th>After</th>
                                    </tr>
                                  </thead>
                                  <tbody>
                                    <template x-for="k in auditChangedKeys(e)" :key="k">
                                      <tr :class="{'changed': (e.before || {})[k] !== (e.after || {})[k]}">
                                        <td class="mono" x-text="k"></td>
                                        <td class="payload" x-text="(e.before || {})[k] ?? '—'"></td>
                                        <td class="payload" x-text="(e.after || {})[k] ?? '—'"></td>
                                      </tr>
                                    </template>
                                  </tbody>
                                </table>
                              </template>
                              <template x-if="auditPairs(e.details).length > 0">
                                <table class="audit-kv">
                                  <thead>
                                    <tr>
                                      <th>Detail</th>
                                      <th>Value</th>
                                    </tr>
                                  </thead>
                                  <tbody>
                                    <template x-for="[k, v] in auditPairs(e.details)" :key="k">
                                      <tr>
                                        <td class="mono" x-text="k"></td>
                                        <td class="payload" x-text="v"></td>
                                      </tr>
                                    </template>
                                  </tbody>
                                </table>
                              </template>
                              <div class="muted audit-meta">
                                <span>Type <span class="mono" x-text="e.type"></span></span>
                                <span>Id <span class="mono" x-text="e.id"></span></span>
                              </div>
                            </div>
                          </td>
                        </tr>
                      </tbody>
                    </template>
                  </table>
                </div>
                <div class="audit-pager">
                  <button
                    type="button"
                    class="btn btn-ghost audit-prev-btn"
                    :disabled="audit.page === 0"
                    @click="auditGo(-1)"
                  >
                    ← Newer
                  </button>
                  <span class="muted" x-text="'Page ' + (audit.page + 1) + ' of ' + auditPages()"></span>
                  <button
                    type="button"
                    class="btn btn-ghost audit-next-btn"
                    :disabled="audit.page + 1 >= auditPages()"
                    @click="auditGo(1)"
                  >
                    Older →
                  </button>
                </div>
              </div>
            </template>
          </div>
        </template>

        <!-- ─ Bridges panel ─ -->
        <template x-if="bridgesView">
          <div class="bridges-panel">
            <!-- Header -->
            <div class="bridges-header">
              <div class="bridges-head-title-row">
                <svg class="bridges-head-icon" viewBox="0 0 32 32" aria-hidden="true">
                  <rect x="1" y="9" width="9" height="14" rx="2.5" fill="#4f46e5" />
                  <rect x="3" y="12" width="5" height="1.5" rx=".75" fill="#c7d2fe" opacity=".9" />
                  <rect x="3" y="15" width="5" height="1.5" rx=".75" fill="#c7d2fe" opacity=".6" />
                  <rect x="3" y="18" width="3" height="1.5" rx=".75" fill="#c7d2fe" opacity=".35" />
                  <rect x="10" y="14.5" width="12" height="3" rx="1.5" fill="#312e81" opacity=".6" />
                  <circle cx="12.5" cy="16" r="1.6" fill="#a5b4fc" />
                  <circle cx="16" cy="16" r="1.6" fill="#818cf8" />
                  <circle cx="19.5" cy="16" r="1.6" fill="#6366f1" />
                  <path
                    d="M19 13.2 L23.5 16 L19 18.8"
                    fill="none"
                    stroke="#818cf8"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <rect x="22" y="9" width="9" height="14" rx="2.5" fill="#6366f1" />
                  <rect x="24" y="12" width="5" height="1.5" rx=".75" fill="#e0e7ff" opacity=".9" />
                  <rect x="24" y="15" width="5" height="1.5" rx=".75" fill="#e0e7ff" opacity=".6" />
                  <rect x="24" y="18" width="3.5" height="1.5" rx=".75" fill="#e0e7ff" opacity=".35" />
                </svg>
                <div>
                  <div class="bridges-title">Cataponte Bridges</div>
                  <button type="button" class="cataponte-url" @click="openSettings()" title="Change the Cataponte URL">
                    <span>Cataponte:</span>
                    <span class="mono" x-text="bridges.settings.url || '…'"></span>
                    <template x-if="bridges.settings.custom"><span class="tag tag-blue">custom</span></template>
                    <span aria-hidden="true">✎</span>
                  </button>
                </div>
              </div>
              <div class="bridges-head-actions">
                <span class="bridges-running" x-show="runningBridges() > 0">
                  <span class="bridge-status-dot running bridges-running-dot"></span>
                  <span x-text="runningBridges() + ' running'"></span>
                </span>
                <button
                  type="button"
                  class="btn btn-ghost bridges-refresh-btn"
                  @click="loadBridges();loadBridgeStatus()"
                  title="Refresh"
                >
                  ↺
                </button>
                <template x-if="bridges.tab !== 'system'">
                  <button
                    type="button"
                    class="btn btn-primary bridges-new-btn"
                    data-testid="bridge-new"
                    @click="openNewBridge()"
                    :title="currentArea() ? 'New bridge in area ' + currentArea().name : 'New bridge without an area'"
                  >
                    + New Bridge
                  </button>
                </template>
              </div>
            </div>

            <!-- Tabs: System | Bridges | areas | + Area (ADR 0014) -->
            <div class="bridge-tabs-row">
              <div class="tabs bridge-tabs" role="tablist" aria-label="Bridge groups">
                <template x-for="t in bridgeTabs()" :key="t.key">
                  <button
                    type="button"
                    role="tab"
                    class="tab"
                    data-testid="bridge-tab"
                    :class="{ active: bridges.tab === t.key }"
                    :aria-selected="bridges.tab === t.key"
                    @click="selectBridgeTab(t.key)"
                  >
                    <span x-text="t.label"></span>
                    <span class="tab-count" x-text="t.count"></span>
                  </button>
                </template>
              </div>
              <button
                type="button"
                class="btn btn-ghost btn-xs"
                @click="openNewArea()"
                title="New area: a group of bridges limited to the topics its patterns match"
              >
                + Area
              </button>
            </div>

            <!-- Header of an area -->
            <template x-if="currentArea()">
              <div class="area-head">
                <div class="area-head-text">
                  <template x-if="currentArea().description">
                    <div class="area-description" x-text="currentArea().description"></div>
                  </template>
                  <div class="area-patterns">
                    <span class="muted">Topics:</span>
                    <template x-if="(currentArea().patterns || []).length === 0">
                      <span class="tag tag-blue">every topic</span>
                    </template>
                    <template x-for="pt in currentArea().patterns || []" :key="pt">
                      <span class="mono area-pattern" x-text="pt"></span>
                    </template>
                  </div>
                </div>
                <div class="area-head-actions">
                  <button type="button" class="btn btn-ghost btn-xs" @click="openEditArea(currentArea())">
                    ✎ Edit area
                  </button>
                  <button type="button" class="btn btn-danger btn-xs" @click="askDeleteArea(currentArea())">
                    Delete area
                  </button>
                </div>
              </div>
            </template>
            <template x-if="bridges.tab === 'system'">
              <p class="muted area-hint">
                Registered by the apps at start-up (e.g. their audit bridges, ADR 0009). They always stay here.
              </p>
            </template>

            <!-- Loading -->
            <template x-if="bridges.loading">
              <div class="bridges-loading"><div class="spinner"></div></div>
            </template>

            <!-- Bridge list -->
            <template x-if="!bridges.loading">
              <div>
                <!-- Empty state -->
                <template x-if="tabBridges().length === 0">
                  <div class="card empty bridges-empty">
                    <div class="bridges-empty-icon">⇌</div>
                    <p
                      class="bridges-empty-title"
                      x-text="bridges.tab === 'system' ? 'No system bridges' : 'No bridges here yet'"
                    ></p>
                    <template x-if="bridges.tab !== 'system'">
                      <div>
                        <p
                          class="bridges-empty-text"
                          x-text="currentArea() ? 'Create one with topics this area allows.' : 'Create one to relay messages between Pulsar topics.'"
                        ></p>
                        <button type="button" class="btn btn-primary bridges-empty-new-btn" @click="openNewBridge()">
                          + New Bridge
                        </button>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- Bridge cards -->
                <template x-for="bridge in tabBridges()" :key="bridge.id">
                  <div
                    class="bridge-card"
                    data-testid="bridge-card"
                    :id="'bridge-card-' + bridge.id"
                    :class="{'bridge-disabled': !bridge.enabled, 'bridge-highlight': bridges.highlight === bridge.id}"
                  >
                    <div class="bridge-card-header">
                      <div
                        class="bridge-status-dot"
                        :class="{'running': bridge.enabled && bridges.status[bridge.id]?.running,
                                'disabled': !bridge.enabled}"
                      ></div>
                      <div class="bridge-card-title">
                        <span class="bridge-name" x-text="bridge.name"></span>
                        <template x-if="bridge.system">
                          <span
                            class="tag tag-orange"
                            title="Registered by an app at start-up (e.g. its audit bridge, ADR 0009)"
                            >system</span
                          >
                        </template>
                        <template x-if="bridge.outsideArea">
                          <span
                            class="tag tag-orange"
                            :title="'The area\'s patterns were changed and no longer match: ' + (bridge.outsideTopics || []).join(', ') + '. It keeps running; it must fit again when edited.'"
                            >outside filter</span
                          >
                        </template>
                        <template x-if="bridge.description">
                          <span class="bridge-description" x-text="bridge.description"></span>
                        </template>
                      </div>
                      <div class="bridge-card-actions">
                        <button
                          type="button"
                          class="btn btn-ghost bridge-toggle-btn"
                          :class="{'btn-success': bridge.enabled}"
                          @click="toggleBridge(bridge)"
                          x-text="bridge.enabled ? '⏸ Disable' : '▶ Enable'"
                        ></button>
                        <button
                          type="button"
                          class="btn btn-ghost bridge-card-edit-btn"
                          @click="openEditBridge(bridge)"
                        >
                          ✏ Edit
                        </button>
                        <button
                          type="button"
                          class="btn btn-danger bridge-card-delete-btn"
                          @click="deleteBridge(bridge.id)"
                        >
                          Delete
                        </button>
                      </div>
                    </div>

                    <div class="bridge-route">
                      <div class="bridge-topic-block">
                        <div class="bridge-route-source-label">SOURCE</div>
                        <div class="bridge-topic-row">
                          <span
                            class="mono bridge-topic"
                            :title="trafficTitle(bridge.id, 'SOURCE', bridge.source?.topic)"
                            x-text="bridge.source?.topic || '?'"
                          ></span>
                          <span
                            class="bridge-count"
                            x-text="trafficLabel(bridge.id, 'SOURCE', bridge.source?.topic)"
                          ></span>
                        </div>
                      </div>
                      <div class="bridge-arrow">
                        <template x-if="bridge.enabled && bridges.status[bridge.id]?.running">
                          <span class="bridge-arrow-animated">→</span>
                        </template>
                        <template x-if="!(bridge.enabled && bridges.status[bridge.id]?.running)">
                          <span class="bridge-route-arrow-idle">→</span>
                        </template>
                      </div>
                      <div class="bridge-topic-block">
                        <div
                          class="bridge-route-dest-label"
                          x-text="bridgeDestTopics(bridge).length > 1 ? 'DESTINATIONS (' + bridgeDestTopics(bridge).length + ')' : 'DESTINATION'"
                        ></div>
                        <template x-for="dt in bridgeDestTopics(bridge)" :key="dt">
                          <div class="bridge-topic-row">
                            <span
                              class="mono bridge-topic"
                              :title="trafficTitle(bridge.id, 'DESTINATION', dt)"
                              x-text="dt"
                            ></span>
                            <span class="bridge-count" x-text="trafficLabel(bridge.id, 'DESTINATION', dt)"></span>
                          </div>
                        </template>
                        <template x-if="bridgeDestTopics(bridge).length === 0">
                          <span class="mono bridge-topic">?</span>
                        </template>
                      </div>
                    </div>

                    <div class="bridge-card-meta">
                      <span class="bridge-card-sub">
                        sub: <span class="mono" x-text="bridge.source?.subscription || ''"></span> (<span
                          x-text="bridge.source?.subscriptionType || 'Shared'"
                        ></span
                        >)
                      </span>
                      <div class="bridge-stats">
                        <template x-if="bridges.status[bridge.id]?.running">
                          <span
                            class="tag tag-blue"
                            x-text="(bridges.status[bridge.id].messagesForwarded || 0).toLocaleString('en') + ' forwarded'"
                          ></span>
                        </template>
                        <template x-if="bridges.status[bridge.id]?.replicas > 1">
                          <span
                            class="tag bridge-card-sub-type"
                            :title="bridge.source?.subscriptionType === 'Failover'
                              ? 'Failover: one replica receives, the others stand by'
                              : 'Every running replica receives a share of the messages'"
                            x-text="bridges.status[bridge.id].activeReplicas + '/' + bridges.status[bridge.id].replicas + ' replicas active'"
                          ></span>
                        </template>
                        <template x-if="bridges.status[bridge.id]?.errors > 0">
                          <span class="tag tag-orange" x-text="bridges.status[bridge.id].errors + ' errors'"></span>
                        </template>
                        <template x-if="!bridge.enabled">
                          <span class="tag bridge-card-disabled">disabled</span>
                        </template>
                        <template
                          x-if="bridge.enabled && bridges.status[bridge.id]?.state === 'FAILED' && !bridges.status[bridge.id]?.problem"
                        >
                          <span
                            class="tag tag-failed"
                            :title="'Retry at ' + fmtDate(bridges.status[bridge.id].nextRetryAt)"
                            x-text="'failed: ' + truncate(bridges.status[bridge.id].lastError, 60)"
                          ></span>
                        </template>
                        <template
                          x-if="bridge.enabled && bridges.status[bridge.id]?.problem === 'DESTINATION_UNAVAILABLE'"
                        >
                          <span
                            class="tag tag-failed"
                            :title="'The destination does not accept messages: the bridge paused and keeps sending the failed ones again until they are accepted. ' + (bridges.status[bridge.id].lastError || '')"
                            x-text="'destination unavailable: ' + truncate(bridges.status[bridge.id].lastError, 50)"
                          ></span>
                        </template>
                        <template x-if="bridge.enabled && bridges.status[bridge.id]?.problem === 'STUCK'">
                          <span class="bridge-stuck">
                            <span
                              class="tag tag-failed"
                              :title="'The destination refuses this message, so the ordered bridge cannot go past it: ' + (bridges.status[bridge.id].lastError || '')"
                              x-text="'stuck on ' + bridges.status[bridge.id].stuckMessageId + ': ' + truncate(bridges.status[bridge.id].lastError, 40)"
                            ></span>
                            <template
                              x-if="(bridge.source?.subscriptionType || '') === 'Failover' && bridges.status[bridge.id].stuckMessageId"
                            >
                              <button
                                type="button"
                                class="btn btn-danger btn-xs"
                                @click="skipStuckMessage(bridge)"
                                title="Acknowledge this message without relaying it, so the bridge carries on (audited)"
                              >
                                Skip this message
                              </button>
                            </template>
                          </span>
                        </template>
                        <template x-if="bridges.status[bridge.id]?.deadLetterTopic">
                          <span
                            class="tag bridge-card-dlq"
                            :title="'Messages the destination refuses go, after ' + 'N deliveries, to ' + bridges.status[bridge.id].deadLetterTopic"
                            >DLQ</span
                          >
                        </template>
                        <template x-if="bridge.enabled && bridges.status[bridge.id]?.state === 'BLOCKED'">
                          <span class="tag tag-failed" :title="bridges.status[bridge.id].lastError"
                            >blocked: message loop</span
                          >
                        </template>
                        <template
                          x-if="bridge.enabled && !bridges.status[bridge.id]?.running && !['FAILED', 'BLOCKED'].includes(bridges.status[bridge.id]?.state)"
                        >
                          <span class="tag bridge-card-starting">starting…</span>
                        </template>
                        <span class="tag tag-blue" x-text="bridge.ordered ? 'ordered' : 'unordered'"></span>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>

        <!-- ─ Overview: cluster (tenants), tenant (namespaces) or namespace (topics) — Catametricas statistics ─ -->
        <template x-if="!panelOpen() && !sel.topic">
          <section class="overview" aria-labelledby="overview-title">
            <header class="overview-head">
              <div>
                <h2 id="overview-title" data-testid="overview-title" x-text="overviewTitle()">Overview</h2>
                <p class="muted overview-fresh" x-text="overviewFreshness()"></p>
              </div>
              <div class="overview-controls">
                <button
                  type="button"
                  class="btn btn-ghost btn-xs"
                  @click="collectNow()"
                  :disabled="force.busy"
                  title="Ask Catametricas to collect this view now (each namespace at most once every 5 s); recorded in the audit log"
                >
                  <template x-if="force.busy"><span class="spinner overview-collect-spinner"></span></template>
                  <template x-if="!force.busy"><span aria-hidden="true">⟳</span></template>
                  Collect now
                </button>
                <button
                  type="button"
                  class="btn btn-ghost btn-xs live-toggle"
                  :class="{ on: live.on }"
                  :aria-pressed="live.on"
                  x-show="overviewScope() === 'namespace'"
                  @click="live.on ? stopLive() : startLive()"
                  title="Collect this namespace every 5 s while this browser tab is visible; turns itself off after 10 minutes"
                >
                  <span class="live-dot" aria-hidden="true"></span> Live
                </button>
                <div class="seg" role="group" aria-label="Period">
                  <template x-for="p in ['1h', '24h', '7d', '30d']" :key="p">
                    <button
                      type="button"
                      :class="{ active: overview.period === p }"
                      :aria-pressed="overview.period === p"
                      @click="setOverviewPeriod(p)"
                      x-text="p"
                    ></button>
                  </template>
                </div>
                <div class="seg" role="group" aria-label="Chart">
                  <template
                    x-for="[m, label] in Object.entries({ in: 'Published', out: 'Delivered', backlog: 'Backlog' })"
                    :key="m"
                  >
                    <button
                      type="button"
                      :class="{ active: overview.metric === m }"
                      :aria-pressed="overview.metric === m"
                      @click="setOverviewMetric(m)"
                      x-text="label"
                    ></button>
                  </template>
                </div>
              </div>
            </header>

            <template x-if="live.on">
              <div class="live-banner" role="status" aria-live="polite">
                <span class="live-dot" aria-hidden="true"></span>
                <strong>LIVE</strong>
                <span>
                  <span class="mono" x-text="live.scope"></span> collected every 5 s · only this namespace ·
                  <span
                    x-text="live.paused ? 'paused while this browser tab is hidden' : 'only while this tab is visible'"
                  ></span>
                  · turns off in <span class="mono" x-text="liveRemaining()"></span>
                </span>
                <template x-if="live.lastError">
                  <span class="live-error" x-text="'· ' + live.lastError"></span>
                </template>
                <button type="button" class="btn btn-ghost btn-xs" @click="stopLive()">Stop</button>
              </div>
            </template>

            <template x-if="overview.loading">
              <div class="overview-loading"><div class="spinner"></div></div>
            </template>
            <template x-if="!overview.loading && overview.error">
              <div class="card empty">
                <p x-text="'Statistics unavailable: ' + overview.error"></p>
                <button type="button" class="link-btn" @click="openSettings()">Check the Catametricas URL</button>
              </div>
            </template>

            <template x-if="!overview.loading && !overview.error && overview.data">
              <div>
                <div class="stats-grid">
                  <div class="stat-card">
                    <div class="stat-label">Backlog now</div>
                    <div class="stat-value" x-text="fmtNum(overview.data.summary.current?.backlogMsgs ?? 0)"></div>
                    <div
                      class="stat-sub"
                      x-text="fmtBytes(overview.data.summary.current?.backlogBytes ?? 0) + ' waiting'"
                    ></div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-label">Rate now</div>
                    <div class="stat-value" x-text="fmt(overview.data.summary.current?.msgRateIn ?? 0)"></div>
                    <div
                      class="stat-sub"
                      x-text="'msg/s in · ' + fmt(overview.data.summary.current?.msgRateOut ?? 0) + ' out'"
                    ></div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-label" x-text="'Published · ' + overview.data.period"></div>
                    <div class="stat-value" x-text="fmtNum(overview.data.summary.period.msgsIn)"></div>
                    <div class="stat-sub" x-text="fmtBytes(overview.data.summary.period.bytesIn)"></div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-label" x-text="'Delivered · ' + overview.data.period"></div>
                    <div class="stat-value" x-text="fmtNum(overview.data.summary.period.msgsOut)"></div>
                    <div class="stat-sub" x-text="fmtBytes(overview.data.summary.period.bytesOut)"></div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-label">All time</div>
                    <div class="stat-value" x-text="fmtCompact(overview.data.summary.total.msgsIn)"></div>
                    <div
                      class="stat-sub"
                      x-text="'published · ' + fmtCompact(overview.data.summary.total.msgsOut) + ' delivered'"
                    ></div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-label">Topics</div>
                    <div class="stat-value" x-text="overview.data.summary.current?.topics ?? 0"></div>
                    <div
                      class="stat-sub"
                      x-text="(overview.data.summary.current?.subscriptions ?? 0) + ' subs · ' + (overview.data.summary.current?.producers ?? 0) + ' prod · ' + (overview.data.summary.current?.consumers ?? 0) + ' cons'"
                    ></div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-label">Storage</div>
                    <div class="stat-value" x-text="fmtBytes(overview.data.summary.current?.storageSize ?? 0)"></div>
                  </div>
                </div>

                <div class="card chart-card">
                  <div class="card-title">
                    <span class="dot"></span>
                    <span
                      x-text="{ in: 'Published', out: 'Delivered', backlog: 'Backlog' }[overview.metric] + ' · last ' + overview.data.period"
                    ></span>
                    <span class="chart-hover muted" x-show="overview.hover" x-text="overview.hover?.text"></span>
                  </div>
                  <div class="chart">
                    <div class="chart-y" aria-hidden="true">
                      <template x-for="(l, i) in chartModel().yLabels" :key="i"><span x-text="l"></span></template>
                    </div>
                    <div class="chart-plot">
                      <svg
                        viewBox="0 0 760 160"
                        preserveAspectRatio="none"
                        role="img"
                        :aria-label="overviewTitle() + ' — ' + overview.metric + ' per bucket'"
                        @mousemove="chartHover($event)"
                        @mouseleave="overview.hover = null"
                      >
                        <line x1="0" y1="1" x2="760" y2="1" class="chart-grid" />
                        <line x1="0" y1="80" x2="760" y2="80" class="chart-grid" />
                        <line x1="0" y1="159" x2="760" y2="159" class="chart-grid" />
                        <path :d="chartModel().line" class="chart-line" vector-effect="non-scaling-stroke" />
                        <line
                          x-show="overview.hover"
                          :x1="overview.hover?.x ?? 0"
                          :x2="overview.hover?.x ?? 0"
                          y1="0"
                          y2="160"
                          class="chart-cursor"
                          vector-effect="non-scaling-stroke"
                        />
                      </svg>
                      <div class="chart-x" aria-hidden="true">
                        <template x-for="(l, i) in chartModel().xLabels" :key="i"
                          ><span x-text="l.text"></span
                        ></template>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="card">
                  <div class="card-title"><span class="dot"></span><span x-text="overviewRowLabel()"></span></div>
                  <template x-if="overviewRows().length === 0">
                    <p class="muted overview-empty">Nothing here yet.</p>
                  </template>
                  <template x-if="overviewRows().length > 0">
                    <div class="table-wrap">
                      <table class="card-table overview-table">
                        <thead>
                          <tr>
                            <th scope="col">Name</th>
                            <th scope="col">Backlog</th>
                            <th scope="col">Rate now</th>
                            <th scope="col">Storage</th>
                            <th scope="col" x-text="'Last ' + overview.data.period"></th>
                            <th scope="col">All time</th>
                            <th
                              scope="col"
                              x-text="{ in: 'Published', out: 'Delivered', backlog: 'Backlog' }[overview.metric]"
                            ></th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="row in overviewRows()" :key="row.name">
                            <tr :class="{ clickable: canDrill(row), gone: row.gone }" @click="drill(row)">
                              <td data-label="Name">
                                <template x-if="canDrill(row)">
                                  <button
                                    type="button"
                                    class="row-link"
                                    @click.stop="drill(row)"
                                    x-text="row.name"
                                  ></button>
                                </template>
                                <template x-if="!canDrill(row)">
                                  <span
                                    class="row-name"
                                    x-text="row.name"
                                    :title="row.gone ? 'No longer exists; its history still counts' : (overviewScope() === 'namespace' ? 'Partitioned topic: open a partition in the sidebar' : '')"
                                  ></span>
                                </template>
                                <template x-if="row.gone"><span class="tag tag-binary">deleted</span></template>
                                <div
                                  class="row-sub muted"
                                  x-show="row.current"
                                  x-text="overviewScope() === 'namespace'
                                   ? (row.current?.partitions > 1 ? row.current.partitions + ' partitions · ' : '') + (row.current?.subscriptions ?? 0) + ' subs · ' + (row.current?.producers ?? 0) + ' prod · ' + (row.current?.consumers ?? 0) + ' cons'
                                   : (row.current?.topics ?? 0) + ' topics · ' + (row.current?.subscriptions ?? 0) + ' subs · ' + (row.current?.consumers ?? 0) + ' cons'"
                                ></div>
                              </td>
                              <td data-label="Backlog">
                                <template x-if="row.current">
                                  <div>
                                    <span
                                      :class="row.current.backlogMsgs ? 'num-strong' : 'muted'"
                                      x-text="fmtNum(row.current.backlogMsgs)"
                                    ></span>
                                    <div class="row-sub muted" x-text="fmtBytes(row.current.backlogBytes)"></div>
                                    <div
                                      class="row-sub muted"
                                      x-show="isCollectTasksRow(row)"
                                      title="A scheduled collection of this namespace is itself a task on this topic, acknowledged only when the collection ends"
                                    >
                                      may include the task being collected
                                    </div>
                                  </div>
                                </template>
                                <template x-if="!row.current"><span class="muted">—</span></template>
                              </td>
                              <td data-label="Rate now">
                                <template x-if="row.current">
                                  <div>
                                    <span x-text="fmt(row.current.msgRateIn) + ' in'"></span>
                                    <div class="row-sub muted" x-text="fmt(row.current.msgRateOut) + ' out /s'"></div>
                                  </div>
                                </template>
                                <template x-if="!row.current"><span class="muted">—</span></template>
                              </td>
                              <td data-label="Storage">
                                <span
                                  :class="{ muted: !row.current }"
                                  x-text="row.current ? fmtBytes(row.current.storageSize) : '—'"
                                ></span>
                              </td>
                              <td :data-label="'Last ' + overview.data.period">
                                <template x-if="row.period">
                                  <div>
                                    <span x-text="fmtNum(row.period.msgsIn) + ' in'"></span>
                                    <div
                                      class="row-sub muted"
                                      x-text="fmtNum(row.period.msgsOut) + ' out · ' + fmtBytes(row.period.bytesIn)"
                                    ></div>
                                  </div>
                                </template>
                                <template x-if="!row.period"><span class="muted">—</span></template>
                              </td>
                              <td data-label="All time">
                                <template x-if="row.total">
                                  <div>
                                    <span x-text="fmtCompact(row.total.msgsIn) + ' in'"></span>
                                    <div class="row-sub muted" x-text="fmtCompact(row.total.msgsOut) + ' out'"></div>
                                  </div>
                                </template>
                                <template x-if="!row.total"><span class="muted">—</span></template>
                              </td>
                              <td
                                :data-label="{ in: 'Published', out: 'Delivered', backlog: 'Backlog' }[overview.metric]"
                                class="spark-cell"
                              >
                                <svg class="spark" viewBox="0 0 120 28" preserveAspectRatio="none" aria-hidden="true">
                                  <path
                                    :d="linePath(overviewSeries(row), 120, 28)"
                                    vector-effect="non-scaling-stroke"
                                  />
                                </svg>
                              </td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </section>
        </template>

        <!-- ─ Topic view ─ -->
        <template x-if="!panelOpen() && sel.topic">
          <div>
            <div class="tabs">
              <button type="button" class="tab" :class="{active:tab==='stats'}" @click="tab='stats'">
                📊 Overview
              </button>
              <button type="button" class="tab" :class="{active:tab==='produce'}" @click="tab='produce'">
                📤 Produce
              </button>
              <button type="button" class="tab" :class="{active:tab==='subs'}" @click="tab='subs';loadSubs()">
                🔔 Subscriptions
              </button>
              <button type="button" class="tab" :class="{active:tab==='backlog'}" @click="openBacklogTab()">
                📋 Backlog
              </button>
            </div>

            <!-- ── Overview tab ── -->
            <template x-if="tab==='stats'">
              <div>
                <template x-if="loading.stats">
                  <div class="topic-stats-loading"><div class="spinner"></div></div>
                </template>
                <template x-if="!loading.stats && stats">
                  <div>
                    <div class="stats-grid">
                      <div class="stat-card">
                        <div class="stat-label">Messages/s in</div>
                        <div class="stat-value" x-text="fmt(stats.msgRateIn)"></div>
                        <div class="stat-sub" x-text="fmtBytes(stats.msgThroughputIn) + '/s'"></div>
                      </div>
                      <div class="stat-card">
                        <div class="stat-label">Messages/s out</div>
                        <div class="stat-value" x-text="fmt(stats.msgRateOut)"></div>
                        <div class="stat-sub" x-text="fmtBytes(stats.msgThroughputOut) + '/s'"></div>
                      </div>
                      <div class="stat-card">
                        <div class="stat-label">Backlog total</div>
                        <div class="stat-value" x-text="fmtNum(stats.msgBacklog ?? sumBacklog(stats))"></div>
                        <div class="stat-sub">messages</div>
                      </div>
                      <div class="stat-card">
                        <div class="stat-label">Producers</div>
                        <div class="stat-value" x-text="Object.keys(stats.publishers ?? {}).length"></div>
                      </div>
                      <div class="stat-card">
                        <div class="stat-label">Subscriptions</div>
                        <div class="stat-value" x-text="Object.keys(stats.subscriptions ?? {}).length"></div>
                      </div>
                      <div class="stat-card">
                        <div class="stat-label">Storage</div>
                        <div class="stat-value" x-text="fmtBytes(stats.storageSize ?? 0)"></div>
                      </div>
                    </div>

                    <template x-if="stats.subscriptions && Object.keys(stats.subscriptions).length > 0">
                      <div class="card">
                        <div class="card-title"><span class="dot"></span>Subscription Details</div>
                        <div class="table-wrap">
                          <table class="card-table">
                            <thead>
                              <tr>
                                <th>Name</th>
                                <th>Type</th>
                                <th>Backlog</th>
                                <th>Limit</th>
                                <th>Msg/s</th>
                                <th>Consumers</th>
                                <th></th>
                              </tr>
                            </thead>
                            <template x-for="[name, sub] in Object.entries(stats.subscriptions)" :key="name">
                              <tbody>
                                <tr data-testid="sub-row" :id="'sub-row-' + name">
                                  <td data-label="Name">
                                    <span class="mono" x-text="name"></span>
                                    <template x-if="bridgeForSub(name)">
                                      <button
                                        type="button"
                                        class="sub-bridge"
                                        data-testid="sub-bridge"
                                        @click="openBridgeOf(bridgeForSub(name))"
                                        :title="'Open bridge ' + bridgeForSub(name).name + ' in the Bridges panel'"
                                      >
                                        <span class="tag tag-orange">bridge</span>
                                        <span class="sub-bridge-name" x-text="bridgeForSub(name).name"></span>
                                        <span
                                          class="sub-bridge-dest mono"
                                          x-text="'→ ' + bridgeDestTopics(bridgeForSub(name)).join(', ')"
                                        ></span>
                                      </button>
                                    </template>
                                  </td>
                                  <td data-label="Type"><span class="tag tag-blue" x-text="sub.type ?? '-'"></span></td>
                                  <td data-label="Backlog">
                                    <span
                                      class="mono"
                                      :class="{ 'over-limit': subHasLimit(name) && subLimit(name) != null && (sub.msgBacklog ?? 0) > subLimit(name) }"
                                      x-text="fmtNum(sub.msgBacklog ?? 0)"
                                    ></span>
                                  </td>
                                  <td data-label="Limit" class="sub-limit">
                                    <template x-if="subLimits.editing !== name">
                                      <button
                                        type="button"
                                        class="link-btn"
                                        :disabled="!subHasLimit(name) || subLimits.global == null"
                                        :title="!subHasLimit(name) ? 'Not watched by the backlog alert'
                                                  : subLimits.global == null ? 'Catavigia does not answer: ' + subLimits.error
                                                  : 'Change the backlog limit of this subscription'"
                                        @click="editSubLimit(name)"
                                      >
                                        <span x-text="subLimitLabel(name)"></span>
                                        <span x-show="subHasLimit(name) && subLimits.global != null" aria-hidden="true"
                                          >✎</span
                                        >
                                      </button>
                                    </template>
                                    <template x-if="subLimits.editing === name">
                                      <form class="sub-limit-form" @submit.prevent="saveSubLimit(name, 'PUT')">
                                        <input
                                          type="number"
                                          min="1"
                                          max="1000000000"
                                          step="1"
                                          x-model.number="subLimits.draft"
                                          aria-label="Backlog limit"
                                          @keydown.escape="subLimits.editing = null"
                                        />
                                        <button
                                          type="submit"
                                          class="btn btn-primary btn-xs"
                                          :disabled="subLimits.saving"
                                        >
                                          Save
                                        </button>
                                        <template x-if="subOwnLimit(name) != null">
                                          <button
                                            type="button"
                                            class="link-btn"
                                            :disabled="subLimits.saving"
                                            @click="saveSubLimit(name, 'DELETE')"
                                          >
                                            use global
                                          </button>
                                        </template>
                                        <button type="button" class="link-btn" @click="subLimits.editing = null">
                                          cancel
                                        </button>
                                      </form>
                                    </template>
                                  </td>
                                  <td data-label="Msg/s" x-text="fmt(sub.msgRateOut ?? 0)"></td>
                                  <td data-label="Consumers">
                                    <button
                                      type="button"
                                      class="link-btn consumers-toggle"
                                      @click="toggleSubConsumers(name)"
                                      :aria-expanded="!!subConsumersOpen[name]"
                                      :disabled="(sub.consumers ?? []).length === 0"
                                      :title="(sub.consumers ?? []).length ? 'Show who is connected' : 'Nobody is connected'"
                                    >
                                      <span x-text="(sub.consumers ?? []).length"></span>
                                      <span
                                        x-show="(sub.consumers ?? []).length"
                                        x-text="subConsumersOpen[name] ? '▾' : '▸'"
                                      ></span>
                                    </button>
                                  </td>
                                  <td class="cell-actions">
                                    <button
                                      type="button"
                                      class="btn btn-ghost btn-xs"
                                      :aria-expanded="!!subHistory.open[name]"
                                      :class="{ active: subHistory.open[name] }"
                                      title="History of this subscription (Catametricas)"
                                      @click="toggleSubHistory(name)"
                                    >
                                      📈
                                    </button>
                                    <span
                                      class="tag tag-binary"
                                      x-show="isSystemSub(name)"
                                      title="Pulsar's own subscription: it can be peeked but not changed"
                                      >system</span
                                    >
                                    <button
                                      type="button"
                                      class="btn btn-danger btn-xs"
                                      x-show="!isSystemSub(name)"
                                      :disabled="!(sub.msgBacklog > 0)"
                                      :title="sub.msgBacklog > 0 ? 'Skip all ' + fmtNum(sub.msgBacklog) + ' backlog message(s)' : 'Backlog is empty'"
                                      @click="clearBacklog(name, sub.msgBacklog)"
                                    >
                                      Clear backlog
                                    </button>
                                  </td>
                                </tr>
                                <template x-if="subHistory.open[name]">
                                  <tr class="sub-history-row">
                                    <td colspan="7">
                                      <div class="sub-history">
                                        <div class="sub-history-head">
                                          <span class="muted"
                                            >History of <span class="mono" x-text="name"></span> · backlog (line, max
                                            shaded) and delivered (bars), from Catametricas</span
                                          >
                                          <div class="period-switch">
                                            <template x-for="p in ['1h', '24h', '7d', '30d']" :key="p">
                                              <button
                                                type="button"
                                                class="btn btn-ghost btn-xs"
                                                :class="{ active: subHistory.period === p }"
                                                @click="setSubHistoryPeriod(p)"
                                                x-text="p"
                                              ></button>
                                            </template>
                                          </div>
                                        </div>
                                        <template x-if="subHistory.loading[name] && !subHistory.data[name]">
                                          <div class="sub-history-loading">
                                            <div class="spinner"></div>
                                          </div>
                                        </template>
                                        <template x-if="subHistory.error[name]">
                                          <p
                                            class="muted sub-history-error"
                                            x-text="'History unavailable: ' + subHistory.error[name]"
                                          ></p>
                                        </template>
                                        <template x-if="subHistory.data[name] && !subHistory.error[name]">
                                          <div>
                                            <template x-if="subChartModel(name).empty">
                                              <p class="muted sub-history-empty">No history for this period yet.</p>
                                            </template>
                                            <div class="sub-chart" x-show="!subChartModel(name).empty">
                                              <div class="sub-chart-y">
                                                <template x-for="(l, i) in subChartModel(name).yLabels" :key="i"
                                                  ><span x-text="l"></span
                                                ></template>
                                              </div>
                                              <svg
                                                viewBox="0 0 760 140"
                                                preserveAspectRatio="none"
                                                class="sub-chart-svg"
                                                @mousemove="subChartHover(name, $event)"
                                                @mouseleave="subHistory.hover = null"
                                              >
                                                <path class="sub-chart-bar" :d="subChartModel(name).barsPath"></path>
                                                <path class="sub-chart-max" :d="subChartModel(name).maxLine"></path>
                                                <path class="sub-chart-line" :d="subChartModel(name).line"></path>
                                                <line
                                                  class="sub-chart-limit"
                                                  x1="0"
                                                  :x2="subChartModel(name).width"
                                                  x-show="subChartModel(name).limitY != null"
                                                  :y1="subChartModel(name).limitY ?? 0"
                                                  :y2="subChartModel(name).limitY ?? 0"
                                                ></line>
                                                <line
                                                  class="chart-hover-line"
                                                  x-show="subHistory.hover && subHistory.hover.name === name"
                                                  :x1="subHistory.hover?.x ?? 0"
                                                  :x2="subHistory.hover?.x ?? 0"
                                                  y1="0"
                                                  :y2="subChartModel(name).height"
                                                ></line>
                                              </svg>
                                            </div>
                                            <div class="sub-chart-x" x-show="!subChartModel(name).empty">
                                              <template x-for="(l, i) in subChartModel(name).xLabels" :key="i"
                                                ><span x-text="l.text"></span
                                              ></template>
                                            </div>
                                            <div class="muted sub-chart-legend">
                                              <span
                                                x-text="subHistory.hover && subHistory.hover.name === name ? subHistory.hover.text
                                                        : 'Delivered bars scale to ' + fmtCompact(subChartModel(name).outTop) + ' per bucket'"
                                              ></span>
                                              <template x-if="subChartModel(name).limitY != null">
                                                <span
                                                  >· dashed line: limit <span x-text="fmtNum(subLimit(name))"></span
                                                ></span>
                                              </template>
                                            </div>
                                          </div>
                                        </template>
                                      </div>
                                    </td>
                                  </tr>
                                </template>
                                <template x-if="subConsumersOpen[name] && (sub.consumers ?? []).length">
                                  <tr class="consumers-row">
                                    <td colspan="7">
                                      <table class="card-table consumers-table">
                                        <thead>
                                          <tr>
                                            <th>Consumer</th>
                                            <th>Address</th>
                                            <th>Connected since</th>
                                            <th>Client</th>
                                            <th>Msg/s</th>
                                            <th>Unacked</th>
                                          </tr>
                                        </thead>
                                        <tbody>
                                          <template x-for="(c, i) in sub.consumers" :key="i">
                                            <tr>
                                              <td data-label="Consumer">
                                                <span class="mono" x-text="c.consumerName || '—'"></span>
                                                <template
                                                  x-if="sub.activeConsumerName && sub.activeConsumerName === c.consumerName"
                                                >
                                                  <span
                                                    class="tag tag-blue"
                                                    title="Failover: this consumer receives the messages"
                                                    >active</span
                                                  >
                                                </template>
                                                <template x-if="c.blockedConsumerOnUnackedMsgs">
                                                  <span
                                                    class="tag tag-orange"
                                                    title="Too many unacknowledged messages: Pulsar stopped sending to it"
                                                    >blocked</span
                                                  >
                                                </template>
                                              </td>
                                              <td data-label="Address" class="mono" x-text="c.address || '—'"></td>
                                              <td data-label="Connected since" x-text="fmtDate(c.connectedSince)"></td>
                                              <td data-label="Client" class="mono" x-text="c.clientVersion || '—'"></td>
                                              <td data-label="Msg/s" x-text="fmt(c.msgRateOut ?? 0)"></td>
                                              <td data-label="Unacked" x-text="fmtNum(c.unackedMessages ?? 0)"></td>
                                            </tr>
                                          </template>
                                        </tbody>
                                      </table>
                                    </td>
                                  </tr>
                                </template>
                              </tbody>
                            </template>
                          </table>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>

            <!-- ── Produce tab ── -->
            <template x-if="tab==='produce'">
              <div class="card">
                <div class="card-title"><span class="dot"></span>Send Message</div>
                <div class="form-row">
                  <div class="field">
                    <label for="produce-key">Message Key (optional)</label>
                    <input id="produce-key" type="text" x-model="produce.key" placeholder="e.g. user-123" />
                  </div>
                </div>
                <div class="field produce-payload-field">
                  <label for="produce-payload">Payload</label>
                  <textarea
                    id="produce-payload"
                    x-model="produce.payload"
                    placeholder='{"event":"test","value":42}'
                    rows="6"
                  ></textarea>
                </div>
                <div class="produce-actions">
                  <button
                    type="button"
                    class="btn btn-primary"
                    @click="sendMessage()"
                    :disabled="!produce.payload || loading.produce"
                  >
                    <template x-if="loading.produce"><span class="spinner"></span></template>
                    <template x-if="!loading.produce"><span>📤</span></template>
                    Send
                  </button>
                  <template x-if="produce.lastId">
                    <span class="produce-sent"
                      >✓ sent: <span class="mono produce-sent-id" x-text="produce.lastId"></span
                    ></span>
                  </template>
                </div>
              </div>
            </template>

            <!-- ── Subscriptions tab ── -->
            <template x-if="tab==='subs'">
              <div>
                <div class="card">
                  <div class="card-title"><span class="dot"></span>Current Subscriptions</div>
                  <template x-if="loading.subs">
                    <div class="subs-loading"><div class="spinner"></div></div>
                  </template>
                  <template x-if="!loading.subs && subscriptions.length === 0">
                    <p class="subs-empty">No subscriptions on this topic.</p>
                  </template>
                  <template x-for="sub in subscriptions" :key="sub">
                    <div class="sub-item">
                      <div><div class="sub-name" x-text="sub"></div></div>
                      <span
                        class="tag tag-binary"
                        x-show="isSystemSub(sub)"
                        title="Pulsar's own subscription: it can be peeked but not changed"
                        >system</span
                      >
                      <button
                        type="button"
                        class="btn btn-danger subs-delete-btn"
                        x-show="!isSystemSub(sub)"
                        @click="deleteSub(sub)"
                      >
                        Delete
                      </button>
                    </div>
                  </template>
                </div>
                <div class="card">
                  <div class="card-title"><span class="dot"></span>New Subscription</div>
                  <div class="form-row">
                    <div class="field">
                      <label for="new-sub-name">Subscription name</label>
                      <input
                        id="new-sub-name"
                        type="text"
                        x-model="newSub"
                        placeholder="e.g. my-consumer"
                        x-name-chars="pulsar"
                        title='Spaces and other characters a name cannot have become "-" as you type'
                        @keydown.enter="createSub()"
                      />
                    </div>
                    <button
                      type="button"
                      class="btn btn-primary"
