<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Catapulsar</title>
    <link rel="icon" type="image/svg+xml" href="/catapulsar-icon.svg" />
    <link rel="stylesheet" href="/catapulsar.css?v=29" />
    <script src="/catapulsar.js?v=29" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.8/cdn.min.js" defer></script>
  </head>
  <body x-data="app()">
    <!-- ══ Settings overlay ════════════════════════════════════════════════════ -->
    <template x-if="settings.open">
      <div class="overlay" @click.self="settings.open=false" @keydown.escape.window="settings.open=false">
        <div class="settings-box" role="dialog" aria-modal="true" aria-labelledby="settings-title">
          <div class="settings-title">
            <span id="settings-title">⚙️ Settings</span>
            <button type="button" class="close-btn" @click="settings.open=false" aria-label="Close settings">✕</button>
          </div>

          <div class="tabs settings-tabs" role="tablist" aria-label="Settings sections">
            <button
              type="button"
              role="tab"
              class="tab"
              id="settings-tab-connections"
              :class="{ active: settings.tab === 'connections' }"
              :aria-selected="settings.tab === 'connections'"
              aria-controls="settings-panel-connections"
              @click="settings.tab = 'connections'"
            >
              🔌 Connections
            </button>
            <button
              type="button"
              role="tab"
              class="tab"
              id="settings-tab-refresh"
              :class="{ active: settings.tab === 'refresh' }"
              :aria-selected="settings.tab === 'refresh'"
              aria-controls="settings-panel-refresh"
              @click="settings.tab = 'refresh'"
            >
              ⏱ Refresh &amp; collection
            </button>
            <button
              type="button"
              role="tab"
              class="tab"
              id="settings-tab-alerts"
              :class="{ active: settings.tab === 'alerts' }"
              :aria-selected="settings.tab === 'alerts'"
              aria-controls="settings-panel-alerts"
              @click="settings.tab = 'alerts'"
            >
              🔔 Alerts
            </button>
          </div>

          <div class="settings-body">
            <section
              id="settings-panel-connections"
              role="tabpanel"
              aria-labelledby="settings-tab-connections"
              x-show="settings.tab === 'connections'"
            >
              <div class="field settings-pulsar-url-field">
                <label for="pulsar-url">Pulsar Admin URL</label>
                <input
                  id="pulsar-url"
                  type="text"
                  x-model="settings.pulsarUrl"
                  placeholder="http://192.168.86.35:31080"
                  @keydown.enter="saveSettings()"
                />
              </div>

              <div class="health-row">
                <button type="button" class="btn btn-ghost settings-pulsar-check-btn" @click="checkHealth()">
                  <template x-if="settings.healthState==='checking'"
                    ><span class="spinner settings-pulsar-check-spinner"></span
                  ></template>
                  <template x-if="settings.healthState!=='checking'"><span>🩺</span></template>
                  Health Check
                </button>
                <template x-if="settings.healthState==='ok'">
                  <span class="health-msg ok">✓ <span x-text="settings.healthMsg"></span></span>
                </template>
                <template x-if="settings.healthState==='error'">
                  <span class="health-msg error">✕ <span x-text="settings.healthMsg"></span></span>
                </template>
              </div>

              <p class="settings-hint">
                Shown in the top bar of this browser; the server connects to
                <span class="mono">PULSAR_SERVICE_URL</span>.
              </p>

              <div class="divider"></div>

              <div class="field settings-cataponte-url-field">
                <label for="cataponte-url">Cataponte URL</label>
                <input
                  id="cataponte-url"
                  type="url"
                  x-model.trim="bridges.settings.draft"
                  placeholder="http://cataponte:8082"
                  autocomplete="off"
                  @keydown.enter="saveSettings()"
                />
              </div>
              <p class="settings-hint">
                Default (<span class="mono">CATAPONTE_URL</span>):
                <span class="mono" x-text="bridges.settings.defaultUrl"></span>
                <template x-if="bridges.settings.custom">
                  <button
                    type="button"
                    class="link-btn"
                    :disabled="bridges.settings.saving"
                    @click="resetCataponteUrl()"
                  >
                    use default
                  </button>
                </template>
                <br />Applies to every user immediately, is saved in MongoDB and recorded in the audit log.
              </p>
              <div class="health-row">
                <button type="button" class="btn btn-ghost settings-cataponte-check-btn" @click="checkCataponte()">
                  <template x-if="bridges.settings.healthState==='checking'"
                    ><span class="spinner settings-cataponte-check-spinner"></span
                  ></template>
                  <template x-if="bridges.settings.healthState!=='checking'"><span>🩺</span></template>
                  Check Cataponte
                </button>
                <template x-if="bridges.settings.healthState==='ok'">
                  <span class="health-msg ok">✓ <span x-text="bridges.settings.healthMsg"></span></span>
                </template>
                <template x-if="bridges.settings.healthState==='error'">
                  <span class="health-msg error">✕ <span x-text="bridges.settings.healthMsg"></span></span>
                </template>
              </div>

              <div class="divider"></div>

              <div class="field settings-cataudit-url-field">
                <label for="cataudit-url">Cataudit URL</label>
                <input
                  id="cataudit-url"
                  type="url"
                  x-model.trim="audit.settings.draft"
                  placeholder="http://cataudit:8084"
                  autocomplete="off"
                  @keydown.enter="saveSettings()"
                />
              </div>
              <p class="settings-hint">
                Default (<span class="mono">CATAUDIT_URL</span>):
                <span class="mono" x-text="audit.settings.defaultUrl"></span>
                <template x-if="audit.settings.custom">
                  <button type="button" class="link-btn" :disabled="audit.settings.saving" @click="resetCatauditUrl()">
                    use default
                  </button>
                </template>
                <br />Where the Audit panel reads the audit trail. Applies to every user immediately, is saved in
                MongoDB and recorded in the audit log.
              </p>
              <div class="health-row">
                <button type="button" class="btn btn-ghost settings-cataudit-check-btn" @click="checkCataudit()">
                  <template x-if="audit.settings.healthState==='checking'"
                    ><span class="spinner settings-cataudit-check-spinner"></span
                  ></template>
                  <template x-if="audit.settings.healthState!=='checking'"><span>🩺</span></template>
                  Check Cataudit
                </button>
                <template x-if="audit.settings.healthState==='ok'">
                  <span class="health-msg ok">✓ <span x-text="audit.settings.healthMsg"></span></span>
                </template>
                <template x-if="audit.settings.healthState==='error'">
                  <span class="health-msg error">✕ <span x-text="audit.settings.healthMsg"></span></span>
                </template>
              </div>

              <div class="divider"></div>

              <div class="field settings-catametricas-url-field">
                <label for="catametricas-url">Catametricas URL</label>
                <input
                  id="catametricas-url"
                  type="url"
                  x-model.trim="catametricas.draft"
                  placeholder="http://catametricas:8083"
                  autocomplete="off"
                  @keydown.enter="saveSettings()"
                />
              </div>
              <p class="settings-hint">
                Default (<span class="mono">CATAMETRICAS_URL</span>):
                <span class="mono" x-text="catametricas.defaultUrl"></span>
                <template x-if="catametricas.custom">
                  <button
                    type="button"
                    class="link-btn"
                    :disabled="catametricas.saving"
                    @click="resetCatametricasUrl()"
                  >
                    use default
                  </button>
                </template>
                <br />Where the overviews read their statistics. Applies to every user immediately, is saved in MongoDB
                and recorded in the audit log.
              </p>
              <div class="health-row">
                <button
                  type="button"
                  class="btn btn-ghost settings-catametricas-check-btn"
                  @click="checkCatametricas()"
                >
                  <template x-if="catametricas.healthState==='checking'"
                    ><span class="spinner settings-catametricas-check-spinner"></span
                  ></template>
                  <template x-if="catametricas.healthState!=='checking'"><span>🩺</span></template>
                  Check Catametricas
                </button>
                <template x-if="catametricas.healthState==='ok'">
                  <span class="health-msg ok">✓ <span x-text="catametricas.healthMsg"></span></span>
                </template>
                <template x-if="catametricas.healthState==='error'">
                  <span class="health-msg error">✕ <span x-text="catametricas.healthMsg"></span></span>
                </template>
              </div>

              <div class="divider"></div>

              <div class="field settings-catavigia-url-field">
                <label for="catavigia-url">Catavigia URL</label>
                <input
                  id="catavigia-url"
                  type="url"
                  x-model.trim="alerts.settings.draft"
                  placeholder="http://catavigia:8085"
                  autocomplete="off"
                  @keydown.enter="saveSettings()"
                />
              </div>
              <p class="settings-hint">
                Default (<span class="mono">CATAVIGIA_URL</span>):
                <span class="mono" x-text="alerts.settings.defaultUrl"></span>
                <template x-if="alerts.settings.custom">
                  <button
                    type="button"
                    class="link-btn"
                    :disabled="alerts.settings.saving"
                    @click="resetCatavigiaUrl()"
                  >
                    use default
                  </button>
                </template>
                <br />Where the Alerts panel, the badge and the backlog limits come from. Applies to every user
                immediately, is saved in MongoDB and recorded in the audit log.
              </p>
              <div class="health-row">
                <button type="button" class="btn btn-ghost settings-catavigia-check-btn" @click="checkCatavigia()">
                  <template x-if="alerts.settings.healthState==='checking'"
                    ><span class="spinner settings-catavigia-check-spinner"></span
                  ></template>
                  <template x-if="alerts.settings.healthState!=='checking'"><span>🩺</span></template>
                  Check Catavigia
                </button>
                <template x-if="alerts.settings.healthState==='ok'">
                  <span class="health-msg ok">✓ <span x-text="alerts.settings.healthMsg"></span></span>
                </template>
                <template x-if="alerts.settings.healthState==='error'">
                  <span class="health-msg error">✕ <span x-text="alerts.settings.healthMsg"></span></span>
                </template>
              </div>
            </section>

            <section
              id="settings-panel-refresh"
              role="tabpanel"
              aria-labelledby="settings-tab-refresh"
              x-show="settings.tab === 'refresh'"
            >
              <div class="field settings-refresh-field">
                <label for="settings-refresh-seconds">Auto-refresh interval (seconds)</label>
                <input
                  id="settings-refresh-seconds"
                  type="number"
                  step="1"
                  :min="auto.min"
                  :max="auto.max"
                  x-model.number="auto.draft"
                  @keydown.enter="saveSettings()"
                />
              </div>
              <p class="settings-hint">
                <span x-text="auto.min + '–' + auto.max + ' s · default ' + auto.defaultSeconds + ' s'"></span>
                <template x-if="auto.custom">
                  <button type="button" class="link-btn" :disabled="auto.saving" @click="saveRefreshInterval('DELETE')">
                    use default
                  </button>
                </template>
                <br />How often the screen refreshes, for every user; saved in MongoDB and recorded in the audit log.
                The on/off switch in the top bar only affects this browser.
              </p>

              <div class="divider"></div>

              <div class="field settings-collect-field">
                <label for="collect-seconds">Catametricas collection interval (seconds)</label>
                <input
                  id="collect-seconds"
                  type="number"
                  step="1"
                  :min="collect.min"
                  :max="collect.max"
                  x-model.number="collect.draft"
                  @keydown.enter="saveSettings()"
                />
              </div>
              <p class="settings-hint">
                <span x-text="collect.min + '–' + collect.max + ' s · default ' + collect.defaultSeconds + ' s'"></span>
                <template x-if="collect.custom">
                  <button type="button" class="link-btn" @click="saveCollectInterval('DELETE')">use default</button>
                </template>
                <br />How often Catametricas reads every topic's statistics into MongoDB. Applies from its next
                interval; saved in MongoDB and recorded in the audit log.
              </p>
            </section>

            <section
              id="settings-panel-alerts"
              role="tabpanel"
              aria-labelledby="settings-tab-alerts"
              x-show="settings.tab === 'alerts'"
            >
              <p class="settings-hint settings-alerts-hint">
                Read by Catavigia before every round, for every user; saved in MongoDB and recorded in the audit log.
              </p>
              <template x-for="t in alertThresholds" :key="t.name">
                <div>
                  <div class="field settings-threshold-field">
                    <label :for="'alert-threshold-' + t.name" x-text="thresholdInfo(t.name).label"></label>
                    <input
                      :id="'alert-threshold-' + t.name"
                      :aria-label="thresholdInfo(t.name).label"
                      type="number"
                      step="1"
                      :min="t.min"
                      :max="t.max"
                      x-model.number="t.draft"
                      @keydown.enter="saveSettings()"
                    />
                  </div>
                  <p class="settings-hint">
                    <span x-text="fmtNum(t.min) + '–' + fmtNum(t.max) + ' · default ' + fmtNum(t.defaultValue)"></span>
                    <template x-if="t.custom">
                      <button type="button" class="link-btn" @click="saveAlertThreshold(t, 'DELETE')">
                        use default
                      </button>
                    </template>
                    <br /><span x-text="thresholdInfo(t.name).hint"></span>
                  </p>
                  <div class="divider"></div>
                </div>
              </template>
              <template x-if="alertThresholds.length === 0">
                <p class="muted settings-alerts-error">Alert settings could not be read.</p>
              </template>
              <div class="field settings-dlq-field">
                <label for="dlq-deliveries">Deliveries before a message goes to its dead-letter topic</label>
                <input
                  id="dlq-deliveries"
                  type="number"
                  step="1"
                  :min="dlqSetting.min"
                  :max="dlqSetting.max"
                  x-model.number="dlqSetting.draft"
                  @keydown.enter="saveSettings()"
                />
              </div>
              <p class="settings-hint">
                <span x-text="dlqSetting.min + '–' + dlqSetting.max + ' · default ' + dlqSetting.defaultValue"></span>
                <template x-if="dlqSetting.custom">
                  <button type="button" class="link-btn" @click="saveDlqSetting('DELETE')">use default</button>
                </template>
                <br />A message that keeps failing on its own is moved to
                <span class="mono">&lt;topic&gt;-&lt;subscription&gt;-DLQ</span>
                after this many deliveries (Cataudit, Catametricas, Catavigia and unordered Shared/Key_Shared bridges).
                Outages do not count. Changing it makes them subscribe again; saved in MongoDB and recorded in the audit
                log.
              </p>
            </section>
          </div>

          <div class="settings-footer">
            <button type="button" class="btn btn-secondary" @click="settings.open=false">Cancel</button>
            <button
              type="button"
              class="btn btn-primary"
              :disabled="bridges.settings.saving || audit.settings.saving || alerts.settings.saving || auto.saving"
              @click="saveSettings()"
            >
              Save
            </button>
          </div>
        </div>
      </div>
    </template>

    <!-- ══ Message view/edit modal ════════════════════════════════════════════ -->
    <template x-if="modal.type">
      <div class="modal" @click.self="closeModal()">
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="message-modal-title">
          <div class="modal-header">
            <h3 id="message-modal-title" x-text="modal.type==='view' ? '🔍 Message details' : '✏️ Re-produce message'">
              Message
            </h3>
            <button type="button" class="close-btn" @click="closeModal()">✕</button>
          </div>

          <div class="modal-body">
            <!-- Metadata -->
            <div class="meta-row">
              <span class="meta-key">Message ID</span><span class="meta-val" x-text="modal.message?.messageId"></span>
            </div>
            <div class="meta-row">
              <span class="meta-key">Published</span
              ><span class="meta-val" x-text="fmtDate(modal.message?.publishTime)"></span>
            </div>
            <template x-if="modal.message?.key">
              <div class="meta-row">
                <span class="meta-key">Key</span><span class="meta-val" x-text="modal.message.key"></span>
              </div>
            </template>

            <!-- View mode -->
            <template x-if="modal.type==='view'">
              <div class="payload-view" x-text="prettyJson(modal.message?.payload)"></div>
            </template>

            <!-- Edit mode -->
            <template x-if="modal.type==='edit'">
              <div>
                <div class="warn-note">
                  ⚠ Pulsar messages are immutable. This re-produces a new message with your changes. The original
                  message remains in the backlog — use <strong>Skip</strong> to remove it after re-producing.
                </div>
                <div class="field message-modal-key-field">
                  <label for="message-edit-key">Message Key</label>
                  <input id="message-edit-key" type="text" x-model="modal.editKey" placeholder="optional key" />
                </div>
                <div class="field">
                  <label for="message-edit-payload">Payload</label>
                  <textarea id="message-edit-payload" x-model="modal.editPayload" rows="8"></textarea>
                </div>
              </div>
            </template>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" @click="closeModal()">Close</button>
            <template x-if="modal.type==='edit'">
              <button
                type="button"
                class="btn btn-primary"
                @click="saveEdit()"
                :disabled="!modal.editPayload || modal.saving"
              >
                <template x-if="modal.saving"><span class="spinner"></span></template>
                Re-produce
              </button>
            </template>
          </div>
        </div>
      </div>
    </template>

    <!-- ══ Bridge form modal ══════════════════════════════════════════════════ -->
    <template x-if="bridges.form !== null">
      <div class="overlay" @click.self="closeBridgeForm()">
        <div
          class="bridge-form-box"
          data-testid="bridge-form"
          role="dialog"
          aria-modal="true"
          aria-labelledby="bridge-form-title"
        >
          <div class="settings-title">
            <span
              id="bridge-form-title"
              x-text="bridges.form && bridges.form.id ? '✏️ Edit Bridge' : '⇌ New Bridge'"
            ></span>
            <button type="button" class="close-btn" @click="closeBridgeForm()">✕</button>
          </div>

          <div class="form-row">
            <div class="field">
              <label for="bridge-name">Name *</label>
              <input
                id="bridge-name"
                type="text"
                x-model="bridges.form.name"
                data-testid="bridge-form-name"
                placeholder="e.g. orders-to-dlq"
                x-name-chars="cataponte"
                title='Spaces and other characters a name cannot have become "-" as you type'
                @input="onBridgeNameInput()"
                @keydown.enter="saveBridge()"
              />
            </div>
            <div class="field">
              <label for="bridge-description">Description</label>
              <input id="bridge-description" type="text" x-model="bridges.form.description" placeholder="Optional" />
            </div>
          </div>

          <div class="field bridge-form-area-field">
            <label for="bridge-area">Area</label>
            <template x-if="bridges.form.system">
              <div class="muted bridge-form-area-system">System — system bridges always stay in System.</div>
            </template>
            <template x-if="!bridges.form.system">
              <div>
                <select
                  id="bridge-area"
                  x-model="bridges.form.areaId"
                  @change="bridges.form.areaId = bridges.form.areaId || null"
                >
                  <option value="">Bridges (no area)</option>
                  <template x-for="a in bridges.areas" :key="a.id">
                    <option :value="a.id" :selected="bridges.form.areaId === a.id" x-text="a.name"></option>
                  </template>
                </select>
                <template x-if="areaById(bridges.form.areaId)">
                  <div class="muted bridge-form-area-patterns">
                    Topics are limited to
                    <span
                      class="mono"
                      x-text="(areaById(bridges.form.areaId).patterns || []).join(', ') || 'every topic'"
                    ></span>
                  </div>
                </template>
              </div>
            </template>
          </div>

          <div class="form-section-label">⬅ Source</div>
          <div class="field bridge-form-source-field">
            <label>Topic *</label>
            <div
              class="topic-picker-selected"
              :class="{empty: !bridges.form.source.topic}"
              x-text="bridges.form.source.topic || 'no topic selected'"
            ></div>
            <input
              type="text"
              x-model="bridges.srcFilter"
              aria-label="Filter source topics"
              placeholder="filter topics…"
              class="topic-picker-filter"
            />
            <div class="sub-picker topic-picker">
              <template x-if="bridges.topicsLoading">
                <div class="sub-picker-empty">
                  <span class="spinner bridge-form-source-spinner"></span> loading topics…
                </div>
              </template>
              <template
                x-if="!bridges.topicsLoading && filteredTopics(bridges.srcFilter, bridges.form.destinations.map(d => d.topic)).length === 0"
              >
                <div class="sub-picker-empty">no topics found</div>
              </template>
              <template
                x-for="t in filteredTopics(bridges.srcFilter, bridges.form.destinations.map(d => d.topic))"
                :key="t"
              >
                <div
                  class="sub-picker-item"
                  data-testid="bridge-form-source-topic"
                  :class="{ selected: bridges.form.source.topic === t }"
                  role="button"
                  tabindex="0"
                  :aria-pressed="bridges.form.source.topic === t"
                  @click="bridges.form.source.topic = t"
                  @keydown.enter.prevent="bridges.form.source.topic = t"
                  @keydown.space.prevent="bridges.form.source.topic = t"
                  :title="t"
                  x-text="t"
                ></div>
              </template>
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="bridge-subscription">Subscription name *</label>
              <input
                id="bridge-subscription"
                type="text"
                x-model="bridges.form.source.subscription"
                placeholder="cataponte-<bridge name>"
                x-name-chars="cataponte"
                @input="bridges.form.subAuto = false"
                title="Must be unique for this source topic: two bridges on one subscription would split its messages"
              />
            </div>
            <div class="field bridge-form-type-field">
              <label for="bridge-subscription-type">Type</label>
              <select id="bridge-subscription-type" x-model="bridges.form.source.subscriptionType">
                <option value="Shared">Shared</option>
                <option value="Failover">Failover</option>
                <option value="Key_Shared">Key_Shared</option>
              </select>
            </div>
          </div>

          <div class="form-section-label">➡ Destination</div>
          <div class="field bridge-form-dest-field">
            <label
              >Topics *
              <span class="bridge-form-dest-count" x-text="'(' + bridges.form.destinations.length + ' selected)'"></span
            ></label>
            <div class="topic-chips" :class="{empty: bridges.form.destinations.length === 0}">
              <template x-if="bridges.form.destinations.length === 0">
                <span>no topic selected — choose one or more</span>
              </template>
              <template x-for="d in bridges.form.destinations" :key="d.topic">
                <span class="topic-chip" :title="d.topic">
                  <span class="topic-chip-name" x-text="d.topic"></span>
                  <button
                    type="button"
                    class="topic-chip-x"
                    @click="toggleDestination(d.topic)"
                    title="Remove"
                    aria-label="Remove destination"
                  >
                    ✕
                  </button>
                </span>
              </template>
            </div>
            <input
              type="text"
              x-model="bridges.dstFilter"
              aria-label="Filter destination topics"
              placeholder="filter topics…"
              class="topic-picker-filter"
            />
            <div class="sub-picker topic-picker">
              <template x-if="bridges.topicsLoading">
                <div class="sub-picker-empty">
                  <span class="spinner bridge-form-dest-spinner"></span> loading topics…
                </div>
              </template>
              <template
                x-if="!bridges.topicsLoading && filteredTopics(bridges.dstFilter, bridges.form.source.topic).length === 0"
              >
                <div class="sub-picker-empty">no topics found</div>
              </template>
              <template x-for="t in filteredTopics(bridges.dstFilter, bridges.form.source.topic)" :key="t">
                <div
                  class="sub-picker-item topic-multi-item"
                  data-testid="bridge-form-dest-topic"
                  :class="{ selected: isDestSelected(t) }"
                  role="button"
                  tabindex="0"
                  :aria-pressed="isDestSelected(t)"
                  @click="toggleDestination(t)"
                  @keydown.enter.prevent="toggleDestination(t)"
                  @keydown.space.prevent="toggleDestination(t)"
                  :title="t"
                >
                  <span class="topic-check" x-text="isDestSelected(t) ? '✓' : ''"></span>
                  <span class="topic-multi-name" x-text="t"></span>
                </div>
              </template>
            </div>
          </div>

          <div class="form-section-label">Options</div>
          <div class="bridge-form-options">
            <label class="checkbox-label">
              <input type="checkbox" x-model="bridges.form.preserveKey" /> Preserve message key
            </label>
            <label class="checkbox-label">
              <input type="checkbox" x-model="bridges.form.preserveProperties" /> Preserve properties
            </label>
            <label class="checkbox-label">
              <input type="checkbox" x-model="bridges.form.enabled" /> Enabled on save
            </label>
            <label class="checkbox-label" title="Keep source order on every destination (needs Failover or Key_Shared)">
              <input type="checkbox" x-model="bridges.form.ordered" @change="onOrderedChange()" /> Keep message order
            </label>
          </div>
          <div class="warn-note" x-show="orderedOnShared()">
            Ordered bridges need a Failover or Key_Shared subscription — a Shared subscription cannot keep order.
          </div>
          <div class="warn-note" x-show="formOutsideTopics().length > 0">
            Outside the area's patterns: <span class="mono" x-text="formOutsideTopics().join(', ')"></span>. Choose
            other topics, another area, or change the area's patterns.
          </div>

          <div class="divider"></div>
          <div class="bridge-form-actions">
            <button type="button" class="btn btn-secondary" @click="closeBridgeForm()">Cancel</button>
            <button
              type="button"
              class="btn btn-primary"
              data-testid="bridge-form-save"
              @click="saveBridge()"
              :disabled="!bridgeFormValid() || bridges.formSaving"
            >
              <template x-if="bridges.formSaving"><span class="spinner"></span></template>
              Save Bridge
            </button>
          </div>
        </div>
      </div>
    </template>

    <!-- ══ Area form modal (ADR 0014) ════════════════════════════════════════════ -->
    <template x-if="bridges.areaForm !== null">
      <div class="overlay" @click.self="bridges.areaForm = null">
        <div class="bridge-form-box" role="dialog" aria-modal="true" aria-labelledby="area-form-title">
          <div class="settings-title">
            <span id="area-form-title" x-text="bridges.areaForm.id ? '✏️ Edit Area' : '▦ New Area'"></span>
            <button type="button" class="close-btn" @click="bridges.areaForm = null" aria-label="Close">✕</button>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="area-name">Name *</label>
              <input
                id="area-name"
                type="text"
                x-model="bridges.areaForm.name"
                placeholder="e.g. home-media"
                x-name-chars="cataponte"
                title='Spaces and other characters a name cannot have become "-" as you type'
              />
            </div>
            <div class="field">
              <label for="area-description">Description</label>
              <input id="area-description" type="text" x-model="bridges.areaForm.description" placeholder="Optional" />
            </div>
          </div>
          <div class="field area-form-patterns-field">
            <label for="area-patterns">Topic patterns (one per line; none = every topic)</label>
            <textarea
              id="area-patterns"
              rows="5"
              class="mono"
              x-model="bridges.areaForm.patternsText"
              x-name-chars="pattern"
              placeholder="home/media/*&#10;home/**&#10;*/*/events"
            ></textarea>
            <div class="muted area-form-patterns-hint">
              Written without <span class="mono">persistent://</span>, as
              <span class="mono">tenant/namespace/topic</span>. <span class="mono">*</span> matches within one segment,
              <span class="mono">**</span> across segments. The source and every destination of a bridge in this area
              must match.
            </div>
          </div>
          <div class="field area-form-matches-field">
            <label>
              Existing topics that match
              <span
                class="muted"
                x-text="bridges.topicsLoading ? '(loading…)' : '(' + areaFormMatches().length + ' of ' + bridges.topics.length + ')'"
              ></span>
            </label>
            <div class="sub-picker topic-picker area-preview">
              <template x-if="!bridges.topicsLoading && areaFormMatches().length === 0">
                <div class="sub-picker-empty">no existing topic matches</div>
              </template>
              <template x-for="t in areaFormMatches().slice(0, 50)" :key="t">
                <div class="sub-picker-item" :title="t" x-text="t"></div>
              </template>
            </div>
          </div>
          <template x-if="bridges.areaForm.id">
            <p class="muted area-form-outside-note">
              Changing the patterns is always accepted: bridges that no longer fit keep running, marked
              <em>outside filter</em>.
            </p>
          </template>
          <div class="divider"></div>
          <div class="area-form-actions">
            <button type="button" class="btn btn-secondary" @click="bridges.areaForm = null">Cancel</button>
            <button
              type="button"
              class="btn btn-primary"
              @click="saveArea()"
              :disabled="!bridges.areaForm.name.trim() || bridges.areaSaving"
            >
              <template x-if="bridges.areaSaving"><span class="spinner"></span></template>
              Save Area
            </button>
          </div>
        </div>
      </div>
    </template>

    <!-- ══ Delete area dialog ═══════════════════════════════════════════════════ -->
    <template x-if="bridges.areaDelete !== null">
      <div class="overlay" @click.self="bridges.areaDelete = null">
        <div
          class="bridge-form-box area-delete-box"
          role="dialog"
          aria-modal="true"
          aria-labelledby="area-delete-title"
        >
          <div class="settings-title">
            <span id="area-delete-title" x-text="'Delete area ' + bridges.areaDelete.area.name"></span>
            <button type="button" class="close-btn" @click="bridges.areaDelete = null" aria-label="Close">✕</button>
          </div>
          <p
            class="area-delete-intro"
            x-text="'This area has ' + bridges.areaDelete.count + ' bridge(s). What should happen to them?'"
          ></p>
          <div class="area-delete-move-row">
            <label class="checkbox-label">
              <input type="radio" value="move" x-model="bridges.areaDelete.choice" />
              <span class="area-delete-move-text">Move them to</span>
            </label>
            <select
              class="area-delete-target"
              aria-label="Area to move the bridges to"
              x-model="bridges.areaDelete.to"
              :disabled="bridges.areaDelete.choice !== 'move'"
            >
              <option value="">Bridges (no area)</option>
              <template x-for="a in bridges.areas.filter(a => a.id !== bridges.areaDelete.area.id)" :key="a.id">
                <option :value="a.id" x-text="a.name"></option>
              </template>
            </select>
          </div>
          <p class="muted area-delete-delete-hint" x-show="bridges.areaDelete.choice === 'move'">
            They keep running; any that do not fit the other area's patterns are marked <em>outside filter</em>.
          </p>
          <label class="checkbox-label">
            <input type="radio" value="delete" x-model="bridges.areaDelete.choice" /> Delete them all (their relays
            stop)
          </label>
          <div class="divider"></div>
          <div class="area-delete-actions">
            <button type="button" class="btn btn-secondary" @click="bridges.areaDelete = null">Cancel</button>
            <button
              type="button"
              class="btn btn-danger"
              @click="confirmDeleteArea()"
              :disabled="bridges.areaSaving"
              x-text="bridges.areaDelete.choice === 'delete' ? 'Delete area and bridges' : 'Move bridges and delete area'"
            ></button>
          </div>
        </div>
      </div>
    </template>

    <!-- ══ Sidebar (a drawer on phones, opened by ☰) ══════════════════════════════ -->
    <div class="drawer-backdrop" x-show="drawerOpen" @click="drawerOpen = false" aria-hidden="true"></div>
    <div id="sidebar" :class="{ open: drawerOpen }" @keydown.escape.window="drawerOpen = false">
      <div id="sidebar-header">
        <h1>
          <button type="button" class="brand" @click="showCluster()" title="Cluster overview">
            <img class="sidebar-logo" src="/catapulsar-icon.svg" alt="" />
            Catapulsar
          </button>
        </h1>
      </div>

      <div id="sidebar-tree">
        <template x-if="loading.tenants">
          <div class="sidebar-empty"><div class="spinner"></div></div>
        </template>

        <template x-if="!loading.tenants && Object.keys(tree.open).length > 1">
          <div class="tree-tools">
            <button
              type="button"
              class="link-btn"
              @click="collapseTree()"
              title="Close every node except the path to what is selected"
            >
              Collapse all
            </button>
          </div>
        </template>

        <template x-for="tenant in tenants" :key="tenant">
          <div class="tree-section">
            <div class="tree-item" data-testid="tree-tenant" :class="{active: sel.tenant===tenant && !sel.namespace}">
              <button
                type="button"
                class="tree-item-main"
                :aria-expanded="isTreeOpen(tenant)"
                :title="sel.tenant===tenant && !sel.namespace ? 'Click again to ' + (isTreeOpen(tenant) ? 'close' : 'open') : ''"
                @click="clickTreeTenant(tenant)"
              >
                <span class="icon" aria-hidden="true">🏠</span>
                <span class="label" x-text="tenant"></span>
              </button>
            </div>

            <template x-if="isTreeOpen(tenant)">
              <div>
                <template x-for="ns in treeNamespaces(tenant)" :key="ns">
                  <div class="tree-section">
                    <div
                      class="tree-item tree-indent1"
                      data-testid="tree-namespace"
                      :class="{active: sel.tenant===tenant && sel.namespace===ns && !sel.topic}"
                    >
                      <button
                        type="button"
                        class="tree-item-main"
                        :aria-expanded="isTreeOpen(tenant + '/' + ns)"
                        @click="clickTreeNamespace(tenant, ns)"
                      >
                        <span class="icon" aria-hidden="true">📁</span>
                        <span class="label" x-text="ns"></span>
                      </button>
                    </div>

                    <template x-if="isTreeOpen(tenant + '/' + ns)">
                      <div>
                        <template x-for="topic in treeTopics(tenant, ns)" :key="topic">
                          <div
                            class="tree-item tree-indent2"
                            data-testid="tree-topic"
                            :class="{active: sel.tenant===tenant && sel.namespace===ns && sel.topic===topic}"
                          >
                            <button type="button" class="tree-item-main" @click="clickTreeTopic(tenant, ns, topic)">
                              <span class="icon" aria-hidden="true">📨</span>
                              <span class="label" x-text="topic"></span>
                            </button>
                            <button
                              type="button"
                              class="del-btn"
                              @click="deleteTreeTopic(tenant, ns, topic)"
                              title="Delete topic"
                              :aria-label="'Delete topic ' + topic"
                            >
                              ✕
                            </button>
                          </div>
                        </template>

                        <div class="new-topic-inline tree-new-topic" x-show="sel.tenant===tenant && sel.namespace===ns">
                          <input
                            class="tree-new-topic-input"
                            aria-label="New topic name"
                            type="text"
                            x-model="newTopic"
                            placeholder="new topic…"
                            x-name-chars="pulsar"
                            title='Spaces and other characters a name cannot have become "-" as you type'
                            @keydown.enter="createTopic()"
                          />
                          <button
                            type="button"
                            class="btn btn-primary tree-new-topic-btn"
                            @click="createTopic()"
                            :disabled="!newTopic"
                          >
                            +
                          </button>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>

        <template x-if="!loading.tenants && tenants.length===0">
          <div class="empty"><p>No tenants available</p></div>
        </template>
      </div>
    </div>

    <!-- ══ Main ════════════════════════════════════════════════════════════════ -->
    <div id="main">
      <div id="topbar">
        <!-- Phones only: opens the sidebar drawer -->
        <button
          type="button"
          class="btn btn-ghost drawer-toggle"
          data-testid="drawer-open"
          aria-label="Topics"
          aria-controls="sidebar"
          :aria-expanded="drawerOpen"
          @click="drawerOpen = !drawerOpen"
        >
          ☰
        </button>

        <!-- Connection status pill -->
        <div
          class="conn-status"
          role="button"
          tabindex="0"
          @click="openSettings()"
          @keydown.enter.prevent="openSettings()"
          @keydown.space.prevent="openSettings()"
          :title="settings.pulsarUrl"
        >
          <div
            class="conn-dot"
            :class="{'ok': settings.healthState==='ok', 'error': settings.healthState==='error', 'checking': settings.healthState==='checking'}"
          ></div>
          <span class="conn-label" x-text="connLabel()"></span>
        </div>

        <!-- Auto-refresh: on/off per browser, interval shared by everyone (catapulsar_settings, audited) -->
        <div class="auto-refresh" @click.outside="auto.menuOpen = false" @keydown.escape="auto.menuOpen = false">
          <button
            type="button"
            class="btn btn-ghost auto-toggle"
            :class="{ on: auto.on }"
            :aria-pressed="auto.on"
            @click="toggleAutoRefresh()"
            :title="auto.on ? 'Auto-refresh on in this browser — click to turn off' : 'Auto-refresh off in this browser — click to turn on'"
          >
            <span class="auto-dot" aria-hidden="true"></span>
            <span class="auto-label" x-text="auto.on ? 'Auto ' + auto.seconds + ' s' : 'Auto off'"></span>
          </button>
          <button
            type="button"
            class="btn btn-ghost auto-menu-btn"
            :aria-expanded="auto.menuOpen"
            aria-haspopup="dialog"
            aria-label="Auto-refresh interval"
            @click="openRefreshMenu()"
          >
            ▾
          </button>
          <template x-if="auto.menuOpen">
            <form
              class="auto-menu"
              role="dialog"
              aria-label="Auto-refresh interval"
              @submit.prevent="saveRefreshInterval()"
            >
              <label for="refresh-seconds">Refresh every (seconds)</label>
              <input
                id="refresh-seconds"
                type="number"
                required
                :min="auto.min"
                :max="auto.max"
                step="1"
                x-model.number="auto.draft"
              />
              <p class="settings-hint">
                <span x-text="auto.min + '–' + auto.max + ' s · default ' + auto.defaultSeconds + ' s.'"></span>
                Applies to every user; saved in MongoDB and recorded in the audit log. The on/off switch only affects
                this browser.
              </p>
              <div class="auto-menu-actions">
                <button
                  type="button"
                  class="btn btn-ghost btn-xs"
                  x-show="auto.custom"
                  :disabled="auto.saving"
                  @click="saveRefreshInterval('DELETE')"
                >
                  Use default
                </button>
                <button type="submit" class="btn btn-primary btn-xs" :disabled="auto.saving">Save</button>
              </div>
            </form>
          </template>
        </div>

        <button type="button" class="btn btn-secondary topbar-refresh-btn" aria-label="Refresh" @click="reload()">
          ↺ Refresh
        </button>
        <button
          type="button"
          class="btn btn-ghost bridges-btn topbar-panel-btn"
          data-testid="bridges-open"
          :class="{'active': bridgesView}"
          @click="bridgesView ? closeBridges() : openBridges()"
          title="Cataponte Bridges"
        >
          <svg class="topbar-bridges-icon" viewBox="0 0 32 32" aria-hidden="true">
            <rect x="1" y="9" width="9" height="14" rx="2.5" fill="#4f46e5" />
            <rect x="10" y="14.5" width="12" height="3" rx="1.5" fill="#312e81" opacity=".7" />
            <circle cx="13" cy="16" r="1.5" fill="#a5b4fc" />
            <circle cx="16" cy="16" r="1.5" fill="#818cf8" />
            <circle cx="19" cy="16" r="1.5" fill="#6366f1" />
            <path
              d="M18.5 13.5 L22.5 16 L18.5 18.5"
              fill="none"
              stroke="#818cf8"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <rect x="22" y="9" width="9" height="14" rx="2.5" fill="#6366f1" />
          </svg>
          Bridges
        </button>
        <button
          type="button"
          class="btn btn-ghost bridges-btn topbar-panel-btn"
          :class="{'active': auditView}"
          @click="auditView ? closeAudit() : openAudit()"
          title="Audit trail (Cataudit)"
        >
          <span aria-hidden="true">🛡</span>
          Audit
        </button>
        <button
          type="button"
          class="btn btn-ghost bridges-btn topbar-panel-btn"
          :class="{'active': consumersView}"
          @click="consumersView ? (consumersView = false) : openConsumers()"
          title="The apps' consumers (pause, resume, check) and the dead-letter topics"
        >
          <span aria-hidden="true">⚙</span>
          Consumers
        </button>
        <button
          type="button"
          class="btn btn-ghost bridges-btn alerts-btn topbar-panel-btn"
          :class="{'active': alertsView}"
          @click="alertsView ? (alertsView = false) : openAlerts()"
          :title="alertBadgeTitle()"
        >
          <span aria-hidden="true">🔔</span>
          Alerts
          <span
            class="alert-badge"
            :class="alertBadgeClass()"
            x-show="alertBadgeText()"
            x-text="alertBadgeText()"
          ></span>
        </button>
        <button
          type="button"
          class="btn btn-ghost topbar-settings-btn"
          @click="openSettings()"
          title="Settings"
          aria-label="Settings"
        >
          ⚙️
        </button>
      </div>

      <!-- Where you are: on its own row, so it has the full width (G-20) -->
      <nav class="breadcrumb breadcrumb-bar" aria-label="Location">
        <button type="button" class="crumb" @click="showCluster()" :aria-current="!sel.tenant ? 'page' : null">
          Cluster
        </button>
        <template x-if="sel.tenant">
          <span class="crumb-part">
            <span class="crumb-sep" aria-hidden="true">›</span>
            <button
              type="button"
              class="crumb"
              @click="selectTenant(sel.tenant)"
              x-text="sel.tenant"
              :aria-current="!sel.namespace ? 'page' : null"
            ></button>
          </span>
        </template>
        <template x-if="sel.namespace">
          <span class="crumb-part">
            <span class="crumb-sep" aria-hidden="true">›</span>
            <button
              type="button"
              class="crumb"
              @click="selectNamespace(sel.namespace)"
              x-text="sel.namespace"
              :aria-current="!sel.topic ? 'page' : null"
            ></button>
          </span>
        </template>
        <template x-if="sel.topic">
          <span class="crumb-part">
            <span class="crumb-sep" aria-hidden="true">›</span>
            <span class="crumb current" x-text="sel.topic" aria-current="page"></span>
          </span>
        </template>
      </nav>

      <div id="content">
        <!-- ─ Alerts panel: open and archived alerts from Catavigia (ADR 0015) ─ -->
        <template x-if="alertsView">
          <div class="alerts-panel">
            <div class="bridges-header">
              <div>
                <div class="alerts-title">Alerts</div>
                <div class="muted alerts-subtitle">
                  What Catavigia sees on the platform. It only watches: each alert takes you to where it is fixed.
                </div>
                <button type="button" class="cataponte-url" @click="openSettings()" title="Change the Catavigia URL">
                  <span>Catavigia:</span>
                  <span class="mono" x-text="alerts.settings.url || '…'"></span>
                  <template x-if="alerts.settings.custom"><span class="tag tag-blue">custom</span></template>
                  <span aria-hidden="true">✎</span>
                </button>
              </div>
              <div class="alerts-head-actions">
                <button
                  type="button"
                  class="btn btn-ghost alerts-thresholds-btn"
                  @click="openSettings('alerts')"
                  title="Thresholds: backlog limit, check interval, debounce"
                >
                  ⚙ Thresholds
                </button>
                <button
                  type="button"
                  class="btn btn-ghost alerts-refresh-btn"
                  title="Refresh"
                  @click="alerts.tab === 'open' ? loadAlerts() : loadAlertArchive()"
                >
                  ↺
                </button>
              </div>
            </div>
            <div class="tabs" role="tablist" aria-label="Alerts sections">
              <button
                type="button"
                role="tab"
                class="tab"
                :class="{ active: alerts.tab === 'open' }"
                :aria-selected="alerts.tab === 'open'"
                @click="selectAlertsTab('open')"
              >
                Open
                <span class="tab-count" x-show="alertBadge.open > 0" x-text="alertBadge.open"></span>
              </button>
              <button
                type="button"
                role="tab"
                class="tab"
                :class="{ active: alerts.tab === 'archived' }"
                :aria-selected="alerts.tab === 'archived'"
                @click="selectAlertsTab('archived')"
              >
                Archived
              </button>
            </div>

            <!-- Open -->
            <template x-if="alerts.tab === 'open'">
              <div>
                <template x-if="alerts.loading"
                  ><div class="alerts-open-loading"><div class="spinner"></div></div
                ></template>
                <template x-if="!alerts.loading && alerts.error">
                  <div class="card empty">
                    <div class="big" aria-hidden="true">🔔</div>
                    <p class="alerts-open-error-title">Alerts unavailable</p>
                    <p class="muted alerts-open-error-text" x-text="alerts.error"></p>
                  </div>
                </template>
                <template x-if="!alerts.loading && !alerts.error && alerts.open.length === 0">
                  <div class="card empty">
                    <div class="big" aria-hidden="true">✓</div>
                    <p>No open alert.</p>
                  </div>
                </template>
                <template x-if="!alerts.loading && !alerts.error && alerts.open.length > 0">
                  <div>
                    <div class="alerts-toolbar">
                      <span
                        class="muted alerts-open-count"
                        x-text="alerts.open.length + ' open · ' + alerts.open.filter(a => !a.seenAt).length + ' not seen'"
                      ></span>
                      <button
                        type="button"
                        class="btn btn-ghost btn-xs"
                        :disabled="alerts.busy || !alerts.open.some(a => !a.seenAt && !a.local)"
                        @click="markAllAlertsSeen()"
                      >
                        Mark all seen
                      </button>
                    </div>
                    <div class="table-wrap">
                      <table class="card-table audit-table alerts-table">
                        <thead>
                          <tr>
                            <th>Severity</th>
                            <th>Alert</th>
                            <th>Subject</th>
                            <th>Open for</th>
                            <th>Last seen</th>
                            <th>Seen by</th>
                            <th></th>
                          </tr>
                        </thead>
                        <template x-for="a in alerts.open" :key="a.id">
                          <tbody>
                            <tr
                              class="audit-row"
                              :class="{ 'expanded': alerts.expanded === a.id, 'alert-unseen': !a.seenAt }"
                              tabindex="0"
                              :aria-expanded="alerts.expanded === a.id"
                              @click="toggleAlert(alerts, a.id)"
                              @keydown.enter.prevent="toggleAlert(alerts, a.id)"
                              @keydown.space.prevent="toggleAlert(alerts, a.id)"
                            >
                              <td data-label="Severity">
                                <span
                                  class="tag"
                                  :class="a.severity === 'critical' ? 'tag-failed' : 'tag-orange'"
                                  x-text="a.severity"
                                ></span>
                              </td>
                              <td data-label="Alert">
                                <span class="mono" x-text="a.type"></span>
                                <div class="muted alert-type-label" x-text="alertTypeLabel(a.type)"></div>
                              </td>
                              <td data-label="Subject" class="mono alert-subject" x-text="a.subject"></td>
                              <td
                                data-label="Open for"
                                :title="auditTime(a.openedAt)"
                                x-text="alertAge(a.openedAt)"
                              ></td>
                              <td
                                data-label="Last seen"
                                :title="auditTime(a.lastSeenAt)"
                                x-text="alertAge(a.lastSeenAt) + ' ago'"
                              ></td>
                              <td
                                data-label="Seen by"
                                class="mono"
                                x-text="a.seenBy || (a.local ? 'in memory' : '—')"
                              ></td>
                              <td class="cell-actions" @click.stop>
                                <button
                                  type="button"
                                  class="btn btn-ghost btn-xs"
                                  @click="runAlertAction(a)"
                                  x-text="alertActionLabel(a)"
                                ></button>
                                <template x-if="!a.seenAt && !a.local">
                                  <button
                                    type="button"
                                    class="btn btn-ghost btn-xs"
                                    :disabled="alerts.busy"
                                    @click="markAlertSeen(a)"
                                  >
                                    Mark seen
                                  </button>
                                </template>
                              </td>
                            </tr>
                            <tr x-show="alerts.expanded === a.id" class="audit-detail-row">
                              <td colspan="7">
                                <div class="audit-detail">
                                  <template x-if="auditPairs(a.details).length > 0">
                                    <table class="audit-kv">
                                      <thead>
                                        <tr>
                                          <th>Detail</th>
                                          <th>Value</th>
                                        </tr>
                                      </thead>
                                      <tbody>
                                        <template x-for="[k, v] in auditPairs(a.details)" :key="k">
                                          <tr>
                                            <td class="mono" x-text="k"></td>
                                            <td class="payload" x-text="v"></td>
                                          </tr>
                                        </template>
                                      </tbody>
                                    </table>
                                  </template>
                                  <div class="muted audit-meta">
                                    <span>Opened <span x-text="auditTime(a.openedAt)"></span></span>
                                    <template x-if="a.seenAt"
                                      ><span>Seen <span x-text="auditTime(a.seenAt)"></span></span
                                    ></template>
                                    <template x-if="a.local"
                                      ><span
                                        >Kept in memory by this Catavigia replica until MongoDB answers</span
                                      ></template
                                    >
                                    <span>Id <span class="mono" x-text="a.id"></span></span>
                                  </div>
                                </div>
                              </td>
                            </tr>
                          </tbody>
                        </template>
                      </table>
                    </div>
                  </div>
                </template>
              </div>
            </template>

            <!-- Archived -->
            <template x-if="alerts.tab === 'archived'">
              <div>
                <form class="audit-filters card" @submit.prevent="applyAlertFilters()">
                  <div class="field">
                    <label for="alerts-type">Type</label>
                    <select id="alerts-type" x-model="alerts.archive.filters.type" @change="applyAlertFilters()">
                      <option value="">All</option>
                      <template x-for="t in alertTypes()" :key="t"><option :value="t" x-text="t"></option></template>
                    </select>
                  </div>
                  <div class="field audit-filter-wide">
                    <label for="alerts-subject">Subject starts with</label>
                    <input
                      id="alerts-subject"
                      type="text"
                      x-model="alerts.archive.filters.subject"
                      placeholder="persistent://tenant/namespace/ · bridge name · app"
                    />
                  </div>
                  <div class="field">
                    <label for="alerts-period">Closed in</label>
                    <select id="alerts-period" x-model="alerts.archive.filters.period" @change="applyAlertFilters()">
                      <option value="24h">Last 24 hours</option>
                      <option value="7d">Last 7 days</option>
                      <option value="30d">Last 30 days</option>
                      <option value="all">Everything</option>
                    </select>
                  </div>
                  <div class="audit-filter-actions">
                    <button type="submit" class="btn btn-primary alerts-archive-search-btn">Search</button>
                    <button type="button" class="btn btn-ghost alerts-archive-clear-btn" @click="clearAlertFilters()">
                      Clear
                    </button>
                  </div>
                </form>
                <template x-if="alerts.archive.loading"
                  ><div class="alerts-archive-loading"><div class="spinner"></div></div
                ></template>
                <template x-if="!alerts.archive.loading && alerts.archive.error">
                  <div class="card empty">
                    <p class="alerts-archive-error" x-text="'Archive unavailable: ' + alerts.archive.error"></p>
                  </div>
                </template>
                <template x-if="!alerts.archive.loading && !alerts.archive.error && alerts.archive.items.length === 0">
                  <div class="card empty"><p>No closed alert for these filters.</p></div>
                </template>
                <template x-if="!alerts.archive.loading && !alerts.archive.error && alerts.archive.items.length > 0">
                  <div>
                    <div class="table-wrap">
                      <table class="card-table audit-table alerts-table">
                        <thead>
                          <tr>
                            <th>Severity</th>
                            <th>Alert</th>
                            <th>Subject</th>
                            <th>Closed</th>
                            <th>Was open</th>
                            <th>Seen by</th>
                          </tr>
                        </thead>
                        <template x-for="a in alerts.archive.items" :key="a.id">
                          <tbody>
                            <tr
                              class="audit-row"
                              :class="{ 'expanded': alerts.archive.expanded === a.id }"
                              tabindex="0"
                              :aria-expanded="alerts.archive.expanded === a.id"
                              @click="toggleAlert(alerts.archive, a.id)"
                              @keydown.enter.prevent="toggleAlert(alerts.archive, a.id)"
                              @keydown.space.prevent="toggleAlert(alerts.archive, a.id)"
                            >
                              <td data-label="Severity">
                                <span
                                  class="tag"
                                  :class="a.severity === 'critical' ? 'tag-failed' : 'tag-orange'"
                                  x-text="a.severity"
                                ></span>
                              </td>
                              <td data-label="Alert"><span class="mono" x-text="a.type"></span></td>
                              <td data-label="Subject" class="mono alert-subject" x-text="a.subject"></td>
                              <td data-label="Closed" class="muted audit-when" x-text="auditTime(a.closedAt)"></td>
                              <td data-label="Was open" x-text="alertDuration(a.durationSeconds)"></td>
                              <td data-label="Seen by" class="mono" x-text="a.seenBy || '—'"></td>
                            </tr>
                            <tr x-show="alerts.archive.expanded === a.id" class="audit-detail-row">
                              <td colspan="6">
                                <div class="audit-detail">
                                  <template x-if="auditPairs(a.details).length > 0">
                                    <table class="audit-kv">
                                      <thead>
                                        <tr>
                                          <th>Detail (last seen)</th>
                                          <th>Value</th>
                                        </tr>
                                      </thead>
                                      <tbody>
                                        <template x-for="[k, v] in auditPairs(a.details)" :key="k">
                                          <tr>
                                            <td class="mono" x-text="k"></td>
                                            <td class="payload" x-text="v"></td>
                                          </tr>
                                        </template>
                                      </tbody>
                                    </table>
                                  </template>
                                  <div class="muted audit-meta">
                                    <span>Opened <span x-text="auditTime(a.openedAt)"></span></span>
                                    <span>Last seen <span x-text="auditTime(a.lastSeenAt)"></span></span>
                                    <template x-if="a.seenAt"
                                      ><span>Seen <span x-text="auditTime(a.seenAt)"></span></span
                                    ></template>
                                    <span>Id <span class="mono" x-text="a.id"></span></span>
                                  </div>
                                </div>
                              </td>
                            </tr>
                          </tbody>
                        </template>
                      </table>
                    </div>
                    <div class="audit-pager">
                      <button
                        type="button"
                        class="btn btn-ghost alerts-archive-prev-btn"
                        :disabled="alerts.archive.page === 0"
                        @click="alertArchiveGo(-1)"
                      >
                        ← Newer
                      </button>
                      <span
                        class="muted"
                        x-text="'Page ' + (alerts.archive.page + 1) + ' of ' + alertArchivePages() + ' · ' + alerts.archive.total + ' closed'"
                      ></span>
                      <button
                        type="button"
                        class="btn btn-ghost alerts-archive-next-btn"
                        :disabled="alerts.archive.page + 1 >= alertArchivePages()"
                        @click="alertArchiveGo(1)"
                      >
                        Older →
                      </button>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>

        <!-- ─ Consumers panel: the apps' consumers and the dead-letter topics (ADR 0015) ─ -->
        <template x-if="consumersView">
          <div class="consumers-panel">
            <div class="bridges-header">
              <div>
                <div class="consumers-title">Consumers &amp; dead letters</div>
                <div class="muted consumers-subtitle">
                  The apps' own consumers, per replica, read from Pulsar (it works while MongoDB is down). Every action
                  is audited.
                </div>
              </div>
              <button
                type="button"
                class="btn btn-ghost consumers-refresh-btn"
                title="Refresh"
                @click="loadConsumers(); loadDeadLetters()"
              >
                ↺
              </button>
            </div>
            <div class="tabs" role="tablist" aria-label="Consumers sections">
              <button
                type="button"
                role="tab"
                class="tab"
                :class="{ active: cons.tab === 'consumers' }"
                :aria-selected="cons.tab === 'consumers'"
                @click="cons.tab = 'consumers'"
              >
                Consumers
              </button>
              <button
                type="button"
                role="tab"
                class="tab"
                :class="{ active: cons.tab === 'deadletters' }"
                :aria-selected="cons.tab === 'deadletters'"
                @click="cons.tab = 'deadletters'; loadDeadLetters()"
              >
                Dead letters
                <span
                  class="tab-count"
                  x-show="cons.dlqs.some(d => d.backlog > 0)"
                  x-text="cons.dlqs.reduce((n, d) => n + (d.backlog || 0), 0)"
                ></span>
              </button>
            </div>

            <!-- Consumers -->
            <template x-if="cons.tab === 'consumers'">
              <div>
                <template x-if="cons.loading"
                  ><div class="consumers-loading"><div class="spinner"></div></div
                ></template>
                <template x-if="!cons.loading && cons.error">
                  <div class="card empty">
                    <p class="consumers-error" x-text="'Consumers unavailable: ' + cons.error"></p>
                  </div>
                </template>
                <template x-if="!cons.loading && !cons.error && consumerGroups().length === 0">
                  <div class="card empty">
                    <p>No consumer has reported yet. Cataudit and Catametricas publish their state every 10 s.</p>
                  </div>
                </template>
                <template x-for="g in consumerGroups()" :key="g.key">
                  <div class="card consumer-card">
                    <div class="consumer-head">
                      <div>
                        <div class="consumer-title">
                          <span x-text="g.app"></span> · <span class="mono" x-text="g.consumer"></span>
                        </div>
                        <div class="muted consumer-sub">
                          <span class="mono" x-text="g.topic"></span> · sub
                          <span class="mono" x-text="g.subscription"></span>
                          <template x-if="g.deadLetterTopic">
                            <span> · DLQ after <span x-text="g.maxDeliveries"></span> deliveries</span>
                          </template>
                        </div>
                      </div>
                      <div class="consumer-actions">
                        <button
                          type="button"
                          class="btn btn-ghost btn-xs"
                          :disabled="cons.busy"
                          @click="consumerCommand(g.app, '*', g.consumer, 'check')"
                          title="Every replica pings MongoDB and Pulsar now"
                        >
                          Check all
                        </button>
                        <button
                          type="button"
                          class="btn btn-ghost btn-xs"
                          :disabled="cons.busy"
                          @click="consumerCommand(g.app, '*', g.consumer, 'resume')"
                        >
                          Resume all
                        </button>
                        <button
                          type="button"
                          class="btn btn-danger btn-xs"
                          :disabled="cons.busy"
                          @click="consumerCommand(g.app, '*', g.consumer, 'pause')"
                        >
                          Pause all
                        </button>
                      </div>
                    </div>
                    <div class="table-wrap">
                      <table class="card-table consumers-table">
                        <thead>
                          <tr>
                            <th>Replica</th>
                            <th>State</th>
                            <th>Since</th>
                            <th>MongoDB</th>
                            <th>Pulsar</th>
                            <th>Checked</th>
                            <th></th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="r in g.replicas" :key="r.instance">
                            <tr :class="{ 'consumer-stale': r.stale }">
                              <td data-label="Replica" class="mono" x-text="r.instance"></td>
                              <td data-label="State">
                                <span
                                  class="tag"
                                  :class="{ 'tag-blue': r.state === 'RUNNING', 'tag-failed': r.state === 'PAUSED_AUTO', 'tag-orange': r.state === 'PAUSED_MANUAL' }"
                                  :title="(r.reason || '') + (r.changedBy ? ' (by ' + r.changedBy + ')' : '')"
                                  x-text="r.stale ? 'gone' : consumerStateLabel(r.state)"
                                ></span>
                                <template x-if="r.state === 'PAUSED_AUTO' && r.reason"
                                  ><div class="muted consumer-reason" x-text="r.reason"></div
                                ></template>
                                <template x-if="r.state === 'PAUSED_MANUAL' && r.changedBy"
                                  ><div class="muted consumer-reason" x-text="'by ' + r.changedBy"></div
                                ></template>
                              </td>
                              <td data-label="Since" x-text="fmtDate(r.since)"></td>
                              <td data-label="MongoDB" class="mono" x-text="probeLabel(r.lastCheck, 'mongodb')"></td>
                              <td data-label="Pulsar" class="mono" x-text="probeLabel(r.lastCheck, 'pulsar')"></td>
                              <td
                                data-label="Checked"
                                x-text="r.lastCheck ? fmtDate(r.lastCheck.checkedAt) : 'never'"
                              ></td>
                              <td class="cell-actions">
                                <button
                                  type="button"
                                  class="btn btn-ghost btn-xs"
                                  :disabled="cons.busy || r.stale"
                                  @click="consumerCommand(r.app, r.instance, r.consumer, 'check')"
                                >
                                  Check
                                </button>
                                <template x-if="r.state === 'PAUSED_AUTO' || r.state === 'PAUSED_MANUAL'">
                                  <button
                                    type="button"
                                    class="btn btn-ghost btn-xs"
                                    :disabled="cons.busy || r.stale"
                                    @click="consumerCommand(r.app, r.instance, r.consumer, 'resume')"
                                  >
                                    Resume
                                  </button>
                                </template>
                                <template x-if="r.state !== 'PAUSED_MANUAL'">
                                  <button
                                    type="button"
                                    class="btn btn-danger btn-xs"
                                    :disabled="cons.busy || r.stale"
                                    @click="consumerCommand(r.app, r.instance, r.consumer, 'pause')"
                                  >
                                    Pause
                                  </button>
                                </template>
                              </td>
