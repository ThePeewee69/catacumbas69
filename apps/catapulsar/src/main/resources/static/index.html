<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catapulsar</title>
<link rel="icon" type="image/svg+xml" href="/catapulsar-icon.svg">
<link rel="stylesheet" href="/catapulsar.css?v=13">
<script src="/catapulsar.js?v=13" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.8/cdn.min.js" defer></script>
</head>
<body x-data="app()" x-init="init()">

<!-- ══ Settings overlay ════════════════════════════════════════════════════ -->
<template x-if="settings.open">
  <div class="overlay" @click.self="settings.open=false">
    <div class="settings-box">
      <div class="settings-title">
        ⚙️ Connection Settings
        <button class="close-btn" @click="settings.open=false">✕</button>
      </div>

      <div class="field" style="margin-bottom:12px;">
        <label>Pulsar Admin URL</label>
        <input type="text" x-model="settings.pulsarUrl"
               placeholder="http://192.168.86.35:31080"
               @keydown.enter="saveSettings()">
      </div>

      <div class="health-row">
        <button class="btn btn-ghost" style="font-size:12px;padding:6px 12px;" @click="checkHealth()">
          <template x-if="settings.healthState==='checking'"><span class="spinner" style="width:12px;height:12px;"></span></template>
          <template x-if="settings.healthState!=='checking'"><span>🩺</span></template>
          Health Check
        </button>
        <template x-if="settings.healthState==='ok'">
          <span class="health-msg ok">✓ <span x-text="settings.healthMsg"></span></span>
        </template>
        <template x-if="settings.healthState==='error'">
          <span class="health-msg error">✕ <span x-text="settings.healthMsg"></span></span>
        </template>
      </div>

      <p class="settings-hint">Shown in the top bar of this browser; the server connects to <span class="mono">PULSAR_SERVICE_URL</span>.</p>

      <div class="divider"></div>

      <div class="field" style="margin-bottom:6px;">
        <label for="cataponte-url">Cataponte URL</label>
        <input id="cataponte-url" type="url" x-model.trim="bridges.settings.draft"
               placeholder="http://cataponte:8082" autocomplete="off" @keydown.enter="saveSettings()">
      </div>
      <p class="settings-hint">
        Default (<span class="mono">CATAPONTE_URL</span>): <span class="mono" x-text="bridges.settings.defaultUrl"></span>
        <template x-if="bridges.settings.custom">
          <button type="button" class="link-btn" :disabled="bridges.settings.saving"
                  @click="resetCataponteUrl()">use default</button>
        </template>
        <br>Applies to every user immediately, is saved in MongoDB and recorded in the audit log.
      </p>
      <div class="health-row">
        <button class="btn btn-ghost" style="font-size:12px;padding:6px 12px;" @click="checkCataponte()">
          <template x-if="bridges.settings.healthState==='checking'"><span class="spinner" style="width:12px;height:12px;"></span></template>
          <template x-if="bridges.settings.healthState!=='checking'"><span>🩺</span></template>
          Check Cataponte
        </button>
        <template x-if="bridges.settings.healthState==='ok'">
          <span class="health-msg ok">✓ <span x-text="bridges.settings.healthMsg"></span></span>
        </template>
        <template x-if="bridges.settings.healthState==='error'">
          <span class="health-msg error">✕ <span x-text="bridges.settings.healthMsg"></span></span>
        </template>
      </div>

      <div class="divider"></div>

      <div class="field" style="margin-bottom:6px;">
        <label for="collect-seconds">Catametricas collection interval (seconds)</label>
        <input id="collect-seconds" type="number" step="1" :min="collect.min" :max="collect.max"
               x-model.number="collect.draft" @keydown.enter="saveSettings()">
      </div>
      <p class="settings-hint">
        <span x-text="collect.min + '–' + collect.max + ' s · default ' + collect.defaultSeconds + ' s'"></span>
        <template x-if="collect.custom">
          <button type="button" class="link-btn" @click="saveCollectInterval('DELETE')">use default</button>
        </template>
        <br>How often Catametricas reads every topic's statistics into MongoDB. Applies from its next collection;
        saved in MongoDB and recorded in the audit log.
      </p>

      <div class="divider"></div>

      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn btn-secondary" @click="settings.open=false">Cancel</button>
        <button class="btn btn-primary" :disabled="bridges.settings.saving" @click="saveSettings()">Save</button>
      </div>
    </div>
  </div>
</template>

<!-- ══ Message view/edit modal ════════════════════════════════════════════ -->
<template x-if="modal.type">
  <div class="modal" @click.self="closeModal()">
    <div class="modal-box">
      <div class="modal-header">
        <h3 x-text="modal.type==='view' ? '🔍 Message details' : '✏️ Re-produce message'"></h3>
        <button class="close-btn" @click="closeModal()">✕</button>
      </div>

      <div class="modal-body">
        <!-- Metadata -->
        <div class="meta-row"><span class="meta-key">Message ID</span><span class="meta-val" x-text="modal.message?.messageId"></span></div>
        <div class="meta-row"><span class="meta-key">Published</span><span class="meta-val" x-text="fmtDate(modal.message?.publishTime)"></span></div>
        <template x-if="modal.message?.key">
          <div class="meta-row"><span class="meta-key">Key</span><span class="meta-val" x-text="modal.message.key"></span></div>
        </template>

        <!-- View mode -->
        <template x-if="modal.type==='view'">
          <div class="payload-view" x-text="prettyJson(modal.message?.payload)"></div>
        </template>

        <!-- Edit mode -->
        <template x-if="modal.type==='edit'">
          <div>
            <div class="warn-note">
              ⚠ Pulsar messages are immutable. This re-produces a new message with your changes.
              The original message remains in the backlog — use <strong>Skip</strong> to remove it after re-producing.
            </div>
            <div class="field" style="margin-bottom:10px;">
              <label>Message Key</label>
              <input type="text" x-model="modal.editKey" placeholder="optional key">
            </div>
            <div class="field">
              <label>Payload</label>
              <textarea x-model="modal.editPayload" rows="8"></textarea>
            </div>
          </div>
        </template>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" @click="closeModal()">Close</button>
        <template x-if="modal.type==='edit'">
          <button class="btn btn-primary" @click="saveEdit()" :disabled="!modal.editPayload || modal.saving">
            <template x-if="modal.saving"><span class="spinner"></span></template>
            Re-produce
          </button>
        </template>
      </div>
    </div>
  </div>
</template>

<!-- ══ Bridge form modal ══════════════════════════════════════════════════ -->
<template x-if="bridges.form !== null">
  <div class="overlay" @click.self="closeBridgeForm()">
    <div class="bridge-form-box">
      <div class="settings-title">
        <span x-text="bridges.form && bridges.form.id ? '✏️ Edit Bridge' : '⇌ New Bridge'"></span>
        <button class="close-btn" @click="closeBridgeForm()">✕</button>
      </div>

      <div class="form-row">
        <div class="field">
          <label>Name *</label>
          <input type="text" x-model="bridges.form.name" placeholder="e.g. orders-to-dlq"
                 @keydown.enter="saveBridge()">
        </div>
        <div class="field">
          <label>Description</label>
          <input type="text" x-model="bridges.form.description" placeholder="Optional">
        </div>
      </div>

      <div class="form-section-label">⬅ Source</div>
      <div class="field" style="margin-bottom:12px;">
        <label>Topic *</label>
        <div class="topic-picker-selected" :class="{empty: !bridges.form.source.topic}"
             x-text="bridges.form.source.topic || 'no topic selected'"></div>
        <input type="text" x-model="bridges.srcFilter" placeholder="filter topics…" class="topic-picker-filter">
        <div class="sub-picker topic-picker">
          <template x-if="bridges.topicsLoading">
            <div class="sub-picker-empty"><span class="spinner" style="width:12px;height:12px;"></span> loading topics…</div>
          </template>
          <template x-if="!bridges.topicsLoading && filteredTopics(bridges.srcFilter, bridges.form.destinations.map(d => d.topic)).length === 0">
            <div class="sub-picker-empty">no topics found</div>
          </template>
          <template x-for="t in filteredTopics(bridges.srcFilter, bridges.form.destinations.map(d => d.topic))" :key="t">
            <div class="sub-picker-item" :class="{ selected: bridges.form.source.topic === t }"
                 @click="bridges.form.source.topic = t" :title="t" x-text="t"></div>
          </template>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Subscription name *</label>
          <input type="text" x-model="bridges.form.source.subscription" placeholder="cataponte-bridge">
        </div>
        <div class="field" style="max-width:150px;">
          <label>Type</label>
          <select x-model="bridges.form.source.subscriptionType">
            <option value="Shared">Shared</option>
            <option value="Exclusive">Exclusive</option>
            <option value="Failover">Failover</option>
            <option value="Key_Shared">Key_Shared</option>
          </select>
        </div>
      </div>

      <div class="form-section-label">➡ Destination</div>
      <div class="field" style="margin-bottom:14px;">
        <label>Topics * <span style="text-transform:none;letter-spacing:0;font-weight:400;"
               x-text="'(' + bridges.form.destinations.length + ' selected)'"></span></label>
        <div class="topic-chips" :class="{empty: bridges.form.destinations.length === 0}">
          <template x-if="bridges.form.destinations.length === 0">
            <span>no topic selected — choose one or more</span>
          </template>
          <template x-for="d in bridges.form.destinations" :key="d.topic">
            <span class="topic-chip" :title="d.topic">
              <span class="topic-chip-name" x-text="d.topic"></span>
              <button type="button" class="topic-chip-x" @click="toggleDestination(d.topic)" title="Remove" aria-label="Remove destination">✕</button>
            </span>
          </template>
        </div>
        <input type="text" x-model="bridges.dstFilter" placeholder="filter topics…" class="topic-picker-filter">
        <div class="sub-picker topic-picker">
          <template x-if="bridges.topicsLoading">
            <div class="sub-picker-empty"><span class="spinner" style="width:12px;height:12px;"></span> loading topics…</div>
          </template>
          <template x-if="!bridges.topicsLoading && filteredTopics(bridges.dstFilter, bridges.form.source.topic).length === 0">
            <div class="sub-picker-empty">no topics found</div>
          </template>
          <template x-for="t in filteredTopics(bridges.dstFilter, bridges.form.source.topic)" :key="t">
            <div class="sub-picker-item topic-multi-item" :class="{ selected: isDestSelected(t) }"
                 @click="toggleDestination(t)" :title="t">
              <span class="topic-check" x-text="isDestSelected(t) ? '✓' : ''"></span>
              <span class="topic-multi-name" x-text="t"></span>
            </div>
          </template>
        </div>
      </div>

      <div class="form-section-label">Options</div>
      <div style="display:flex;gap:20px;margin-bottom:18px;flex-wrap:wrap;">
        <label class="checkbox-label">
          <input type="checkbox" x-model="bridges.form.preserveKey"> Preserve message key
        </label>
        <label class="checkbox-label">
          <input type="checkbox" x-model="bridges.form.preserveProperties"> Preserve properties
        </label>
        <label class="checkbox-label">
          <input type="checkbox" x-model="bridges.form.enabled"> Enabled on save
        </label>
        <label class="checkbox-label" title="Keep source order on every destination (needs Exclusive, Failover or Key_Shared)">
          <input type="checkbox" x-model="bridges.form.ordered" @change="onOrderedChange()"> Keep message order
        </label>
      </div>
      <div class="warn-note" x-show="orderedOnShared()">
        Ordered bridges need an Exclusive, Failover or Key_Shared subscription — a Shared subscription cannot keep order.
      </div>

      <div class="divider"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn btn-secondary" @click="closeBridgeForm()">Cancel</button>
        <button class="btn btn-primary" @click="saveBridge()"
                :disabled="!bridgeFormValid() || bridges.formSaving">
          <template x-if="bridges.formSaving"><span class="spinner"></span></template>
          Save Bridge
        </button>
      </div>
    </div>
  </div>
</template>

<!-- ══ Sidebar ══════════════════════════════════════════════════════════════ -->
<div id="sidebar">
  <div id="sidebar-header">
    <h1>
      <button type="button" class="brand" @click="showCluster()" title="Cluster overview">
        <img src="/catapulsar-icon.svg" alt="" style="width:24px;height:24px;border-radius:5px;">
        Catapulsar
      </button>
    </h1>
  </div>

  <div id="sidebar-tree">
    <template x-if="loading.tenants">
      <div style="padding:24px;text-align:center;color:var(--muted)"><div class="spinner"></div></div>
    </template>

    <template x-for="tenant in tenants" :key="tenant">
      <div class="tree-section">
        <div class="tree-item" :class="{active: sel.tenant===tenant && !sel.namespace}"
             @click="selectTenant(tenant)">
          <span class="icon">🏠</span>
          <span class="label" x-text="tenant"></span>
        </div>

        <template x-if="sel.tenant===tenant">
          <div>
            <template x-for="ns in namespaces" :key="ns">
              <div class="tree-section">
                <div class="tree-item tree-indent1"
                     :class="{active: sel.namespace===ns && !sel.topic}"
                     @click="selectNamespace(ns)">
                  <span class="icon">📁</span>
                  <span class="label" x-text="ns"></span>
                </div>

                <template x-if="sel.namespace===ns">
                  <div>
                    <template x-for="topic in topics" :key="topic">
                      <div class="tree-item tree-indent2"
                           :class="{active: sel.topic===topic}"
                           @click="selectTopic(topic)">
                        <span class="icon">📨</span>
                        <span class="label" x-text="topic"></span>
                        <button class="del-btn" @click.stop="deleteTopic(topic)" title="Delete topic">✕</button>
                      </div>
                    </template>

                    <div class="new-topic-inline" style="padding:4px 10px 4px 44px;">
                      <input type="text" x-model="newTopic" placeholder="new topic…"
                             @keydown.enter="createTopic()"
                             style="font-size:12px;padding:5px 8px;">
                      <button class="btn btn-primary" style="padding:5px 10px;font-size:12px;"
                              @click="createTopic()" :disabled="!newTopic">+</button>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>

    <template x-if="!loading.tenants && tenants.length===0">
      <div class="empty"><p>No tenants available</p></div>
    </template>
  </div>
</div>

<!-- ══ Main ════════════════════════════════════════════════════════════════ -->
<div id="main">
  <div id="topbar">
    <nav class="breadcrumb" aria-label="Location">
      <button type="button" class="crumb" @click="showCluster()" :aria-current="!sel.tenant ? 'page' : null">Cluster</button>
      <template x-if="sel.tenant">
        <span class="crumb-part">
          <span class="crumb-sep" aria-hidden="true">›</span>
          <button type="button" class="crumb" @click="selectTenant(sel.tenant)" x-text="sel.tenant"
                  :aria-current="!sel.namespace ? 'page' : null"></button>
        </span>
      </template>
      <template x-if="sel.namespace">
        <span class="crumb-part">
          <span class="crumb-sep" aria-hidden="true">›</span>
          <button type="button" class="crumb" @click="selectNamespace(sel.namespace)" x-text="sel.namespace"
                  :aria-current="!sel.topic ? 'page' : null"></button>
        </span>
      </template>
      <template x-if="sel.topic">
        <span class="crumb-part">
          <span class="crumb-sep" aria-hidden="true">›</span>
          <span class="crumb current" x-text="sel.topic" aria-current="page"></span>
        </span>
      </template>
    </nav>

    <!-- Connection status pill -->
    <div class="conn-status" @click="openSettings()" :title="settings.pulsarUrl">
      <div class="conn-dot" :class="{'ok': settings.healthState==='ok', 'error': settings.healthState==='error', 'checking': settings.healthState==='checking'}"></div>
      <span x-text="connLabel()"></span>
    </div>

    <!-- Auto-refresh: on/off per browser, interval shared by everyone (pulsario_settings, audited) -->
    <div class="auto-refresh" @click.outside="auto.menuOpen = false" @keydown.escape="auto.menuOpen = false">
      <button type="button" class="btn btn-ghost auto-toggle" :class="{ on: auto.on }" :aria-pressed="auto.on"
              @click="toggleAutoRefresh()"
              :title="auto.on ? 'Auto-refresh on in this browser — click to turn off' : 'Auto-refresh off in this browser — click to turn on'">
        <span class="auto-dot" aria-hidden="true"></span>
        <span x-text="auto.on ? 'Auto ' + auto.seconds + ' s' : 'Auto off'"></span>
      </button>
      <button type="button" class="btn btn-ghost auto-menu-btn" :aria-expanded="auto.menuOpen"
              aria-haspopup="dialog" aria-label="Auto-refresh interval" @click="openRefreshMenu()">▾</button>
      <template x-if="auto.menuOpen">
        <form class="auto-menu" role="dialog" aria-label="Auto-refresh interval" @submit.prevent="saveRefreshInterval()">
          <label for="refresh-seconds">Refresh every (seconds)</label>
          <input id="refresh-seconds" type="number" required :min="auto.min" :max="auto.max" step="1"
                 x-model.number="auto.draft">
          <p class="settings-hint">
            <span x-text="auto.min + '–' + auto.max + ' s · default ' + auto.defaultSeconds + ' s.'"></span>
            Applies to every user; saved in MongoDB and recorded in the audit log.
            The on/off switch only affects this browser.
          </p>
          <div class="auto-menu-actions">
            <button type="button" class="btn btn-ghost btn-xs" x-show="auto.custom" :disabled="auto.saving"
                    @click="saveRefreshInterval('DELETE')">Use default</button>
            <button type="submit" class="btn btn-primary btn-xs" :disabled="auto.saving">Save</button>
          </div>
        </form>
      </template>
    </div>

    <button class="btn btn-secondary" style="font-size:12px;" @click="reload()">↺ Refresh</button>
    <button class="btn btn-ghost bridges-btn" :class="{'active': bridgesView}"
            @click="bridgesView ? closeBridges() : openBridges()" title="Cataponte Bridges">
      <svg viewBox="0 0 32 32" style="width:14px;height:14px;flex-shrink:0;">
        <rect x="1" y="9" width="9" height="14" rx="2.5" fill="#4f46e5"/>
        <rect x="10" y="14.5" width="12" height="3" rx="1.5" fill="#312e81" opacity=".7"/>
        <circle cx="13" cy="16" r="1.5" fill="#a5b4fc"/>
        <circle cx="16" cy="16" r="1.5" fill="#818cf8"/>
        <circle cx="19" cy="16" r="1.5" fill="#6366f1"/>
        <path d="M18.5 13.5 L22.5 16 L18.5 18.5" fill="none" stroke="#818cf8" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="22" y="9" width="9" height="14" rx="2.5" fill="#6366f1"/>
      </svg>
      Bridges
    </button>
    <button class="btn btn-ghost" style="font-size:13px;padding:7px 10px;" @click="openSettings()" title="Settings">⚙️</button>
  </div>

  <div id="content">

    <!-- ─ Bridges panel ─ -->
    <template x-if="bridgesView">
      <div class="bridges-panel">

        <!-- Header -->
        <div class="bridges-header">
          <div style="display:flex;align-items:center;gap:12px;">
            <svg viewBox="0 0 32 32" style="width:32px;height:32px;flex-shrink:0;">
              <rect x="1" y="9" width="9" height="14" rx="2.5" fill="#4f46e5"/>
              <rect x="3" y="12" width="5" height="1.5" rx=".75" fill="#c7d2fe" opacity=".9"/>
              <rect x="3" y="15" width="5" height="1.5" rx=".75" fill="#c7d2fe" opacity=".6"/>
              <rect x="3" y="18" width="3" height="1.5" rx=".75" fill="#c7d2fe" opacity=".35"/>
              <rect x="10" y="14.5" width="12" height="3" rx="1.5" fill="#312e81" opacity=".6"/>
              <circle cx="12.5" cy="16" r="1.6" fill="#a5b4fc"/>
              <circle cx="16"   cy="16" r="1.6" fill="#818cf8"/>
              <circle cx="19.5" cy="16" r="1.6" fill="#6366f1"/>
              <path d="M19 13.2 L23.5 16 L19 18.8" fill="none" stroke="#818cf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="22" y="9" width="9" height="14" rx="2.5" fill="#6366f1"/>
              <rect x="24" y="12" width="5" height="1.5" rx=".75" fill="#e0e7ff" opacity=".9"/>
              <rect x="24" y="15" width="5" height="1.5" rx=".75" fill="#e0e7ff" opacity=".6"/>
              <rect x="24" y="18" width="3.5" height="1.5" rx=".75" fill="#e0e7ff" opacity=".35"/>
            </svg>
            <div>
              <div style="font-size:16px;font-weight:700;color:var(--accent2);">Cataponte Bridges</div>
              <button class="cataponte-url" @click="openSettings()" title="Change the Cataponte URL">
                <span>Cataponte:</span>
                <span class="mono" x-text="bridges.settings.url || '…'"></span>
                <template x-if="bridges.settings.custom"><span class="tag tag-blue">custom</span></template>
                <span aria-hidden="true">✎</span>
              </button>
            </div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            <span style="font-size:12px;color:var(--muted);" x-show="runningBridges() > 0">
              <span class="bridge-status-dot running" style="display:inline-block;"></span>
              <span x-text="runningBridges() + ' running'"></span>
            </span>
            <button class="btn btn-ghost" style="font-size:12px;"
                    @click="loadBridges();loadBridgeStatus()" title="Refresh">↺</button>
            <button class="btn btn-primary" style="font-size:12px;" @click="openNewBridge()">+ New Bridge</button>
          </div>
        </div>

        <!-- Loading -->
        <template x-if="bridges.loading">
          <div style="text-align:center;padding:60px"><div class="spinner"></div></div>
        </template>

        <!-- Bridge list -->
        <template x-if="!bridges.loading">
          <div>
            <!-- Empty state -->
            <template x-if="bridges.list.length === 0">
              <div class="card empty" style="margin-top:24px;">
                <div style="font-size:48px;margin-bottom:12px;">⇌</div>
                <p style="font-weight:600;color:var(--accent2);">No bridges yet</p>
                <p style="font-size:13px;margin-top:6px;">Create one to relay messages between Pulsar topics.</p>
                <button class="btn btn-primary" style="margin-top:16px;" @click="openNewBridge()">+ New Bridge</button>
              </div>
            </template>

            <!-- Bridge cards -->
            <template x-for="bridge in bridges.list" :key="bridge.id">
              <div class="bridge-card" :class="{'bridge-disabled': !bridge.enabled}">
                <div class="bridge-card-header">
                  <div class="bridge-status-dot"
                       :class="{'running': bridge.enabled && bridges.status[bridge.id]?.running,
                                'disabled': !bridge.enabled}">
                  </div>
                  <div class="bridge-card-title">
                    <span class="bridge-name" x-text="bridge.name"></span>
                    <template x-if="bridge.description">
                      <span class="bridge-description" x-text="bridge.description"></span>
                    </template>
                  </div>
                  <div class="bridge-card-actions">
                    <button class="btn btn-ghost bridge-toggle-btn"
                            :class="{'btn-success': bridge.enabled}"
                            @click="toggleBridge(bridge)"
                            x-text="bridge.enabled ? '⏸ Disable' : '▶ Enable'">
                    </button>
                    <button class="btn btn-ghost" style="font-size:12px;" @click="openEditBridge(bridge)">✏ Edit</button>
                    <button class="btn btn-danger" style="font-size:11px;padding:4px 10px;" @click="deleteBridge(bridge.id)">Delete</button>
                  </div>
                </div>

                <div class="bridge-route">
                  <div class="bridge-topic-block">
                    <div style="font-size:10px;color:var(--muted);margin-bottom:3px;">SOURCE</div>
                    <div class="bridge-topic-row">
                      <span class="mono bridge-topic" :title="trafficTitle(bridge.id, 'SOURCE', bridge.source?.topic)"
                            x-text="bridge.source?.topic || '?'"></span>
                      <span class="bridge-count" x-text="trafficLabel(bridge.id, 'SOURCE', bridge.source?.topic)"></span>
                    </div>
                  </div>
                  <div class="bridge-arrow">
                    <template x-if="bridge.enabled && bridges.status[bridge.id]?.running">
                      <span class="bridge-arrow-animated">→</span>
                    </template>
                    <template x-if="!(bridge.enabled && bridges.status[bridge.id]?.running)">
                      <span style="color:var(--muted);">→</span>
                    </template>
                  </div>
                  <div class="bridge-topic-block">
                    <div style="font-size:10px;color:var(--muted);margin-bottom:3px;"
                         x-text="bridgeDestTopics(bridge).length > 1 ? 'DESTINATIONS (' + bridgeDestTopics(bridge).length + ')' : 'DESTINATION'"></div>
                    <template x-for="dt in bridgeDestTopics(bridge)" :key="dt">
                      <div class="bridge-topic-row">
                        <span class="mono bridge-topic" :title="trafficTitle(bridge.id, 'DESTINATION', dt)" x-text="dt"></span>
                        <span class="bridge-count" x-text="trafficLabel(bridge.id, 'DESTINATION', dt)"></span>
                      </div>
                    </template>
                    <template x-if="bridgeDestTopics(bridge).length === 0">
                      <span class="mono bridge-topic">?</span>
                    </template>
                  </div>
                </div>

                <div class="bridge-card-meta">
                  <span style="font-size:11px;color:var(--muted);">
                    sub: <span class="mono" x-text="bridge.source?.subscription || ''"></span>
                    (<span x-text="bridge.source?.subscriptionType || 'Shared'"></span>)
                  </span>
                  <div class="bridge-stats">
                    <template x-if="bridges.status[bridge.id]?.running">
                      <span class="tag tag-blue" x-text="(bridges.status[bridge.id].messagesForwarded || 0).toLocaleString('en') + ' forwarded'"></span>
                    </template>
                    <template x-if="bridges.status[bridge.id]?.errors > 0">
                      <span class="tag tag-orange" x-text="bridges.status[bridge.id].errors + ' errors'"></span>
                    </template>
                    <template x-if="!bridge.enabled">
                      <span class="tag" style="background:rgba(100,116,139,.15);color:var(--muted);">disabled</span>
                    </template>
                    <template x-if="bridge.enabled && bridges.status[bridge.id]?.state === 'FAILED'">
                      <span class="tag tag-failed"
                            :title="'Retry at ' + fmtDate(bridges.status[bridge.id].nextRetryAt)"
                            x-text="'failed: ' + truncate(bridges.status[bridge.id].lastError, 60)"></span>
                    </template>
                    <template x-if="bridge.enabled && bridges.status[bridge.id]?.state === 'BLOCKED'">
                      <span class="tag tag-failed" :title="bridges.status[bridge.id].lastError">blocked: message loop</span>
                    </template>
                    <template x-if="bridge.enabled && !bridges.status[bridge.id]?.running && !['FAILED', 'BLOCKED'].includes(bridges.status[bridge.id]?.state)">
                      <span class="tag" style="background:rgba(234,179,8,.12);color:#ca8a04;">starting…</span>
                    </template>
                    <span class="tag tag-blue" x-text="bridge.ordered ? 'ordered' : 'unordered'"></span>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </template>

      </div>
    </template>

    <!-- ─ Overview: cluster (tenants), tenant (namespaces) or namespace (topics) — Catametricas statistics ─ -->
    <template x-if="!bridgesView && !sel.topic">
      <section class="overview" aria-labelledby="overview-title">
        <header class="overview-head">
          <div>
            <h2 id="overview-title" x-text="overviewTitle()"></h2>
            <p class="muted overview-fresh" x-text="overviewFreshness()"></p>
          </div>
          <div class="overview-controls">
            <div class="seg" role="group" aria-label="Period">
              <template x-for="p in ['1h', '24h', '7d', '30d']" :key="p">
                <button type="button" :class="{ active: overview.period === p }" :aria-pressed="overview.period === p"
                        @click="setOverviewPeriod(p)" x-text="p"></button>
              </template>
            </div>
            <div class="seg" role="group" aria-label="Chart">
              <template x-for="[m, label] in Object.entries({ in: 'Published', out: 'Delivered', backlog: 'Backlog' })" :key="m">
                <button type="button" :class="{ active: overview.metric === m }" :aria-pressed="overview.metric === m"
                        @click="setOverviewMetric(m)" x-text="label"></button>
              </template>
            </div>
          </div>
        </header>

        <template x-if="overview.loading">
          <div style="text-align:center;padding:60px"><div class="spinner"></div></div>
        </template>
        <template x-if="!overview.loading && overview.error">
          <div class="card empty"><p x-text="'Statistics unavailable: ' + overview.error"></p></div>
        </template>

        <template x-if="!overview.loading && !overview.error && overview.data">
          <div>
            <div class="stats-grid">
              <div class="stat-card">
                <div class="stat-label">Backlog now</div>
                <div class="stat-value" x-text="fmtNum(overview.data.summary.current?.backlogMsgs ?? 0)"></div>
                <div class="stat-sub" x-text="fmtBytes(overview.data.summary.current?.backlogBytes ?? 0) + ' waiting'"></div>
              </div>
              <div class="stat-card">
                <div class="stat-label">Rate now</div>
                <div class="stat-value" x-text="fmt(overview.data.summary.current?.msgRateIn ?? 0)"></div>
                <div class="stat-sub" x-text="'msg/s in · ' + fmt(overview.data.summary.current?.msgRateOut ?? 0) + ' out'"></div>
              </div>
              <div class="stat-card">
                <div class="stat-label" x-text="'Published · ' + overview.data.period"></div>
                <div class="stat-value" x-text="fmtNum(overview.data.summary.period.msgsIn)"></div>
                <div class="stat-sub" x-text="fmtBytes(overview.data.summary.period.bytesIn)"></div>
              </div>
              <div class="stat-card">
                <div class="stat-label" x-text="'Delivered · ' + overview.data.period"></div>
                <div class="stat-value" x-text="fmtNum(overview.data.summary.period.msgsOut)"></div>
                <div class="stat-sub" x-text="fmtBytes(overview.data.summary.period.bytesOut)"></div>
              </div>
              <div class="stat-card">
                <div class="stat-label">All time</div>
                <div class="stat-value" x-text="fmtCompact(overview.data.summary.total.msgsIn)"></div>
                <div class="stat-sub" x-text="'published · ' + fmtCompact(overview.data.summary.total.msgsOut) + ' delivered'"></div>
              </div>
              <div class="stat-card">
                <div class="stat-label">Topics</div>
                <div class="stat-value" x-text="overview.data.summary.current?.topics ?? 0"></div>
                <div class="stat-sub" x-text="(overview.data.summary.current?.subscriptions ?? 0) + ' subs · ' + (overview.data.summary.current?.producers ?? 0) + ' prod · ' + (overview.data.summary.current?.consumers ?? 0) + ' cons'"></div>
              </div>
              <div class="stat-card">
                <div class="stat-label">Storage</div>
                <div class="stat-value" x-text="fmtBytes(overview.data.summary.current?.storageSize ?? 0)"></div>
              </div>
            </div>

            <div class="card chart-card">
              <div class="card-title"><span class="dot"></span>
                <span x-text="{ in: 'Published', out: 'Delivered', backlog: 'Backlog' }[overview.metric] + ' · last ' + overview.data.period"></span>
                <span class="chart-hover muted" x-show="overview.hover" x-text="overview.hover?.text"></span>
              </div>
              <div class="chart">
                <div class="chart-y" aria-hidden="true">
                  <template x-for="(l, i) in chartModel().yLabels" :key="i"><span x-text="l"></span></template>
                </div>
                <div class="chart-plot">
                  <svg viewBox="0 0 760 160" preserveAspectRatio="none" role="img"
                       :aria-label="overviewTitle() + ' — ' + overview.metric + ' per bucket'"
                       @mousemove="chartHover($event)" @mouseleave="overview.hover = null">
                    <line x1="0" y1="1" x2="760" y2="1" class="chart-grid"/>
                    <line x1="0" y1="80" x2="760" y2="80" class="chart-grid"/>
                    <line x1="0" y1="159" x2="760" y2="159" class="chart-grid"/>
                    <path :d="chartModel().line" class="chart-line" vector-effect="non-scaling-stroke"/>
                    <line x-show="overview.hover" :x1="overview.hover?.x ?? 0" :x2="overview.hover?.x ?? 0"
                          y1="0" y2="160" class="chart-cursor" vector-effect="non-scaling-stroke"/>
                  </svg>
                  <div class="chart-x" aria-hidden="true">
                    <template x-for="(l, i) in chartModel().xLabels" :key="i"><span x-text="l.text"></span></template>
                  </div>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-title"><span class="dot"></span><span x-text="overviewRowLabel()"></span></div>
              <template x-if="overviewRows().length === 0">
                <p class="muted" style="font-size:13px;">Nothing here yet.</p>
              </template>
              <template x-if="overviewRows().length > 0">
                <div class="table-wrap">
                  <table class="overview-table">
                    <thead>
                      <tr>
                        <th scope="col">Name</th>
                        <th scope="col">Backlog</th>
                        <th scope="col">Rate now</th>
                        <th scope="col">Storage</th>
                        <th scope="col" x-text="'Last ' + overview.data.period"></th>
                        <th scope="col">All time</th>
                        <th scope="col" x-text="{ in: 'Published', out: 'Delivered', backlog: 'Backlog' }[overview.metric]"></th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="row in overviewRows()" :key="row.name">
                        <tr :class="{ clickable: canDrill(row), gone: row.gone }" @click="drill(row)">
                          <td>
                            <template x-if="canDrill(row)">
                              <button type="button" class="row-link" @click.stop="drill(row)" x-text="row.name"></button>
                            </template>
                            <template x-if="!canDrill(row)">
                              <span class="row-name" x-text="row.name"
                                    :title="row.gone ? 'No longer exists; its history still counts' : (overviewScope() === 'namespace' ? 'Partitioned topic: open a partition in the sidebar' : '')"></span>
                            </template>
                            <template x-if="row.gone"><span class="tag tag-binary">deleted</span></template>
                            <div class="row-sub muted" x-show="row.current"
                                 x-text="overviewScope() === 'namespace'
                                   ? (row.current?.partitions > 1 ? row.current.partitions + ' partitions · ' : '') + (row.current?.subscriptions ?? 0) + ' subs · ' + (row.current?.producers ?? 0) + ' prod · ' + (row.current?.consumers ?? 0) + ' cons'
                                   : (row.current?.topics ?? 0) + ' topics · ' + (row.current?.subscriptions ?? 0) + ' subs · ' + (row.current?.consumers ?? 0) + ' cons'"></div>
                          </td>
                          <td>
                            <template x-if="row.current">
                              <div><span :class="row.current.backlogMsgs ? 'num-strong' : 'muted'" x-text="fmtNum(row.current.backlogMsgs)"></span>
                                <div class="row-sub muted" x-text="fmtBytes(row.current.backlogBytes)"></div></div>
                            </template>
                            <template x-if="!row.current"><span class="muted">—</span></template>
                          </td>
                          <td>
                            <template x-if="row.current">
                              <div><span x-text="fmt(row.current.msgRateIn) + ' in'"></span>
                                <div class="row-sub muted" x-text="fmt(row.current.msgRateOut) + ' out /s'"></div></div>
                            </template>
                            <template x-if="!row.current"><span class="muted">—</span></template>
                          </td>
                          <td><span :class="{ muted: !row.current }" x-text="row.current ? fmtBytes(row.current.storageSize) : '—'"></span></td>
                          <td>
                            <template x-if="row.period">
                              <div><span x-text="fmtNum(row.period.msgsIn) + ' in'"></span>
                                <div class="row-sub muted" x-text="fmtNum(row.period.msgsOut) + ' out · ' + fmtBytes(row.period.bytesIn)"></div></div>
                            </template>
                            <template x-if="!row.period"><span class="muted">—</span></template>
                          </td>
                          <td>
                            <template x-if="row.total">
                              <div><span x-text="fmtCompact(row.total.msgsIn) + ' in'"></span>
                                <div class="row-sub muted" x-text="fmtCompact(row.total.msgsOut) + ' out'"></div></div>
                            </template>
                            <template x-if="!row.total"><span class="muted">—</span></template>
                          </td>
                          <td class="spark-cell">
                            <svg class="spark" viewBox="0 0 120 28" preserveAspectRatio="none" aria-hidden="true">
                              <path :d="linePath(overviewSeries(row), 120, 28)" vector-effect="non-scaling-stroke"/>
                            </svg>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>
            </div>
          </div>
        </template>
      </section>
    </template>

    <!-- ─ Topic view ─ -->
    <template x-if="!bridgesView && sel.topic">
      <div>
        <div class="tabs">
          <button class="tab" :class="{active:tab==='stats'}"  @click="tab='stats'">📊 Overview</button>
          <button class="tab" :class="{active:tab==='produce'}" @click="tab='produce'">📤 Produce</button>
          <button class="tab" :class="{active:tab==='subs'}"   @click="tab='subs';loadSubs()">🔔 Subscriptions</button>
          <button class="tab" :class="{active:tab==='backlog'}" @click="openBacklogTab()">📋 Backlog</button>
        </div>

        <!-- ── Overview tab ── -->
        <template x-if="tab==='stats'">
          <div>
            <template x-if="loading.stats">
              <div style="text-align:center;padding:40px"><div class="spinner"></div></div>
            </template>
            <template x-if="!loading.stats && stats">
              <div>
                <div class="stats-grid">
                  <div class="stat-card">
                    <div class="stat-label">Messages/s in</div>
                    <div class="stat-value" x-text="fmt(stats.msgRateIn)"></div>
                    <div class="stat-sub" x-text="fmtBytes(stats.msgThroughputIn) + '/s'"></div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-label">Messages/s out</div>
                    <div class="stat-value" x-text="fmt(stats.msgRateOut)"></div>
                    <div class="stat-sub" x-text="fmtBytes(stats.msgThroughputOut) + '/s'"></div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-label">Backlog total</div>
                    <div class="stat-value" x-text="fmtNum(stats.msgBacklog ?? sumBacklog(stats))"></div>
                    <div class="stat-sub">messages</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-label">Producers</div>
                    <div class="stat-value" x-text="Object.keys(stats.publishers ?? {}).length"></div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-label">Subscriptions</div>
                    <div class="stat-value" x-text="Object.keys(stats.subscriptions ?? {}).length"></div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-label">Storage</div>
                    <div class="stat-value" x-text="fmtBytes(stats.storageSize ?? 0)"></div>
                  </div>
                </div>

                <template x-if="stats.subscriptions && Object.keys(stats.subscriptions).length > 0">
                  <div class="card">
                    <div class="card-title"><span class="dot"></span>Subscription Details</div>
                    <div class="table-wrap">
                      <table>
                        <thead>
                          <tr>
                            <th>Name</th><th>Type</th><th>Backlog</th><th>Msg/s</th><th>Consumers</th><th></th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="[name, sub] in Object.entries(stats.subscriptions)" :key="name">
                            <tr>
                              <td><span class="mono" x-text="name"></span></td>
                              <td><span class="tag tag-blue" x-text="sub.type ?? '-'"></span></td>
                              <td><span class="mono" x-text="fmtNum(sub.msgBacklog ?? 0)"></span></td>
                              <td x-text="fmt(sub.msgRateOut ?? 0)"></td>
                              <td x-text="(sub.consumers ?? []).length"></td>
                              <td class="cell-actions">
                                <button class="btn btn-danger btn-xs"
                                        :disabled="!(sub.msgBacklog > 0)"
                                        :title="sub.msgBacklog > 0 ? 'Skip all ' + fmtNum(sub.msgBacklog) + ' backlog message(s)' : 'Backlog is empty'"
                                        @click="clearBacklog(name, sub.msgBacklog)">Clear backlog</button>
                              </td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>

        <!-- ── Produce tab ── -->
        <template x-if="tab==='produce'">
          <div class="card">
            <div class="card-title"><span class="dot"></span>Send Message</div>
            <div class="form-row">
              <div class="field">
                <label>Message Key (optional)</label>
                <input type="text" x-model="produce.key" placeholder="e.g. user-123">
              </div>
            </div>
            <div class="field" style="margin-bottom:12px;">
              <label>Payload</label>
              <textarea x-model="produce.payload" placeholder='{"event":"test","value":42}' rows="6"></textarea>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
              <button class="btn btn-primary" @click="sendMessage()" :disabled="!produce.payload || loading.produce">
                <template x-if="loading.produce"><span class="spinner"></span></template>
                <template x-if="!loading.produce"><span>📤</span></template>
                Send
              </button>
              <template x-if="produce.lastId">
                <span style="font-size:12px;color:var(--success)">✓ sent: <span class="mono" x-text="produce.lastId" style="font-size:11px;"></span></span>
              </template>
            </div>
          </div>
        </template>

        <!-- ── Subscriptions tab ── -->
        <template x-if="tab==='subs'">
          <div>
            <div class="card">
              <div class="card-title"><span class="dot"></span>Current Subscriptions</div>
              <template x-if="loading.subs">
                <div style="text-align:center;padding:20px"><div class="spinner"></div></div>
              </template>
              <template x-if="!loading.subs && subscriptions.length === 0">
                <p style="color:var(--muted);font-size:13px;">No subscriptions on this topic.</p>
              </template>
              <template x-for="sub in subscriptions" :key="sub">
                <div class="sub-item">
                  <div><div class="sub-name" x-text="sub"></div></div>
                  <button class="btn btn-danger" style="font-size:12px;padding:5px 10px;"
                          @click="deleteSub(sub)">Delete</button>
                </div>
              </template>
            </div>
            <div class="card">
              <div class="card-title"><span class="dot"></span>New Subscription</div>
              <div class="form-row">
                <div class="field">
                  <label>Subscription name</label>
                  <input type="text" x-model="newSub" placeholder="e.g. my-consumer"
                         @keydown.enter="createSub()">
                </div>
                <button class="btn btn-primary" @click="createSub()" :disabled="!newSub || loading.newSub">
                  <template x-if="loading.newSub"><span class="spinner"></span></template>
                  Create
                </button>
              </div>
            </div>
          </div>
        </template>

        <!-- ── Backlog tab: subscriptions with backlog statistics (left), peeked messages (right) ── -->
        <template x-if="tab==='backlog'">
          <div class="backlog-layout">
            <section class="card backlog-subs" aria-labelledby="backlog-subs-title">
              <div class="card-title"><span class="dot"></span><span id="backlog-subs-title">Subscriptions</span></div>
              <template x-if="backlogSubs().length === 0">
                <p class="muted backlog-empty-subs">No subscriptions on this topic.</p>
              </template>
              <ul class="backlog-sub-list">
                <template x-for="item in backlogSubs()" :key="item.name">
                  <li>
                    <button type="button" class="backlog-sub" :class="{ selected: backlog.sub === item.name }"
                            :aria-pressed="backlog.sub === item.name" @click="selectBacklogSub(item.name)">
                      <span class="backlog-sub-head">
                        <span class="backlog-sub-name mono" x-text="item.name"></span>
                        <span class="tag tag-blue" x-show="item.stats?.type" x-text="item.stats?.type"></span>
                      </span>
                      <template x-if="item.stats">
                        <span class="backlog-sub-stats">
                          <span class="backlog-count" :class="{ zero: !item.stats.msgBacklog }"
                                x-text="fmtNum(item.stats.msgBacklog ?? 0) + ' msgs'"></span>
                          <span x-text="fmtBytes(item.stats.backlogSize ?? 0)"></span>
                          <span x-text="(item.stats.consumers ?? []).length + ' consumer(s)'"></span>
                          <span x-text="fmt(item.stats.msgRateOut ?? 0) + ' msg/s out'"></span>
                          <span x-text="fmtNum(item.stats.unackedMessages ?? 0) + ' unacked'"></span>
                        </span>
                      </template>
                      <template x-if="!item.stats">
                        <span class="backlog-sub-stats muted">statistics loading…</span>
                      </template>
                    </button>
                  </li>
                </template>
              </ul>
            </section>

            <section class="backlog-detail" aria-live="polite">
              <div class="card backlog-toolbar">
                <div class="card-title" style="margin-bottom:0;">
                  <span class="dot"></span>
                  <span x-text="backlog.sub ? 'Peek' : 'Select a subscription'"></span>
                  <span class="peek-sub mono" x-show="backlog.sub" x-text="backlog.sub"></span>
                  <span class="backlog-toolbar-actions">
                    <label for="peek-count" class="muted">Count</label>
                    <input id="peek-count" type="number" min="1" max="100" x-model.number="backlog.count"
                           @change="backlog.sub && peekMessages()">
                    <button type="button" class="btn btn-ghost btn-xs" @click="peekMessages()"
                            :disabled="!backlog.sub || loading.backlog" title="Peek again" aria-label="Peek again">
                      <template x-if="loading.backlog"><span class="spinner" style="width:12px;height:12px;"></span></template>
                      <template x-if="!loading.backlog"><span>↻</span></template>
                    </button>
                  </span>
                </div>
              </div>

              <template x-if="!backlog.sub">
                <div class="card empty">
                  <p>Click a subscription to see the first messages of its backlog.</p>
                  <p class="muted" style="font-size:12px;">Peeking does not consume messages. Each peek is recorded in the audit log.</p>
                </div>
              </template>

            <template x-if="backlog.messages.length > 0">
              <div class="card">
                <div class="card-title">
                  <span class="dot"></span>
                  <span x-text="backlog.messages.length + ' message(s)'"></span>
                  <span style="font-size:11px;color:var(--muted);font-weight:400;">— peek (non-destructive)</span>
                  <span style="margin-left:auto;">
                    <button class="btn btn-danger" style="font-size:11px;padding:4px 10px;"
                            @click="skipAll()"
                            :title="'Skip all ' + backlog.messages.length + ' peeked messages from subscription'">
                      Skip all
                    </button>
                  </span>
                </div>
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>#</th>
                        <th>Message ID</th>
                        <th>Key</th>
                        <th>Published at</th>
                        <th>Payload</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="(msg, i) in backlog.messages" :key="msg.messageId">
                        <tr>
                          <td class="muted" x-text="i+1"></td>
                          <td><span class="mono" x-text="msg.messageId"></span></td>
                          <td>
                            <template x-if="msg.key">
                              <span class="tag tag-orange" x-text="msg.key"></span>
                            </template>
                            <template x-if="!msg.key"><span class="muted">—</span></template>
                          </td>
                          <td class="muted" x-text="fmtDate(msg.publishTime)"></td>
                          <td>
                            <template x-if="msg.binary">
                              <span class="tag tag-binary">binary (base64)</span>
                            </template>
                            <div class="payload" x-text="truncate(msg.payload, 120)"></div>
                          </td>
                          <td>
                            <div class="actions">
                              <button class="act" @click="openView(msg)">View</button>
                              <button class="act act-edit" @click="openEdit(msg)">Edit</button>
                              <button class="act act-skip" @click="skipMessages(i+1)"
                                      :title="'Skip ' + (i+1) + ' message(s) from cursor'">
                                Skip
                              </button>
                            </div>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </template>

            <template x-if="!loading.backlog && backlog.messages.length === 0 && backlog.queried">
              <div class="card empty">
                <div class="big">📭</div>
                <p>No messages in backlog for this subscription.</p>
              </div>
            </template>
            </section>
          </div>
        </template>

      </div>
    </template>
  </div>
</div>

<!-- ══ Toast ════════════════════════════════════════════════════════════════ -->
<div x-show="toast.msg" x-transition class="toast"
     :class="toast.type==='error' ? 'toast-error' : 'toast-success'">
  <span x-text="toast.type==='error' ? '✕' : '✓'"></span>
  <span x-text="toast.msg"></span>
</div>

</body>
</html>
