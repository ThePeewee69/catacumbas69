# The MicroShift manifests (orch.md decision 88): every folder with a kustomization.yaml is built with kustomize,
# and every resource is checked with kubeconform against its schema, before ArgoCD ever syncs it.
name: manifests

on:
  push:
    branches: [main]
    paths:
      - "microshift/**"
      - ".github/kubeconform/**"
      - ".github/workflows/manifests.yml"
      - ".github/scripts/install-manifest-tools.sh"
      - ".github/scripts/validate-manifests.sh"
  pull_request:
    paths:
      - "microshift/**"
      - ".github/kubeconform/**"
      - ".github/workflows/manifests.yml"
      - ".github/scripts/install-manifest-tools.sh"
      - ".github/scripts/validate-manifests.sh"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: kustomize + kubeconform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kustomize and kubeconform (checksums verified)
        run: bash .github/scripts/install-manifest-tools.sh

      - name: Validate
        run: bash .github/scripts/validate-manifests.sh
