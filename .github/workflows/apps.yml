# The Java apps (orch.md TEST-5, decision 88): mvn verify of the whole reactor in apps/, so tests and Checkstyle
# run on every push to main and every pull request that changes code under apps/.
name: apps

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "!apps/**/*.md"
      - ".github/workflows/apps.yml"
      - ".github/scripts/apps-verify.sh"
  pull_request:
    paths:
      - "apps/**"
      - "!apps/**/*.md"
      - ".github/workflows/apps.yml"
      - ".github/scripts/apps-verify.sh"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/**/pom.xml

      - name: mvn verify
        run: bash .github/scripts/apps-verify.sh

      - name: Keep the test and Checkstyle reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            apps/*/target/surefire-reports/
            apps/*/target/checkstyle-result.xml
          retention-days: 7
          if-no-files-found: ignore
