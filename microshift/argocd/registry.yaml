# ArgoCD Application of the image registry (orch.md decision 82): manual Sync in the UI.
# Applied by the root Application microshift (microshift/bootstrap/microshift.yaml): commit and push.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: registry
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ThePeewee69/catacumbas69.git
    targetRevision: main
    path: microshift/apps/registry
  destination:
    server: https://kubernetes.default.svc
    namespace: registry
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
