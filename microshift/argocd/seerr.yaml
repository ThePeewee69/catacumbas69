# ArgoCD Application of Seerr (orch.md decision 116): manual Sync in the UI, as the catacumbas69 apps.
# Applied by the root Application microshift (microshift/bootstrap/microshift.yaml): commit and push.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seerr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ThePeewee69/catacumbas69.git
    targetRevision: main
    path: microshift/apps/media/seerr
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
