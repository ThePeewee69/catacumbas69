# ArgoCD Application of the MongoDB Community Operator on meloes: the community-operator Helm chart, watching
# the namespace mongodb. Created in the UI and kept here as it is in the cluster (orch.md decision 86).
# AUTOMATED sync with prune and selfHeal, and targetRevision "*": it follows the newest chart version on its own,
# so a new release of the operator is installed without a change here.
# Apply (no-op while the cluster already matches): oc apply -f microshift/argocd/mongodb.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://mongodb.github.io/helm-charts
    chart: community-operator
    targetRevision: "*"
    helm:
      values: |
        operator:
          watchNamespace: mongodb
  destination:
    server: https://kubernetes.default.svc
    namespace: mongodb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
