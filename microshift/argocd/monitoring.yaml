# ArgoCD Application of the monitoring on meloes (orch.md decision 90): manual Sync in the UI.
# Three sources: the kube-prometheus-stack chart, this repository for its values ($values), and
# microshift/apps/monitoring (SCC bindings, Routes, PodMonitors, dashboards).
# Applied by the root Application microshift (microshift/bootstrap/microshift.yaml): commit and push.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.2.2
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/microshift/apps/monitoring/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/ThePeewee69/catacumbas69.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/ThePeewee69/catacumbas69.git
      targetRevision: main
      path: microshift/apps/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # the operator's CRDs are too big for a client-side apply
