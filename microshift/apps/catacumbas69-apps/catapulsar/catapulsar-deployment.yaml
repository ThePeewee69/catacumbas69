apiVersion: apps/v1
kind: Deployment
metadata:
  name: catapulsar
  labels:
    app.kubernetes.io/name: catapulsar
    app.kubernetes.io/part-of: catacumbas69
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catapulsar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catapulsar
        app.kubernetes.io/part-of: catacumbas69
    spec:
      terminationGracePeriodSeconds: 40   # OPS-5: graceful shutdown takes up to 30 s
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The OpenTelemetry Java agent (orch.md decision 104), copied into a shared volume so the app's image stays as
        # built. Tag 2: the newest 2.x, pulled again on every start
        - name: otel-agent
          image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2
          imagePullPolicy: Always
          command: ["cp", "/javaagent.jar", "/otel/javaagent.jar"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: otel-agent
              mountPath: /otel
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: catapulsar
          image: registry.catacumbas69.com/catapulsar
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: catapulsar-config
          env:
            # Heap up to 50 % of the memory limit (~448 Mi), leaving room for metaspace, code cache, Netty buffers and
            # thread stacks; exit on OutOfMemoryError so the pod restarts (orch.md decision 89).
            # The truststore: the public CAs plus ours, to reach Dex at https://auth.catacumbas69.com (decision 97)
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -javaagent:/otel/javaagent.jar -XX:MaxRAMPercentage=50.0 -XX:+ExitOnOutOfMemoryError
                -Djavax.net.ssl.trustStore=/etc/catacumbas69-ca/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12
                -Djavax.net.ssl.trustStorePassword=changeit
            # Login through Dex (SEC-2, decision 100): the client secret made by microshift/apps/dex/dex-secret.sh
            - name: CATAPULSAR_AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: catapulsar-oidc
                  key: client-secret
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: catacumbas69-apps-mongodb
                  key: uri
            # Spring turns its banner off when the console log is JSON (OBS-3); console prints it at start-up as
            # plain lines, as in a terminal (orch.md decision 108)
            - name: SPRING_MAIN_BANNER_MODE
              value: console
            # Traces (orch.md decision 104): the agent sends them over OTLP to Alloy, which forwards them to Tempo.
            # Metrics stay with Prometheus (/actuator/prometheus) and logs on stdout (OBS-3), so the agent exports
            # neither; it puts trace_id and span_id in the MDC, which the ECS log lines carry
            - name: OTEL_SERVICE_NAME
              value: catapulsar
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc.cluster.local:4318
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            # Only what the apps use (orch.md decision 105): with the agent's 100+ instrumentations on, starting 9 JVMs
            # together on meloes' 4 CPUs took longer than the startup probe allows. Server: Tomcat, servlet, Spring MVC;
            # clients: RestClient (HttpURLConnection, JDK HttpClient), Pulsar admin (async-http-client); MongoDB, Pulsar;
            # the trace across our executors and CompletableFutures; trace_id and span_id in the MDC
            - name: OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED
              value: "false"
            - name: OTEL_INSTRUMENTATION_TOMCAT_ENABLED
              value: "true"
            - name: OTEL_INSTRUMENTATION_SERVLET_ENABLED
              value: "true"
            - name: OTEL_INSTRUMENTATION_SPRING_WEBMVC_ENABLED
              value: "true"
            - name: OTEL_INSTRUMENTATION_HTTP_URL_CONNECTION_ENABLED
              value: "true"
            - name: OTEL_INSTRUMENTATION_JAVA_HTTP_CLIENT_ENABLED
              value: "true"
            - name: OTEL_INSTRUMENTATION_ASYNC_HTTP_CLIENT_ENABLED
              value: "true"
            - name: OTEL_INSTRUMENTATION_MONGO_ENABLED
              value: "true"
            - name: OTEL_INSTRUMENTATION_PULSAR_ENABLED
              value: "true"
            - name: OTEL_INSTRUMENTATION_EXECUTORS_ENABLED
              value: "true"
            - name: OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=catacumbas69,k8s.namespace.name=catacumbas69-apps,k8s.pod.name=$(POD_NAME)
          resources:
            requests:
              cpu: 25m   # meloes has 4 CPUs and its requests were full (orch.md decision 85); the limit still allows 1 CPU
              memory: 448Mi   # +64 Mi and +128 Mi for the OpenTelemetry agent (orch.md decision 104)
            limits:
              cpu: "1"
              memory: 896Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60   # up to 5 minutes: after meloes reboots, every pod starts at once on 4 CPUs
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: catacumbas69-ca
              mountPath: /etc/catacumbas69-ca
              readOnly: true
            - name: otel-agent
              mountPath: /otel
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: otel-agent   # the OpenTelemetry agent, copied by the init container
          emptyDir:
            sizeLimit: 64Mi
        # Written and kept up to date by trust-manager (microshift/apps/tls/ca-bundle.yaml)
        - name: catacumbas69-ca
          configMap:
            name: catacumbas69-ca
