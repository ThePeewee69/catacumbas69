apiVersion: apps/v1
kind: Deployment
metadata:
  name: catapulsar
  labels:
    app.kubernetes.io/name: catapulsar
    app.kubernetes.io/part-of: catacumbas69
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catapulsar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catapulsar
        app.kubernetes.io/part-of: catacumbas69
    spec:
      terminationGracePeriodSeconds: 40   # OPS-5: graceful shutdown takes up to 30 s
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catapulsar
          image: registry.catacumbas69.com/catapulsar
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: catapulsar-config
          env:
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: catacumbas69-apps-mongodb
                  key: uri
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36   # up to 3 minutes to start on a busy node
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
