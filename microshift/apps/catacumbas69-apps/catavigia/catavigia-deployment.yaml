apiVersion: apps/v1
kind: Deployment
metadata:
  name: catavigia
  labels:
    app.kubernetes.io/name: catavigia
    app.kubernetes.io/part-of: catacumbas69
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catavigia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catavigia
        app.kubernetes.io/part-of: catacumbas69
    spec:
      terminationGracePeriodSeconds: 40   # OPS-5: graceful shutdown takes up to 30 s
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catavigia
          image: registry.catacumbas69.com/catavigia
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          envFrom:
            - configMapRef:
                name: catavigia-config
          env:
            # Heap up to 50 % of the memory limit (~384 Mi), leaving room for metaspace, code cache, Netty buffers and
            # thread stacks; exit on OutOfMemoryError so the pod restarts (orch.md decision 89)
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=50.0 -XX:+ExitOnOutOfMemoryError"
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: catacumbas69-apps-mongodb
                  key: uri
          resources:
            requests:
              cpu: 25m   # meloes has 4 CPUs and its requests were full (orch.md decision 85); the limit still allows 1 CPU
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60   # up to 5 minutes: after meloes reboots, every pod starts at once on 4 CPUs
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
