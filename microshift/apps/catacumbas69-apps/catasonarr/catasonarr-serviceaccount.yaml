# Catasonarr's own service account (orch.md decision 112): it runs as user and group 1000, as Sonarr does
# (PUID/PGID 1000), so the files it writes on the NAS belong to the same user. The default restricted-v2 refuses a
# fixed UID, so this one account gets nonroot-v2 (any UID but root), declared here as in microshift/apps/observability.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catasonarr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: catasonarr-scc-nonroot-v2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2
subjects:
  - kind: ServiceAccount
    name: catasonarr
    namespace: catacumbas69-apps
