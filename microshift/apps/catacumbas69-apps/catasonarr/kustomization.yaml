# Catasonarr: TV series manager speaking Sonarr's API v3 (orch.md decision 109). GPL-3.0 (apps/catasonarr/LICENSE).
# apps/build/push.sh catasonarr builds the image, pushes it and writes newTag below; then commit and Sync in ArgoCD.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: catacumbas69-apps
resources:
  - catasonarr-configmap.yaml
  - catasonarr-serviceaccount.yaml
  - catasonarr-storage.yaml
  - catasonarr-deployment.yaml
  - catasonarr-service.yaml
  - catasonarr-route.yaml
images:
  - name: registry.catacumbas69.com/catasonarr
    newTag: "0.1.0-SNAPSHOT-dec07e6"
