# Our own CA (orch.md decision 97): a self-signed root of 10 years, generated and kept by cert-manager in the Secret
# cert-manager/catacumbas69-ca. Its certificate is what the Mac and the iPhone trust (README.md); its key never
# leaves the cluster, except in the backup that microshift/apps/tls/ca.sh keeps on the Mac.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: catacumbas69-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: catacumbas69 CA
  subject:
    organizations:
      - catacumbas69
  duration: 87600h   # 10 years
  secretName: catacumbas69-ca
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never   # a renewal keeps the key, so the devices keep trusting it
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
# Issues from the CA above. A ClusterIssuer reads its Secret from cert-manager's own namespace
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: catacumbas69-ca
spec:
  ca:
    secretName: catacumbas69-ca
