# Our CA for the pods that call Dex over HTTPS (orch.md decision 97). trust-manager writes a ConfigMap
# catacumbas69-ca with the public CAs (useDefaultCAs) plus ours, as PEM (ca.crt, for Grafana) and as a Java
# truststore (truststore.p12, for Catapulsar), in the namespaces listed below, and keeps it up to date.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: catacumbas69-ca
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        name: catacumbas69-ca
        key: ca.crt
  target:
    configMap:
      key: ca.crt
    additionalFormats:
      pkcs12:
        key: truststore.p12
        # Not a secret (public certificates only): Java's usual default, so the JVM can check the store
        password: changeit
        profile: Modern2023
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - catacumbas69-apps
            - monitoring
