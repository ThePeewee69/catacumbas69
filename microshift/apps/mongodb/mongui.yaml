apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongui
  namespace: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongui
  template:
    metadata:
      labels:
        app: mongui
    spec:
      containers:
        - name: mongui
          image: docker.io/soumyaranajan/mongui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: MONGODB_URI
              value: "mongodb://peewee69:Pass123-456-789@catacumbas69-svc.mongodb.svc.cluster.local:27017/admin?replicaSet=catacumbas69"
            - name: SESSION_SECRET
              value: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
            - name: ADMIN_USER
              value: "peewee69"
            - name: ADMIN_PASSWORD
              value: "Pass123-456-789"
---
apiVersion: v1
kind: Service
metadata:
  name: mongui
  namespace: mongodb
spec:
  ports:
    - name: http
      port: 80
      targetPort: 3000
  selector:
    app: mongui
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mongui-web
  namespace: mongodb
spec:
  host: mongui.catacumbas69.com
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: mongui
    weight: 100
  port:
    targetPort: http