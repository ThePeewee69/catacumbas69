apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mongo-express-web
  namespace: mongodb
spec:
  host: mongo-express.catacumbas69.com
  tls:
    termination: edge   # the router's wildcard certificate (orch.md decision 97)
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: mongo-express
    weight: 100
  port:
    targetPort: 8081