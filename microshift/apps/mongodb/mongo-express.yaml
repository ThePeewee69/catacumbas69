# mongo-express: the web UI of MongoDB on meloes (orch.md decision 101), at https://mongo-express.catacumbas69.com.
# Nothing secret here: it connects as peewee69 with the connection string the operator writes into
# peewee69-connection, and its basic-auth login comes from mongo-express-auth (microshift/apps/mongodb/mongo-admin.sh).
# Both are read at start-up: the script restarts it after a change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  namespace: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
        - name: mongo-express
          image: docker.io/library/mongo-express:1.0.0-alpha.4
          ports:
            - containerPort: 8081
          env:
            - name: ME_CONFIG_MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: peewee69-connection
                  key: connectionString.standard
            - name: ME_CONFIG_BASICAUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-express-auth
                  key: username
            - name: ME_CONFIG_BASICAUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-express-auth
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express
  namespace: mongodb
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: mongo-express
