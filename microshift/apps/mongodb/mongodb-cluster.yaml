apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: catacumbas69
  namespace: mongodb
spec:
  members: 3
  type: ReplicaSet
  version: "7.0.0"
  security:
    authentication:
      modes: ["SCRAM"]
  users:
    - name: peewee69
      db: admin
      passwordSecretRef:
        name: mongodb-password
      roles:
        - name: clusterAdmin
          db: admin
        - name: userAdminAnyDatabase
          db: admin
        - name: readWriteAnyDatabase
          db: admin
      scramCredentialsSecretName: peewee69-scram
    # The catacumbas69 apps (orch.md decision 84): read and write on catacumbas69 only. Its password Secret is
    # created by apps/build/mongo-secret.sh password (never in git); the operator writes the connection string to
    # catacumbas69-apps-connection, which apps/build/mongo-secret.sh copy copies to the apps' namespace.
    - name: catacumbas69-apps
      db: admin
      passwordSecretRef:
        name: catacumbas69-apps-password
      roles:
        - name: readWrite
          db: catacumbas69
      scramCredentialsSecretName: catacumbas69-apps-scram
      connectionStringSecretName: catacumbas69-apps-connection
  additionalMongodConfig:
    storage.wiredTiger.engineConfig.journalCompressor: zlib
  statefulSet:
    spec:
      template:
        spec:
          containers:
            - name: mongod
              resources:
                requests:
                  memory: 512Mi
                  cpu: 250m
                limits:
                  memory: 1Gi
                  cpu: 500m