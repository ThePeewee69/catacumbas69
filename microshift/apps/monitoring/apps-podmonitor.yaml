# The catacumbas69 apps: /actuator/prometheus of every replica, found by its labels (orch.md decision 90).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: catacumbas69-apps
spec:
  namespaceSelector:
    matchNames:
      - catacumbas69-apps
  selector:
    matchLabels:
      app.kubernetes.io/part-of: catacumbas69
  podMetricsEndpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      # `action: replace` is the default, but written out: the CRD fills it in, and ArgoCD would show OutOfSync
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          targetLabel: app
