# Values of kube-prometheus-stack 93.2.2 on meloes (orch.md decision 90), read by microshift/argocd/monitoring.yaml.
# A lean stack: operator, Prometheus, Grafana, kube-state-metrics and node-exporter; no Alertmanager (Catavigia
# raises the alerts), and none of the control-plane targets MicroShift runs inside its own process.
# CPU requests are small because meloes' requests are nearly full (decision 85); memory is what really counts.

# ── Off: Alertmanager and what MicroShift does not expose ─────────────────
alertmanager:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false   # openshift-dns serves its metrics behind kube-rbac-proxy
kubeDns:
  enabled: false
windowsMonitoring:
  enabled: false

defaultRules:
  create: true
  rules:
    alertmanager: false
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false

# ── Operator ──────────────────────────────────────────────────────────────
prometheusOperator:
  # No admission webhooks: they need certificate jobs and hooks that ArgoCD keeps showing as out of sync
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 5m
        memory: 25Mi
      limits:
        memory: 64Mi

# ── Prometheus ────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    # Every ServiceMonitor, PodMonitor and PrometheusRule in the cluster, not only the chart's
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 30s
    evaluationInterval: 30s
    retention: 30d
    retentionSize: 17GB   # deletes the oldest data before the 20 Gi volume fills
    externalLabels:
      kubernetes_cluster: meloes
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: topolvm-provisioner
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

# ── Kubelet: cAdvisor for the containers ──────────────────────────────────
kubelet:
  enabled: true
  serviceMonitor:
    cAdvisor: true

# ── kube-state-metrics: pod and container state (restarts, Ready, limits) ─
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

# ── node-exporter: the meloes host (needs the privileged SCC, monitoring-scc.yaml) ─
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  # Replaces the chart's list, so its two filesystem filters are repeated here, with CRI-O's paths
  extraArgs:
    - --collector.pressure   # PSI: needs psi=1 on the kernel command line (it has it since 2026-11-11)
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containers/storage/.+|var/lib/containers/storage/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs|tmpfs)$

# ── Grafana ───────────────────────────────────────────────────────────────
grafana:
  admin:
    existingSecret: grafana-admin   # created by grafana-secret.sh, never in git
    userKey: admin-user
    passwordKey: admin-password
  deploymentStrategy:
    type: Recreate   # the volume is ReadWriteOnce
  persistence:
    enabled: true
    storageClassName: topolvm-provisioner
    size: 1Gi
  initChownData:
    enabled: false   # runs as root, which the SCC refuses; the volume is already owned by the pod's group
  # 512Mi was too tight for Grafana 12 (search indexes in memory): near the limit it stopped answering and was
  # killed. GOMEMLIMIT tells Go's garbage collector where to stop, below the container limit.
  env:
    GOMEMLIMIT: 800MiB
  # Login through Dex (orch.md decision 98): the client secret comes from the Secret monitoring/grafana-oidc, made by
  # microshift/apps/dex/dex-secret.sh
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc
        key: client-secret
  # Our CA, to trust https://auth.catacumbas69.com (ConfigMap written by trust-manager, decision 97)
  extraConfigmapMounts:
    - name: catacumbas69-ca
      configMap: catacumbas69-ca
      mountPath: /etc/catacumbas69-ca
      readOnly: true
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 1Gi
  grafana.ini:
    server:
      domain: grafana.microshift.catacumbas69.com
      root_url: https://grafana.microshift.catacumbas69.com
    security:
      cookie_secure: true
    # Dashboards stay visible without login; "Sign in" goes straight to Dex (auto_login). The local admin
    # (grafana-admin, grafana-secret.sh) remains for emergencies at /login?disableAutoLogin=true
    auth.anonymous:
      enabled: true
      org_role: Viewer
    auth.generic_oauth:
      enabled: true
      name: Dex
      client_id: grafana
      scopes: openid profile email
      auth_url: https://auth.catacumbas69.com/auth
      token_url: https://auth.catacumbas69.com/token
      api_url: https://auth.catacumbas69.com/userinfo
      # Sign out ends Dex's session too (Dex asks to confirm: it needs an id_token_hint to send you back, which
      # Grafana does not pass), otherwise auto_login would log you straight back in
      signout_redirect_url: https://auth.catacumbas69.com/logout
      tls_client_ca: /etc/catacumbas69-ca/ca.crt
      use_pkce: true
      auto_login: true
      allow_sign_up: true
      login_attribute_path: preferred_username
      # Only peewee69 is let in, as Admin (decision 98); anyone else Dex knew would be refused
      role_attribute_path: "preferred_username == 'peewee69' && 'Admin' || ''"
      role_attribute_strict: true
    analytics:
      reporting_enabled: false
      check_for_updates: false
  sidecar:
    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits:
        memory: 128Mi
    dashboards:
      folderAnnotation: grafana_folder   # the dashboards of microshift/apps/monitoring/dashboards/ go to their folder
      provider:
        foldersFromFilesStructure: true
  # Every other dashboard, the JVM ones from grafana.com included, is a JSON file in dashboards/ (kustomization.yaml)
