# HTTPS with the router's wildcard (orch.md decision 97). No authentication: home network only.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: prometheus
spec:
  host: prometheus.microshift.catacumbas69.com
  tls:
    termination: edge   # the router's wildcard certificate (orch.md decision 97)
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: prometheus-kube-prometheus-prometheus
    weight: 100
  port:
    targetPort: http-web
