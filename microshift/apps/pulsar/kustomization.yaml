apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Broker
  - broker-deployment.yaml
  - broker-pvc.yaml
  - broker-svc.yaml
  - broker-svc-nodeport.yaml
  - broker-route.yaml
  # Pulsar Manager
  - manager-deployment.yaml
  - manager-svc.yaml
  - manager-route.yaml
  # Admin Console
  - console-deployment.yaml
  - console-svc.yaml
  - console-route.yaml

configMapGenerator:
  - name: pulsar-admin-console-config
    namespace: pulsar
    options:
      disableNameSuffixHash: true   # evita sufixo aleatório no nome
    files:
      - default.json=console-config.json
