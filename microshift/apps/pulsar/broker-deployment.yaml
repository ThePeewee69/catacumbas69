apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsar
  namespace: pulsar
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pulsar
  template:
    metadata:
      labels:
        app: pulsar
    spec:
      securityContext:
        runAsUser: 1000150000
        runAsGroup: 1000150000
        fsGroup: 1000150000
      initContainers:
        - name: conf-init
          image: docker.io/apachepulsar/pulsar:4.2.2
          command: ["/bin/sh", "/scripts/init.sh"]
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: pulsar-conf
              mountPath: /conf
            - name: pulsar-data
              mountPath: /pulsar/data
            - name: init-script
              mountPath: /scripts
      containers:
        - name: pulsar
          image: docker.io/apachepulsar/pulsar:4.2.2
          command: ["bin/pulsar"]
          args:
            - standalone
            - --no-functions-worker
          ports:
            - containerPort: 6650
              name: broker
            - containerPort: 8080
              name: admin
            - containerPort: 3181
              name: bookie
          env:
            - name: PULSAR_MEM
              value: "-Xms512m -Xmx1g -XX:MaxDirectMemorySize=1g"
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: pulsar-conf
              mountPath: /pulsar/conf
            - name: pulsar-logs
              mountPath: /pulsar/logs
            - name: pulsar-data
              mountPath: /pulsar/data
          readinessProbe:
            tcpSocket:
              port: 6650
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 3Gi
              cpu: 2
      volumes:
        - name: pulsar-conf
          emptyDir: {}
        - name: pulsar-logs
          emptyDir: {}
        - name: pulsar-data
          persistentVolumeClaim:
            claimName: pulsar-data-pvc
        - name: init-script
          configMap:
            name: pulsar-init-script
            defaultMode: 0755
