apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsar-manager
  namespace: pulsar
spec:
  replicas: 1
  # RWO + HerdDB embebido: nunca dois pods ao mesmo tempo sobre a mesma base de dados
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pulsar-manager
  template:
    metadata:
      labels:
        app: pulsar-manager
    spec:
      containers:
        - name: pulsar-manager
          image: docker.io/apachepulsar/pulsar-manager:v0.4.0
          ports:
            - containerPort: 9527
              name: web
            - containerPort: 7750
              name: api
          env:
            - name: SPRING_CONFIGURATION_FILE
              value: /pulsar-manager/pulsar-manager/application.properties
            # Environment criado no arranque se a base de dados não tiver nenhum (default.environment.* da v0.4.0).
            # Com a base de dados vazia e o broker inacessível, o Manager termina e volta a tentar.
            - name: DEFAULT_ENVIRONMENT_NAME
              value: catacumbas69
            - name: DEFAULT_ENVIRONMENT_SERVICE_URL
              value: http://pulsar.pulsar.svc.cluster.local:8080
            # O standalone não expõe o HTTP do bookie: a página Bookies não funciona, o resto sim
            - name: DEFAULT_ENVIRONMENT_BOOKIE_URL
              value: http://pulsar.pulsar.svc.cluster.local:8000
          volumeMounts:
            # HerdDB: jdbc:herddb:server:localhost:7000?server.base.dir=dbdata, relativo a /pulsar-manager/pulsar-manager
            - name: data
              mountPath: /pulsar-manager/pulsar-manager/dbdata
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pulsar-manager-data-pvc
