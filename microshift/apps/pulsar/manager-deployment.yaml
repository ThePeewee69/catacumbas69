apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsar-manager
  namespace: pulsar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulsar-manager
  template:
    metadata:
      labels:
        app: pulsar-manager
    spec:
      containers:
        - name: pulsar-manager
          image: docker.io/apachepulsar/pulsar-manager:v0.4.0
          ports:
            - containerPort: 9527
              name: web
            - containerPort: 7750
              name: api
          env:
            - name: SPRING_CONFIGURATION_FILE
              value: /pulsar-manager/pulsar-manager/application.properties
            - name: DEFAULT_SUPERUSER_ENABLED
              value: "true"
            - name: DEFAULT_SUPERUSER_NAME
              value: "peewee69"
            - name: DEFAULT_SUPERUSER_PASSWORD
              value: "Pass123-456-789"
            - name: DEFAULT_SUPERUSER_EMAIL
              value: "hpereira@gmail.com"
