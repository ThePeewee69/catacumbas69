apiVersion: v1
kind: Service
metadata:
  name: pulsar-external
  namespace: pulsar
spec:
  type: NodePort
  ports:
    - name: broker
      port: 6650
      targetPort: 6650
      nodePort: 31650
    - name: admin
      port: 8080
      targetPort: 8080
      nodePort: 31080
  selector:
    app: pulsar
