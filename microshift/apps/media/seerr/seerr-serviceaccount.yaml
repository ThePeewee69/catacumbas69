# Seerr's image runs as its node user (UID 1000) and owns /app as that user, so the pod keeps UID 1000. The default
# restricted-v2 refuses a fixed UID, so this one account gets nonroot-v2 (any UID but root), as Catasonarr's.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seerr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seerr-scc-nonroot-v2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2
subjects:
  - kind: ServiceAccount
    name: seerr
    namespace: media
