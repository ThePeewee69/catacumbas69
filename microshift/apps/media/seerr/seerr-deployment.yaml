apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  labels:
    app.kubernetes.io/name: seerr
spec:
  replicas: 1
  strategy:
    type: Recreate   # the volume is ReadWriteOnce, and SQLite takes one writer
  selector:
    matchLabels:
      app.kubernetes.io/name: seerr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seerr
    spec:
      serviceAccountName: seerr
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000    # the image's node user (seerr-serviceaccount.yaml)
        runAsGroup: 1000
        fsGroup: 1000      # /app/config writable by it
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:v3.5.2
          ports:
            - name: http
              containerPort: 5055
          env:
            - name: TZ
              value: Europe/Lisbon
            - name: LOG_LEVEL
              value: info
            - name: PORT
              value: "5055"
            # Our CA (and the public ones), so Seerr trusts https://catasonarr.catacumbas69.com and the other
            # *.catacumbas69.com Routes (orch.md decision 97); trust-manager writes it here (apps/tls/ca-bundle.yaml)
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/catacumbas69-ca/ca.crt
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: catacumbas69-ca
              mountPath: /etc/catacumbas69-ca
              readOnly: true
          # Seerr's own health check, as its Helm chart's; up to 5 minutes to start (orch.md decision 92)
          startupProbe:
            httpGet:
              path: /api/v1/settings/public
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/settings/public
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/settings/public
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr-config
        - name: catacumbas69-ca
          configMap:
            name: catacumbas69-ca
